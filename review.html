<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta name="theme-color" content="#4361ee">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Повторение">
    <meta name="application-name" content="Повторение">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%234361ee'/%3E%3Ctext x='50' y='67' font-size='56' text-anchor='middle' fill='white' font-family='system-ui, sans-serif'%3E🧠%3C/text%3E%3C/svg%3E">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%234361ee'/%3E%3Ctext x='50' y='67' font-size='56' text-anchor='middle' fill='white' font-family='system-ui, sans-serif'%3E🧠%3C/text%3E%3C/svg%3E">
    
    <title>🧠 Повторение — Китайский язык</title>
    
    <!-- ПОДКЛЮЧАЕМ ДАННЫЕ -->
    <script src="WORDS.js"></script>
    <script src="RADICALS.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', Roboto, Helvetica, Arial, sans-serif;
            background: #f0f4ff;
            color: #1a1a2e;
            padding: 16px;
            min-height: 100vh;
            font-size: 18px;
            padding-bottom: 40px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #4361ee, #764ba2);
            color: white;
            border-radius: 28px;
            padding: 24px 20px;
            margin-bottom: 24px;
            box-shadow: 0 10px 40px rgba(67, 97, 238, 0.3);
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .header .sub {
            font-size: 13px;
            opacity: 0.85;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 20px 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
        }

        @media (max-width: 500px) {
            body {
                padding: 12px;
            }
            .header {
                padding: 16px;
                border-radius: 20px;
            }
            .header h1 {
                font-size: 20px;
            }
            .card {
                padding: 16px 14px;
                border-radius: 20px;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .review-toast {
            animation: fadeInUp 0.3s ease;
        }

        .review-cube {
            transition: all 0.2s ease;
        }
        .review-cube:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        .review-cube .delete-btn {
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .review-cube:hover .delete-btn {
            opacity: 1;
        }
        
        /* Анимация появления правильного ответа */
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .answer-reveal {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ШАПКА -->
        <div class="header">
            <div>
                <h1>🧠 Повторение</h1>
                <div class="sub">Тренируй слова и радикалы</div>
            </div>
            <a href="index.html" class="back-btn">🏠 На главную</a>
        </div>

        <!-- КОНТЕЙНЕР ДЛЯ ПОВТОРЕНИЯ -->
        <div class="card" id="reviewContainer"></div>
    </div>

    <!-- ==================== ВЕСЬ КОД ПОВТОРЕНИЯ ==================== -->
    <script>
        // ============================================================
        // 🧠 МОДУЛЬ ПОВТОРЕНИЯ — КРУПНЫЙ ТЕКСТ + СОХРАНЕНИЕ
        // ============================================================

        const REVIEW_KEY = 'chinese_review_words';
        const REVIEW_RADICALS_KEY = 'chinese_review_radicals';
        const REVIEW_STATS_KEY = 'chinese_review_stats';

        // ==================== ХРАНИЛИЩЕ (Данные не удаляются при обновлении) ====================

        function getReviewWords() {
            try { 
                const data = localStorage.getItem(REVIEW_KEY); 
                return data ? JSON.parse(data) : []; 
            } catch (e) { 
                console.error('Ошибка чтения слов:', e);
                return []; 
            }
        }

        function saveReviewWords(words) {
            try { 
                localStorage.setItem(REVIEW_KEY, JSON.stringify(words)); 
            } catch (e) { 
                console.error('Ошибка сохранения слов:', e); 
            }
        }

        function getReviewRadicals() {
            try { 
                const data = localStorage.getItem(REVIEW_RADICALS_KEY); 
                return data ? JSON.parse(data) : []; 
            } catch (e) { 
                return []; 
            }
        }

        function saveReviewRadicals(radicals) {
            try { 
                localStorage.setItem(REVIEW_RADICALS_KEY, JSON.stringify(radicals)); 
            } catch (e) { 
                console.error('Ошибка сохранения радикалов:', e); 
            }
        }

        function getStats() {
            try {
                const data = localStorage.getItem(REVIEW_STATS_KEY);
                return data ? JSON.parse(data) : { totalGames: 0, totalCorrect: 0, totalWrong: 0, bestStreak: 0 };
            } catch (e) { return { totalGames: 0, totalCorrect: 0, totalWrong: 0, bestStreak: 0 }; }
        }

        function saveStats(stats) {
            try { localStorage.setItem(REVIEW_STATS_KEY, JSON.stringify(stats)); }
            catch (e) { console.error(e); }
        }

        // ==================== ДОБАВЛЕНИЕ ====================

        function addWordToReview(wordChar) {
            if (typeof WORDS === 'undefined') return false;
            const word = WORDS.find(w => w.c === wordChar);
            if (!word) return false;
            const reviewList = getReviewWords();
            if (reviewList.some(w => w.c === word.c)) {
                showToast('⚠️ Слово уже в списке', 'warning');
                return false;
            }
            reviewList.push({
                c: word.c,
                p: word.p || '?',
                m: word.m || '?',
                e: word.e || '📖',
                cat: word.cat || 'basics',
                a: word.a || ''
            });
            saveReviewWords(reviewList);
            showToast(`✅ "<LaTex>id_8</LaTex>{radical.s}" добавлен!`, 'success');
            renderReviewPanel();
            return true;
        }

        // ==================== УДАЛЕНИЕ ====================

        function removeWordFromReview(wordChar) {
            if (!confirm(`🗑️ Удалить "<LaTex>id_7</LaTex>{radicalChar}"?`)) return false;
            let list = getReviewRadicals().filter(r => r.s !== radicalChar);
            saveReviewRadicals(list);
            showToast('🗑️ Удалено', 'info');
            renderReviewPanel();
            return true;
        }

        // ==================== ТОСТ ====================

        function showToast(message, type = 'info') {
            const existing = document.querySelector('.review-toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'review-toast';
            const colors = { info: '#333', success: '#2ecc71', error: '#e74c3c', warning: '#f39c12' };
            toast.style.cssText = `
                position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
                background:<LaTex>id_6</LaTex>{allItems.length}</div>
                        <div style="font-size:11px;">📚 Всего</div>
                    </div>
                    <div style="background:linear-gradient(135deg,#2ecc71,#27ae60);color:white;padding:14px;border-radius:14px;text-align:center;">
                        <div style="font-size:28px;font-weight:900;"><LaTex>id_5</LaTex>{stats.totalWrong || 0}</div>
                        <div style="font-size:11px;">❌ Неверно</div>
                    </div>
                    <div style="background:linear-gradient(135deg,#f39c12,#e67e22);color:white;padding:14px;border-radius:14px;text-align:center;">
                        <div style="font-size:28px;font-weight:900;"><LaTex>id_4</LaTex>{allItems.length})</h3>
                    <LaTex>id_3</LaTex>{color}33;position:relative;cursor:pointer;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;" onclick="speak('<LaTex>id_2</LaTex>{isWord ? `removeWordFromReview('${char}')` : `removeRadicalFromReview('${char}')`}" style="position:absolute;top:4px;right:6px;background:#e74c3c;color:white;border:none;border-radius:50%;width:24px;height:24px;font-size:14px;cursor:pointer;">✕</button>
                            <div style="font-size:44px;font-weight:900;"><LaTex>id_1</LaTex>{emoji}</div>
                            <div style="font-size:13px;font-weight:600;color:#555;">${meaning.length > 15 ? meaning.substring(0, 15) + '…' : meaning}</div>
                        </div>
                    `;
                });
            }

            html += '</div>';
            container.innerHTML = html;
        }

        // ==================== ИГРА ====================

        let gameState = {
            mode: 'visual',
            items: [],
            currentIndex: 0,
            correct: 0,
            wrong: 0,
            streak: 0,
            bestStreak: 0,
            total: 0,
            isActive: false,
            answered: false,
            currentItem: null,
            options: []
        };

        function startReviewGame(mode) {
            const words = getReviewWords();
            const radicals = getReviewRadicals();

            let allItems = [
                ...words.map(w => ({ ...w, type: 'word' })),
                ...radicals.map(r => ({ ...r, type: 'radical' }))
            ];

            if (allItems.length === 0) {
                showToast('📭 Добавьте слова в повторение!', 'warning');
                return;
            }

            allItems.sort(() => Math.random() - 0.5);

            gameState = {
                mode: mode,
                items: allItems,
                currentIndex: 0,
                correct: 0,
                wrong: 0,
                streak: 0,
                bestStreak: 0,
                total: allItems.length,
                isActive: true,
                answered: false,
                currentItem: null,
                options: []
            };

            showReviewGameCard();
        }

        function generateOptions(correctItem) {
            const isWord = correctItem.type === 'word';
            const correctChar = isWord ? correctItem.c : correctItem.s;
            const correctText = correctItem.m || '?';

            let options = [{
                char: correctChar,
                text: correctText,
                isCorrect: true,
                pinyin: correctItem.p || '',
                emoji: correctItem.e || ''
            }];

            if (typeof WORDS !== 'undefined' && WORDS.length > 0) {
                const wrongOptions = WORDS.filter(w =>
                    w.c !== correctChar &&
                    w.m &&
                    w.m !== correctText
                );

                wrongOptions.sort(() => Math.random() - 0.5);
                const selected = wrongOptions.slice(0, 3);

                selected.forEach(w => {
                    options.push({
                        char: w.c,
                        text: w.m || '?',
                        isCorrect: false,
                        pinyin: w.p || '',
                        emoji: w.e || ''
                    });
                });
            }

            if (options.length < 4) {
                const fromItems = gameState.items.filter(item => {
                    const char = item.type === 'word' ? item.c : item.s;
                    return char !== correctChar && !options.some(o => o.char === char);
                });

                fromItems.sort(() => Math.random() - 0.5);

                for (let i = 0; options.length < 4 && i < fromItems.length; i++) {
                    const item = fromItems[i];
                    const char = item.type === 'word' ? item.c : item.s;
                    options.push({
                        char: char,
                        text: item.m || '?',
                        isCorrect: false,
                        pinyin: item.p || '',
                        emoji: item.e || ''
                    });
                }
            }

            while (options.length < 4) {
                options.push({
                    char: '—',
                    text: '—',
                    isCorrect: false,
                    pinyin: '',
                    emoji: ''
                });
            }

            options.sort(() => Math.random() - 0.5);
            return options;
        }

        // ==================== ОСНОВНАЯ ФУНКЦИЯ ОТОБРАЖЕНИЯ КАРТОЧКИ (КРУПНО) ====================

        function showReviewGameCard() {
            const container = document.getElementById('reviewContainer');
            if (!container) return;

            if (!gameState.isActive || gameState.currentIndex >= gameState.total) {
                showGameResults();
                return;
            }

            const item = gameState.items[gameState.currentIndex];
            gameState.currentItem = item;

            const isWord = item.type === 'word';
            const char = isWord ? item.c : item.s;
            const meaning = item.m || '?';
            const emoji = item.e || (isWord ? '📖' : '🔤');
            const pinyin = item.p || '';
            const current = gameState.currentIndex + 1;
            const total = gameState.total;

            if (!gameState.answered) {
                const options = generateOptions(item);
                gameState.options = options;
            }

            if (gameState.mode === 'audio' && !gameState.answered) {
                setTimeout(() => { speak(char); }, 300);
            }

            const modeColor = gameState.mode === 'visual' ? '#4361ee' : '#e53935';
            const modeIcon = gameState.mode === 'visual' ? '👀' : '🎧';
            const modeTitle = gameState.mode === 'visual' ? 'Угадай по виду' : 'Угадай на
