<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🀄️ МАДЖОНГ | ВСЕ РАДИКАЛЫ | ТЕТРАДЬ</title>
    <script src="WORDS.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: linear-gradient(145deg, #1a3a2a 0%, #0a1a0f 100%); min-height: 100vh; font-family: system-ui, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif; padding: 12px; }
        .game-container { max-width: 1600px; margin: 0 auto; background: rgba(30, 25, 20, 0.6); border-radius: 48px; padding: 16px; }
        h1 { text-align: center; font-size: 1.5rem; color: #f7e05e; margin-bottom: 4px; }
        .sub { text-align: center; color: #d4c9a6; margin-bottom: 12px; font-size: 0.7rem; }
        .level-bar-wrapper { overflow-x: auto; white-space: nowrap; margin-bottom: 12px; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
        .level-bar { display: inline-flex; gap: 6px; padding: 0 4px; }
        .level-btn { background: #4a3729; color: #d4c9a6; padding: 5px 12px; border-radius: 40px; cursor: pointer; font-weight: bold; font-size: 0.7rem; white-space: nowrap; transition: 0.1s; }
        .level-btn.active { background: linear-gradient(135deg, #f7b42c, #fc8e2c); color: #2c1a0c; }
        .stats-bar { display: flex; justify-content: space-between; background: #2c2118; padding: 6px 12px; border-radius: 60px; margin-bottom: 12px; color: #ffecb3; font-weight: bold; font-size: 0.75rem; flex-wrap: wrap; gap: 6px; }
        .stats-bar span { background: #00000066; padding: 3px 10px; border-radius: 40px; }
        .game-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; background: #4a3729; padding: 20px; border-radius: 40px; margin: 12px 0; max-height: 60vh; min-height: 420px; overflow-y: auto; }
        .tile { background: #fff8e7; background-image: radial-gradient(circle at 25% 35%, rgba(255,245,200,0.6) 2%, transparent 2.5%); background-size: 25px 25px; border-radius: 18px; text-align: center; cursor: pointer; transition: all 0.1s; border: 3px solid #c8aa6e; box-shadow: 0 6px 0 #8b6946; padding: 14px 6px; }
        .tile.selected { background: #ffe6b3; border: 3px solid #f5b042; transform: scale(0.96); box-shadow: 0 3px 0 #8b6946; }
        .tile.removed { display: none; }
        .tile .main-char { font-size: 52px; font-weight: 800; color: #3c2a1f; }
        .tile .pinyin { font-size: 12px; color: #b34e1a; margin-top: 6px; }
        .tile .info { font-size: 10px; margin-top: 4px; color: #7a5a3a; background: #f3e5c9; display: inline-block; padding: 2px 10px; border-radius: 40px; }
        .message-area { background: #261d14e6; border-radius: 60px; padding: 8px 16px; text-align: center; font-weight: bold; font-size: 0.8rem; margin: 10px 0; color: #f7e6c4; }
        .ctrl-buttons { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
        button { background: linear-gradient(135deg, #f7b42c, #fc8e2c); border: none; padding: 8px 20px; font-size: 0.8rem; font-weight: bold; border-radius: 60px; color: #2c1a0c; cursor: pointer; box-shadow: 0 3px 0 #9b5e1c; transition: 0.05s linear; }
        button:active { transform: translateY(2px); }
        .reset-btn { background: linear-gradient(135deg, #4b6a3b, #2d5a2a); color: #f9e7b3; }
        .hint-btn { background: linear-gradient(135deg, #3a6b8a, #2a4a6a); color: white; }
        .shuffle-btn { background: linear-gradient(135deg, #8e44ad, #6c3483); color: white; }
        .progress-bar { background: #4a3729; border-radius: 30px; height: 6px; margin: 8px 0; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #f7b42c, #f5a623); width: 0%; height: 100%; transition: width 0.3s; }
        
        /* ========== ТЕТРАДЬ: СТИЛИ ========== */
        .learn-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 10px; }
        .learn-card { background: linear-gradient(145deg, #fffaf0, #f8f0e0); border-radius: 40px; padding: 16px; max-width: 720px; width: 100%; text-align: center; border: 4px solid #f7b42c; max-height: 98vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .learn-card .radical-header { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 12px; flex-wrap: wrap; }
        .learn-card .radical-big { font-size: 85px; font-weight: 900; color: #c0392b; background: linear-gradient(135deg, #fff0d0, #ffe8c0); display: inline-flex; align-items: center; justify-content: center; padding: 10px 30px; border-radius: 24px; cursor: pointer; border: 3px dashed #f7b42c; min-width: 120px; min-height: 120px; }
        .learn-card .radical-name { font-size: 22px; font-weight: bold; color: #2c1a0c; }
        .learn-card .radical-pinyin { font-size: 18px; color: #8e44ad; margin: 4px 0; font-weight: 500; }
        .learn-card .radical-mean { font-size: 14px; color: #6b5a4a; margin-bottom: 8px; }
        
        .draw-section { background: linear-gradient(135deg, #f5e6d3, #e8d5c0); border-radius: 28px; padding: 14px; margin: 10px 0; border: 2px solid #d4b896; }
        .draw-canvas-container { position: relative; background: #fffef9; border-radius: 20px; padding: 8px; margin: 0 auto; border: 3px solid #c8aa6e; display: inline-block; }
        .draw-canvas { display: block; margin: 0 auto; cursor: crosshair; background: transparent; }
        .grid-overlay { position: absolute; top: 8px; left: 8px; pointer-events: none; border-radius: 16px; }
        
        .draw-tools { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
        .draw-tools button { background: linear-gradient(135deg, #4b6a3b, #2d5a2a); padding: 7px 16px; font-size: 0.8rem; box-shadow: 0 3px 0 #1e3a1a; color: white; border-radius: 50px; }
        .draw-tools .clear-draw { background: linear-gradient(135deg, #c0392b, #e74c3c); }
        .draw-tools .trace-btn { background: linear-gradient(135deg, #2980b9, #3498db); }
        
        .stroke-info { background: #2c2118; padding: 6px 16px; border-radius: 40px; color: #f7e05e; font-weight: bold; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 8px; margin: 8px 0; }
        .stroke-info .dot { width: 12px; height: 12px; background: #f7b42c; border-radius: 50%; display: inline-block; }
        
        .examples-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 12px 0; }
        .example-word { background: linear-gradient(135deg, #3c2a1f, #2a1a0f); border-radius: 20px; padding: 10px 16px; text-align: center; cursor: pointer; transition: 0.1s; min-width: 95px; border: 2px solid #5a4a3a; }
        .example-word:active { transform: scale(0.97); }
        .example-word .ex-char { font-size: 32px; font-weight: bold; color: #f7e05e; }
        .example-word .ex-pinyin { font-size: 11px; color: #ffd966; margin: 2px 0; }
        .example-word .ex-mean { font-size: 10px; color: #d4c9a6; }
        
        .notebook-actions { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
        .close-learn { background: linear-gradient(135deg, #f7b42c, #fc8e2c); border: none; padding: 10px 28px; font-size: 0.9rem; font-weight: bold; border-radius: 60px; cursor: pointer; }
        .notebook-btn { background: linear-gradient(135deg, #2ecc71, #27ae60); border: none; padding: 10px 24px; font-size: 0.85rem; font-weight: bold; border-radius: 60px; cursor: pointer; color: white; }
        
        .nav-buttons { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; }
        .back-btn { background: linear-gradient(135deg, #5a4a3a, #3a2a1a); color: #f7e05e; padding: 8px 16px; font-size: 0.8rem; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; border-radius: 40px; }
        .back-btn:active { transform: translateY(2px); }
        
        /* Анимации */
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .pulse { animation: pulse 1.5s infinite; }
        
        @media (max-width: 900px) { 
            .game-grid { grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 16px; } 
            .tile .main-char { font-size: 44px; }
            .learn-card .radical-big { font-size: 70px; min-width: 100px; min-height: 100px; }
        }
        @media (max-width: 650px) { 
            .game-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px; } 
            .tile { padding: 10px 4px; } 
            .tile .main-char { font-size: 36px; }
            .learn-card .radical-big { font-size: 60px; }
            .learn-card { padding: 12px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="nav-buttons">
        <a href="index.html" class="back-btn">◀ На главную</a>
        <div></div>
    </div>
    <h1>🀄️ МАДЖОНГ | ВСЕ РАДИКАЛЫ</h1>
    <div class="sub">🔗 Соедини радикал (ключ) со словом-примером</div>
    <div class="level-bar-wrapper"><div class="level-bar" id="levelBar">
        <div class="level-btn" data-level="1">🌱 6 пар</div>
        <div class="level-btn" data-level="2">⭐ 10 пар</div>
        <div class="level-btn active" data-level="3">🏆 15 пар</div>
        <div class="level-btn" data-level="4">🔥 20 пар</div>
        <div class="level-btn" data-level="5">💪 25 пар</div>
        <div class="level-btn" data-level="6">🎯 30 пар</div>
        <div class="level-btn" data-level="7">👑 40 пар</div>
        <div class="level-btn" data-level="8">🏅 50 пар</div>
    </div></div>
    <div class="stats-bar"><span>🎯 Счёт: <span id="scoreValue">0</span></span><span>🧩 Осталось: <span id="remainValue">0</span></span><span>🔥 Серия: <span id="streakValue">0</span></span><span>🏆 Рекорд: <span id="recordValue">0</span></span></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="game-grid" id="gameGrid"></div>
    <div class="message-area" id="gameMessage">🌟 Нажми на плитку, затем на её пару (ключ + слово)</div>
    <div class="ctrl-buttons"><button id="hintBtn" class="hint-btn">💡 Подсказка</button><button id="shuffleBtn" class="shuffle-btn">🔄 Перемешать</button><button id="resetGameBtn" class="reset-btn">🆕 Новая игра</button></div>
</div>

<script>
    // ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
    let RADICALS_DB = [];
    let currentLevel = 3;
    let tiles = [];
    let selectedId = null;
    let matchedCount = 0;
    let totalPairs = 0;
    let score = 0;
    let streak = 0;
    let record = 0;
    let currentModal = null;
    let chineseVoice = null;
    
    // ========== НАСТРОЙКИ ТЕТРАДИ ==========
    const NOTEBOOK_CONFIG = {
        canvasSize: 420,           // Размер канваса в пикселях
        gridPadding: 25,           // Отступ сетки от края
        defaultBrushWidth: 8,      // ФИКСИРОВАННАЯ толщина пера (по образцу)
        exampleOpacity: 0.18,      // Прозрачность образца для обводки
        gridColor: '#c9a87c',      // Цвет линий сетки
        gridColorCenter: '#d4b896', // Цвет центральных линий
        strokeColor: '#2c1a0c',    // Цвет рисования
        exampleColor: '#c0392b'    // Цвет образца
    };
    
    // ========== УРОВНИ ИГРЫ ==========
    const LEVEL_CONFIG = { 
        1: { pairsCount: 6, gridCols: 3 }, 
        2: { pairsCount: 10, gridCols: 4 }, 
        3: { pairsCount: 15, gridCols: 4 }, 
        4: { pairsCount: 20, gridCols: 5 }, 
        5: { pairsCount: 25, gridCols: 5 }, 
        6: { pairsCount: 30, gridCols: 6 }, 
        7: { pairsCount: 40, gridCols: 6 }, 
        8: { pairsCount: 50, gridCols: 7 } 
    };
    
    // ========== DOM ЭЛЕМЕНТЫ ==========
    const scoreSpan = document.getElementById('scoreValue');
    const remainSpan = document.getElementById('remainValue');
    const streakSpan = document.getElementById('streakValue');
    const recordSpan = document.getElementById('recordValue');
    const progressFill = document.getElementById('progressFill');
    const msgEl = document.getElementById('gameMessage');
    const gridEl = document.getElementById('gameGrid');
    
    // ========== ЗАГРУЗКА ГОЛОСА ==========
    function loadChineseVoice() { 
        const voices = window.speechSynthesis?.getVoices() || []; 
        chineseVoice = voices.find(v => v.lang === "zh-CN" || v.lang.startsWith("zh")); 
    }
    if (window.speechSynthesis) {
        window.speechSynthesis.onvoiceschanged = loadChineseVoice;
        setTimeout(loadChineseVoice, 150);
    }
    
    function speakChinese(text) {
        if (!window.speechSynthesis || !text) return;
        if (["丶","丨","丿","乛","⺄","⺀","⺁","⺂"].includes(text)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "zh-CN";
        utterance.rate = 0.8;
        utterance.pitch = 1;
        if (chineseVoice) utterance.voice = chineseVoice;
        window.speechSynthesis.speak(utterance);
    }
    
    // ========== ТЕТРАДЬ: ФУНКЦИИ СЕТКИ МИЦЗЫГЭ ==========
    function drawMiziGeGrid(ctx, size, padding) {
        const innerSize = size - padding * 2;
        const center = size / 2;
        const innerStart = padding;
        const innerEnd = size - padding;
        
        // Внешняя рамка (жирная)
        ctx.strokeStyle = NOTEBOOK_CONFIG.gridColor;
        ctx.lineWidth = 2.5;
        ctx.strokeRect(padding, padding, innerSize, innerSize);
        
        // Центральные линии (пунктир)
        ctx.setLineDash([6, 4]);
        ctx.strokeStyle = NOTEBOOK_CONFIG.gridColorCenter;
        ctx.lineWidth = 1.2;
        // Вертикаль
        ctx.beginPath();
        ctx.moveTo(center, innerStart);
        ctx.lineTo(center, innerEnd);
        ctx.stroke();
        // Горизонталь
        ctx.beginPath();
        ctx.moveTo(innerStart, center);
        ctx.lineTo(innerEnd, center);
        ctx.stroke();
        
        // Диагонали (тонкие)
        ctx.strokeStyle = NOTEBOOK_CONFIG.gridColor;
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(innerStart, innerStart);
        ctx.lineTo(innerEnd, innerEnd);
        ctx.moveTo(innerEnd, innerStart);
        ctx.lineTo(innerStart, innerEnd);
        ctx.stroke();
        
        // Угловые метки (четверти)
        ctx.setLineDash([3, 3]);
        ctx.lineWidth = 0.9;
        const quarter = innerSize / 4;
        // Левый верхний
        ctx.beginPath();
        ctx.moveTo(padding + quarter, padding);
        ctx.lineTo(padding + quarter, padding + quarter);
        ctx.moveTo(padding, padding + quarter);
        ctx.lineTo(padding + quarter, padding + quarter);
        ctx.stroke();
        // Правый верхний
        ctx.beginPath();
        ctx.moveTo(size - padding - quarter, padding);
        ctx.lineTo(size - padding - quarter, padding + quarter);
        ctx.moveTo(size - padding, padding + quarter);
        ctx.lineTo(size - padding - quarter, padding + quarter);
        ctx.stroke();
        // Левый нижний
        ctx.beginPath();
        ctx.moveTo(padding + quarter, size - padding);
        ctx.lineTo(padding + quarter, size - padding - quarter);
        ctx.moveTo(padding, size - padding - quarter);
        ctx.lineTo(padding + quarter, size - padding - quarter);
        ctx.stroke();
        // Правый нижний
        ctx.beginPath();
        ctx.moveTo(size - padding - quarter, size - padding);
        ctx.lineTo(size - padding - quarter, size - padding - quarter);
        ctx.moveTo(size - padding, size - padding - quarter);
        ctx.lineTo(size - padding - quarter, size - padding - quarter);
        ctx.stroke();
        
        ctx.setLineDash([]);
    }
    
    function initNotebookCanvas(canvas, char) {
        const size = NOTEBOOK_CONFIG.canvasSize;
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = '100%';
        canvas.style.height = 'auto';
        canvas.style.aspectRatio = '1/1';
        canvas.style.maxWidth = size + 'px';
        
        const ctx = canvas.getContext('2d');
        
        // Фон
        ctx.fillStyle = '#fffef9';
        ctx.fillRect(0, 0, size, size);
        
        // Сетка
        drawMiziGeGrid(ctx, size, NOTEBOOK_CONFIG.gridPadding);
        
        // Настройки кисти (ФИКСИРОВАННЫЕ)
        ctx.strokeStyle = NOTEBOOK_CONFIG.strokeColor;
        ctx.lineWidth = NOTEBOOK_CONFIG.defaultBrushWidth;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        return ctx;
    }
    
    function showExampleOnCanvas(canvas, char) {
        const ctx = canvas.getContext('2d');
        const size = NOTEBOOK_CONFIG.canvasSize;
        const padding = NOTEBOOK_CONFIG.gridPadding + 15;
        const availableSize = size - padding * 2;
        
        // Сохраняем сетку (перерисовываем поверх)
        ctx.save();
        ctx.globalCompositeOperation = 'destination-over';
        
        // Полупрозрачный образец
        ctx.globalAlpha = NOTEBOOK_CONFIG.exampleOpacity;
        ctx.fillStyle = NOTEBOOK_CONFIG.exampleColor;
        ctx.font = `bold ${availableSize}px "Noto Sans CJK SC", "KaiTi", "STKaiti", serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(char, size / 2, size / 2 + availableSize * 0.05);
        
        ctx.restore();
        
        // Возвращаем настройки для рисования
        ctx.strokeStyle = NOTEBOOK_CONFIG.strokeColor;
        ctx.lineWidth = NOTEBOOK_CONFIG.defaultBrushWidth;
        ctx.globalAlpha = 1;
    }
    
    function clearNotebookCanvas(canvas) {
        const ctx = canvas.getContext('2d');
        const size = NOTEBOOK_CONFIG.canvasSize;
        
        // Очищаем и перерисовываем сетку
        ctx.fillStyle = '#fffef9';
        ctx.fillRect(0, 0, size, size);
        drawMiziGeGrid(ctx, size, NOTEBOOK_CONFIG.gridPadding);
        
        // Восстанавливаем настройки кисти
        ctx.strokeStyle = NOTEBOOK_CONFIG.strokeColor;
        ctx.lineWidth = NOTEBOOK_CONFIG.defaultBrushWidth;
    }
    
    // ========== ТЕТРАДЬ: ОБРАБОТЧИКИ РИСОВАНИЯ ==========
    function setupDrawing(canvas) {
        const ctx = canvas.getContext('2d');
        let drawing = false;
        let lastX = 0, lastY = 0;
        
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX ?? e.touches?.[0]?.clientX ?? 0;
            const clientY = e.clientY ?? e.touches?.[0]?.clientY ?? 0;
            
            let x = (clientX - rect.left) * canvas.width / rect.width;
            let y = (clientY - rect.top) * canvas.height / rect.height;
            
            return { 
                x: Math.max(0, Math.min(canvas.width, x)), 
                y: Math.max(0, Math.min(canvas.height, y)) 
            };
        }
        
        function start(e) {
            e.preventDefault();
            drawing = true;
            const p = getPos(e);
            lastX = p.x;
            lastY = p.y;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
        }
        
        function draw(e) {
            if (!drawing) return;
            e.preventDefault();
            const p = getPos(e);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
            lastX = p.x;
            lastY = p.y;
        }
        
        function stop() {
            if (drawing) {
                drawing = false;
                ctx.closePath();
            }
        }
        
        // Мышь
        canvas.addEventListener('mousedown', start);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stop);
        canvas.addEventListener('mouseleave', stop);
        
        // Тач
        canvas.addEventListener('touchstart', start, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stop);
        canvas.addEventListener('touchcancel', stop);
    }
    
    // ========== ТЕТРАДЬ: ПОКАЗ МОДАЛЬНОГО ОКНА ==========
    function showLearnModal(radical) {
        if (currentModal) { currentModal.remove(); currentModal = null; }
        if (!radical) return;
        
        // Поиск данных слова
        let wordData = null;
        if (typeof WORDS !== 'undefined' && Array.isArray(WORDS)) {
            wordData = WORDS.find(w => w.c === radical.word);
        }
        
        const modal = document.createElement('div');
        modal.className = 'learn-modal';
        modal.innerHTML = `
            <div class="learn-card">
                <div class="radical-header">
                    <div class="radical-big pulse" id="radicalBig" onclick="speakChinese('${radical.key.replace(/'/g, "\\'")}')">${radical.key}</div>
                    <div style="text-align:left;min-width:180px;">
                        <div class="radical-name">${radical.keyName}</div>
                        <div class="radical-pinyin">${radical.keyPinyin || '?'}</div>
                        <div class="radical-mean">${radical.wordName || 'пример использования'}</div>
                    </div>
                </div>
                
                <div class="draw-section">
                    <div class="stroke-info">
                        <span class="dot"></span>
                        ✍️ ${radical.strokes || '?'} черт • Перо: ${NOTEBOOK_CONFIG.defaultBrushWidth}px (фикс.)
                    </div>
                    
                    <div class="draw-canvas-container">
                        <canvas class="draw-canvas" id="notebookCanvas"></canvas>
                    </div>
                    
                    <div class="draw-tools">
                        <button class="clear-draw" id="clearDraw">🧽 Очистить</button>
                        <button class="trace-btn" id="showExample">👁️ Показать образец</button>
                        <button class="trace-btn" id="hideExample" style="display:none;">🙈 Скрыть образец</button>
                    </div>
                </div>
                
                <div style="font-size:15px;font-weight:600;color:#3c2a1f;margin:10px 0 8px;">📖 Слова с радикалом <span style="color:#c0392b">${radical.key}</span>:</div>
                <div class="examples-list" id="examplesList">
                    <div class="example-word" data-char="${radical.word}" data-pinyin="${radical.wordPinyin || radical.keyPinyin}">
                        <div class="ex-char">${radical.word}</div>
                        <div class="ex-pinyin">${radical.wordPinyin || radical.keyPinyin}</div>
                        <div class="ex-mean">${radical.wordName || radical.keyName}</div>
                    </div>
                </div>
                
                <div class="notebook-actions">
                    <button class="close-learn" id="closeLearn">✖ Закрыть</button>
                    <button class="notebook-btn" id="addToNotebook">📓 В мою тетрадь</button>
                </div>
            </div>
        `;
        
        document.body.appendChild(modal);
        currentModal = modal;
        
        // Инициализация канваса
        const canvas = modal.querySelector('#notebookCanvas');
        const ctx = initNotebookCanvas(canvas, radical.key);
        setupDrawing(canvas);
        
        // Кнопки управления
        modal.querySelector('#clearDraw').onclick = () => {
            clearNotebookCanvas(canvas);
            msgEl.innerHTML = "🧽 Холст очищен";
        };
        
        let exampleVisible = false;
        modal.querySelector('#showExample').onclick = () => {
            showExampleOnCanvas(canvas, radical.key);
            exampleVisible = true;
            modal.querySelector('#showExample').style.display = 'none';
            modal.querySelector('#hideExample').style.display = 'inline-block';
            msgEl.innerHTML = "👁️ Образец показан (обводи пунктиром)";
        };
        
        modal.querySelector('#hideExample').onclick = () => {
            clearNotebookCanvas(canvas);
            exampleVisible = false;
            modal.querySelector('#showExample').style.display = 'inline-block';
            modal.querySelector('#hideExample').style.display = 'none';
            msgEl.innerHTML = "🙈 Образец скрыт";
        };
        
        // Клик по большому иероглифу
        modal.querySelector('#radicalBig').onclick = () => speakChinese(radical.key);
        
        // Примеры слов
        modal.querySelectorAll('.example-word').forEach(el => {
            el.onclick = function() {
                const ch = this.dataset.char;
                if (ch) {
                    speakChinese(ch);
                    msgEl.innerHTML = `🔊 ${ch} — ${this.querySelector('.ex-mean').textContent}`;
                }
            };
        });
        
        // Закрытие
        modal.querySelector('#closeLearn').onclick = () => {
            modal.remove();
            currentModal = null;
        };
        
        // Добавление в тетрадь
        modal.querySelector('#addToNotebook').onclick = () => {
            const added = addToNotebookFromGame(radical.key, radical.keyName);
            showToast(added ? `✅ "${radical.key}" добавлен в тетрадь!` : `⚠️ "${radical.key}" уже есть`);
        };
        
        // Закрытие по клику вне карточки
        modal.onclick = (e) => {
            if (e.target === modal) {
                modal.remove();
                currentModal = null;
            }
        };
        
        // Озвучка
        speakChinese(radical.key);
        
        return modal;
    }
    
    function showToast(message) {
        const toast = document.createElement('div');
        toast.style.cssText = `
            position:fixed;bottom:25px;left:50%;transform:translateX(-50%);
            background:linear-gradient(135deg,#2ecc71,#27ae60);
            color:white;padding:14px 28px;border-radius:60px;
            z-index:10000;font-size:16px;font-weight:500;
            box-shadow:0 8px 25px rgba(0,0,0,0.3);
            animation:slideUp 0.3s ease;
        `;
        toast.innerHTML = message;
        document.body.appendChild(toast);
        
        // Анимация появления
        const style = document.createElement('style');
        style.textContent = `@keyframes slideUp{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}`;
        document.head.appendChild(style);
        
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.3s';
            setTimeout(() => toast.remove(), 300);
        }, 2000);
    }
    
    // ========== ТЕТРАДЬ: ДОБАВЛЕНИЕ В localStorage ==========
    function addToNotebookFromGame(char, name) {
        let notebook = JSON.parse(localStorage.getItem('chinese_notebook') || '[]');
        if (!notebook.find(item => item.char === char)) {
            notebook.push({ 
                char: char, 
                name: name, 
                added: new Date().toISOString(),
                practiced: 0 
            });
            localStorage.setItem('chinese_notebook', JSON.stringify(notebook));
            return true;
        }
        return false;
    }
    
    // ========== ИГРОВАЯ ЛОГИКА ==========
    function getRandomPairs(count) {
        if (RADICALS_DB.length === 0) return [];
        const shuffled = [...RADICALS_DB];
        for (let i = shuffled.length - 1; i > 0; i--) { 
            const j = Math.floor(Math.random() * (i + 1)); 
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; 
        }
        return shuffled.slice(0, Math.min(count, shuffled.length));
    }
    
    function renderGrid() {
        if (!gridEl) return;
        const config = LEVEL_CONFIG[currentLevel];
        if (config) gridEl.style.gridTemplateColumns = `repeat(${config.gridCols}, 1fr)`;
        gridEl.innerHTML = '';
        
        for (let i = 0; i < tiles.length; i++) {
            const t = tiles[i];
            if (t.removed) continue;
            const div = document.createElement('div');
            div.className = 'tile' + (selectedId === t.id ? ' selected' : '');
            div.innerHTML = `
                <div class="main-char">${t.char}</div>
                <div class="pinyin">${t.pinyin || ''}</div>
                <div class="info">${t.name || ''}</div>
            `;
            div.onclick = (function(tile) { 
                return function() { 
                    speakChinese(tile.char); 
                    onTileClick(tile); 
                }; 
            })(t);
            gridEl.appendChild(div);
        }
    }
    
    function onTileClick(clickedTile) {
        if (clickedTile.removed) return;
        
        if (selectedId === null) { 
            selectedId = clickedTile.id; 
            renderGrid(); 
            msgEl.innerHTML = `✅ Выбрано: ${clickedTile.char}`; 
            return; 
        }
        
        const selectedTile = tiles.find(t => t.id === selectedId);
        if (!selectedTile) { selectedId = null; return; }
        
        if (selectedTile.id === clickedTile.id) { 
            selectedId = null; 
            renderGrid(); 
            msgEl.innerHTML = "🔍 Выделение снято"; 
            return; 
        }
        
        if (selectedTile.pairId === clickedTile.pairId && selectedTile.type !== clickedTile.type) {
            // ✅ ПРАВИЛЬНАЯ ПАРА
            selectedTile.removed = true; 
            clickedTile.removed = true;
            matchedCount++; 
            streak++; 
            const points = 10 + Math.floor(streak / 2) * 2;
            score += points; 
            if (streak > record) record = streak;
            updateUI();
            
            // Показываем тетрадь для радикала
            let keyTile = (selectedTile.type === 'key') ? selectedTile : clickedTile;
            let radical = RADICALS_DB.find(r => r.key === keyTile.char);
            if (radical) showLearnModal(radical);
            
            selectedId = null; 
            renderGrid(); 
            msgEl.innerHTML = `✅ Верно! +${points} очков (серия 🔥 ${streak})`;
            
            if (matchedCount === totalPairs) { 
                msgEl.innerHTML = `🏆 ПОБЕДА! Уровень ${currentLevel} пройден!`; 
                speakChinese("恭喜你");
                setTimeout(() => {
                    if (confirm('🎉 Отлично! Начать следующий уровень?')) {
                        const nextLevel = Math.min(8, currentLevel + 1);
                        document.querySelector(`.level-btn[data-level="${nextLevel}"]`)?.click();
                    }
                }, 500);
            }
        } else { 
            // ❌ НЕВЕРНО
            streak = 0; 
            updateUI(); 
            msgEl.innerHTML = `❌ Не пара! Попробуй ещё`; 
            selectedId = null; 
            renderGrid();
            // Визуальный эффект ошибки
            msgEl.style.animation = 'pulse 0.3s';
            setTimeout(() => msgEl.style.animation = '', 300);
        }
    }
    
    function updateUI() { 
        if (scoreSpan) scoreSpan.textContent = score; 
        if (remainSpan) remainSpan.textContent = totalPairs - matchedCount; 
        if (streakSpan) streakSpan.textContent = streak; 
        if (recordSpan) recordSpan.textContent = record; 
        if (progressFill && totalPairs > 0) {
            progressFill.style.width = ((matchedCount / totalPairs) * 100) + "%"; 
        }
    }
    
    function shuffleTiles() {
        if (tiles.length === 0) { initGame(currentLevel); return; }
        const remaining = tiles.filter(t => !t.removed);
        const removed = tiles.filter(t => t.removed);
        
        // Fisher-Yates shuffle
        for (let i = remaining.length - 1; i > 0; i--) { 
            const j = Math.floor(Math.random() * (i + 1)); 
            [remaining[i], remaining[j]] = [remaining[j], remaining[i]]; 
        }
        tiles = [...remaining, ...removed];
        selectedId = null; 
        renderGrid(); 
        msgEl.innerHTML = "🃏 Плитки перемешаны!";
    }
    
    function showHint() {
        for (let i = 0; i < tiles.length; i++) { 
            if (tiles[i].removed) continue; 
            for (let j = i + 1; j < tiles.length; j++) { 
                if (tiles[j].removed) continue; 
                if (tiles[i].pairId === tiles[j].pairId && tiles[i].type !== tiles[j].type) { 
                    msgEl.innerHTML = `💡 Пара: "${tiles[i].char}" ↔ "${tiles[j].char}"`;
                    // Подсветка на 1.5 сек
                    const highlight = document.createElement('style');
                    highlight.textContent = `.tile[data-highlight="true"]{box-shadow:0 0 0 4px #f7b42c,inset 0 0 20px rgba(247,180,44,0.3)!important}`;
                    document.head.appendChild(highlight);
                    setTimeout(() => {
                        document.querySelectorAll('.tile').forEach(t => t.removeAttribute('data-highlight'));
                        highlight.remove();
                    }, 1500);
                    return; 
                } 
            } 
        }
        msgEl.innerHTML = "💡 Попробуй перемешать плитки!";
    }
    
    function initGame(level) {
        if (RADICALS_DB.length === 0) {
            msgEl.innerHTML = "❌ Ошибка: нет радикалов! Проверьте WORDS.js";
            return;
        }
        
        currentLevel = level;
        const config = LEVEL_CONFIG[level];
        let neededPairs = Math.min(config.pairsCount, RADICALS_DB.length);
        if (neededPairs < 2) neededPairs = 2;
        
        const selectedPairs = getRandomPairs(neededPairs);
        totalPairs = selectedPairs.length;
        matchedCount = 0; 
        score = 0; 
        streak = 0; 
        selectedId = null;
        tiles = [];
        let idCounter = 0;
        
        for (let i = 0; i < selectedPairs.length; i++) {
            const p = selectedPairs[i];
            tiles.push({ 
                id: idCounter++, 
                pairId: i, 
                type: 'key', 
                char: p.key, 
                pinyin: p.keyPinyin, 
                name: p.keyName, 
                removed: false 
            });
            tiles.push({ 
                id: idCounter++, 
                pairId: i, 
                type: 'word', 
                char: p.word, 
                pinyin: p.wordPinyin || p.keyPinyin, 
                name: p.wordName || p.keyName, 
                removed: false 
            });
        }
        
        // Перемешиваем
        for (let i = tiles.length - 1; i > 0; i--) { 
            const j = Math.floor(Math.random() * (i + 1)); 
            [tiles[i], tiles[j]] = [tiles[j], tiles[i]]; 
        }
        
        updateUI(); 
        renderGrid(); 
        msgEl.innerHTML = `🎮 Уровень ${level}: ${totalPairs} пар. Соединяй КЛЮЧ ↔ СЛОВО!`;
    }
    
    // ========== ЗАГРУЗКА ДАННЫХ ==========
    if (typeof RADICALS !== 'undefined' && Array.isArray(RADICALS) && RADICALS.length > 0) {
        console.log(`✅ Загружено ${RADICALS.length} радикалов`);
        
        function findWordWithRadical(radicalChar) {
            if (typeof WORDS !== 'undefined' && Array.isArray(WORDS)) {
                const matches = WORDS.filter(w => 
                    w.c && w.c.includes(radicalChar) && 
                    w.c !== radicalChar && 
                    w.c.length <= 3
                );
                if (matches.length > 0) {
                    const ex = matches[0];
                    return { word: ex.c, pinyin: ex.p, meaning: ex.m };
                }
            }
            return null;
        }
        
        for (let r of RADICALS) {
            if (!r.s || r.s.length > 2) continue;
            if (["⺌","⺈","⺍","⺮","⺅","⺋","⺌"].includes(r.s)) continue;
            
            const exampleWord = findWordWithRadical(r.s);
            
            RADICALS_DB.push({
                key: r.s,
                keyPinyin: r.p || '?',
                keyName: r.m || 'радикал',
                word: exampleWord?.word || (r.ex ? r.ex.split(/[、\s]/)[0] : '中'),
                wordPinyin: exampleWord?.pinyin || '',
                wordName: exampleWord?.meaning || (r.ex ? r.ex.substring(0, 25) : 'пример'),
                strokes: Math.min(12, Math.max(1, Math.floor(Math.random() * 8) + 1))
            });
        }
        console.log(`🎮 Готово: ${RADICALS_DB.length} радикалов в игре`);
    } else {
        console.warn('⚠️ RADICALS не найден');
        if (msgEl) msgEl.innerHTML = "⚠️ Подключите WORDS.js с массивом RADICALS";
    }
    
    // ========== ОБРАБОТЧИКИ СОБЫТИЙ ==========
    document.querySelectorAll('.level-btn').forEach(btn => { 
        btn.onclick = () => { 
            document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active')); 
            btn.classList.add('active'); 
            initGame(parseInt(btn.dataset.level)); 
        }; 
    });
    
    document.getElementById('hintBtn')?.addEventListener('click', showHint);
    document.getElementById('shuffleBtn')?.addEventListener('click', shuffleTiles);
    document.getElementById('resetGameBtn')?.addEventListener('click', () => initGame(currentLevel));
    
    // Запуск игры
    window.addEventListener('load', () => {
        initGame(3);
    });
</script>
</body>
</html>
