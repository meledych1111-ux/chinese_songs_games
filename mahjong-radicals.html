<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🀄️ МАДЖОНГ | ВСЕ РАДИКАЛЫ | ТЕТРАДЬ</title>
    <script src="WORDS.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: linear-gradient(145deg, #1a3a2a 0%, #0a1a0f 100%); min-height: 100vh; font-family: system-ui, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif; padding: 12px; }
        .game-container { max-width: 1200px; margin: 0 auto; background: rgba(30, 25, 20, 0.65); border-radius: 36px; padding: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
        h1 { text-align: center; font-size: clamp(1.2rem, 4vw, 1.6rem); color: #f7e05e; margin-bottom: 4px; }
        .sub { text-align: center; color: #d4c9a6; margin-bottom: 12px; font-size: 0.75rem; }
        
        .level-bar-wrapper { overflow-x: auto; white-space: nowrap; margin-bottom: 12px; padding-bottom: 8px; scrollbar-width: none; }
        .level-bar-wrapper::-webkit-scrollbar { display: none; }
        .level-bar { display: inline-flex; gap: 8px; padding: 0 4px; }
        .level-btn { background: #4a3729; color: #d4c9a6; padding: 6px 14px; border-radius: 40px; cursor: pointer; font-weight: bold; font-size: 0.75rem; white-space: nowrap; transition: 0.15s; }
        .level-btn.active { background: linear-gradient(135deg, #f7b42c, #fc8e2c); color: #2c1a0c; box-shadow: 0 4px 0 #b36b0f; }
        
        .stats-bar { display: flex; justify-content: space-between; background: #2c2118; padding: 8px 12px; border-radius: 60px; margin-bottom: 12px; color: #ffecb3; font-weight: bold; font-size: 0.8rem; flex-wrap: wrap; gap: 8px; }
        .stats-bar span { background: #00000044; padding: 4px 12px; border-radius: 40px; }
        
        /* ✅ ИСПРАВЛЕНО: Игра больше не в мелком окне */
        .game-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(85px, 1fr)); gap: 12px; background: #3c2a1f; padding: 16px; border-radius: 28px; margin: 12px 0; min-height: 320px; max-height: 75vh; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #8b6946 transparent; }
        .game-grid::-webkit-scrollbar { width: 8px; }
        .game-grid::-webkit-scrollbar-thumb { background: #8b6946; border-radius: 4px; }
        
        .tile { background: #fff8e7; background-image: radial-gradient(circle at 25% 35%, rgba(255,245,200,0.6) 2%, transparent 2.5%); background-size: 22px 22px; border-radius: 16px; text-align: center; cursor: pointer; transition: all 0.12s; border: 2px solid #c8aa6e; box-shadow: 0 4px 0 #8b6946; padding: 12px 6px; aspect-ratio: 1/1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .tile:active { transform: scale(0.97); }
        .tile.selected { background: #ffe6b3; border-color: #f5b042; box-shadow: 0 2px 0 #8b6946, 0 0 0 3px rgba(245,176,66,0.4); transform: scale(0.98); }
        .tile.removed { display: none; }
        .tile .main-char { font-size: clamp(32px, 8vw, 48px); font-weight: 800; color: #3c2a1f; line-height: 1; }
        .tile .pinyin { font-size: 12px; color: #b34e1a; margin-top: 6px; font-weight: 500; }
        .tile .info { font-size: 11px; margin-top: 4px; color: #6a5a4a; background: #f3e5c9; display: inline-block; padding: 3px 8px; border-radius: 20px; }
        
        .message-area { background: #261d14e6; border-radius: 60px; padding: 10px 16px; text-align: center; font-weight: bold; font-size: 0.85rem; margin: 10px 0; color: #f7e6c4; min-height: 40px; display: flex; align-items: center; justify-content: center; }
        .ctrl-buttons { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        button { background: linear-gradient(135deg, #f7b42c, #fc8e2c); border: none; padding: 9px 18px; font-size: 0.8rem; font-weight: bold; border-radius: 50px; color: #2c1a0c; cursor: pointer; box-shadow: 0 3px 0 #9b5e1c; transition: 0.08s; }
        button:active { transform: translateY(2px); box-shadow: 0 1px 0 #9b5e1c; }
        .reset-btn { background: linear-gradient(135deg, #4b6a3b, #2d5a2a); color: #f9e7b3; }
        .hint-btn { background: linear-gradient(135deg, #3a6b8a, #2a4a6a); color: white; }
        .shuffle-btn { background: linear-gradient(135deg, #8e44ad, #6c3483); color: white; }
        
        .progress-bar { background: #4a3729; border-radius: 30px; height: 6px; margin: 8px 0; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #f7b42c, #f5a623); width: 0%; height: 100%; transition: width 0.4s cubic-bezier(0.4,0,0.2,1); }
        
        /* ========== ТЕТРАДЬ: МОДАЛЬНОЕ ОКНО ========== */
        .learn-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 10px; }
        .learn-card { background: linear-gradient(145deg, #fffaf0, #f8f0e0); border-radius: 32px; padding: 18px; max-width: 680px; width: 100%; text-align: center; border: 3px solid #f7b42c; max-height: 96vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.6); position: relative; }
        
        .radical-header { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 14px; flex-wrap: wrap; }
        .radical-big { font-size: clamp(70px, 15vw, 95px); font-weight: 900; color: #c0392b; background: linear-gradient(135deg, #fff0d0, #ffe8c0); display: inline-flex; align-items: center; justify-content: center; padding: 10px 28px; border-radius: 20px; cursor: pointer; border: 2px dashed #f7b42c; min-width: 110px; min-height: 110px; box-shadow: inset 0 0 15px rgba(0,0,0,0.05); }
        .radical-name { font-size: 22px; font-weight: bold; color: #2c1a0c; }
        .radical-pinyin { font-size: 18px; color: #8e44ad; margin: 2px 0; font-weight: 500; }
        .radical-mean { font-size: 14px; color: #6b5a4a; }
        
        .draw-section { background: linear-gradient(135deg, #f5e6d3, #e8d5c0); border-radius: 24px; padding: 14px; margin: 12px 0; border: 2px solid #d4b896; }
        .draw-canvas-container { position: relative; background: #fffef9; border-radius: 18px; padding: 6px; margin: 0 auto; border: 2px solid #c8aa6e; display: inline-block; box-shadow: inset 0 2px 8px rgba(0,0,0,0.08); }
        .draw-canvas { display: block; margin: 0 auto; cursor: crosshair; background: transparent; touch-action: none; }
        
        .draw-tools { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
        .draw-tools button { background: linear-gradient(135deg, #4b6a3b, #2d5a2a); padding: 8px 16px; font-size: 0.8rem; box-shadow: 0 3px 0 #1e3a1a; color: white; border-radius: 50px; }
        .draw-tools .clear-draw { background: linear-gradient(135deg, #c0392b, #e74c3c); }
        .draw-tools .trace-btn { background: linear-gradient(135deg, #2980b9, #3498db); }
        
        .stroke-info { background: #2c2118; padding: 7px 14px; border-radius: 40px; color: #f7e05e; font-weight: bold; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 8px; margin: 6px 0; }
        .quality-bar { background: #2c2118; height: 10px; border-radius: 10px; margin: 10px auto; max-width: 300px; overflow: hidden; }
        .quality-fill { height: 100%; background: linear-gradient(90deg, #e74c3c, #f39c12, #2ecc71); width: 0%; transition: width 0.5s ease; border-radius: 10px; }
        .quality-text { font-size: 0.85rem; color: #d4c9a6; margin-top: 4px; font-weight: 500; }
        
        .examples-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 12px 0; }
        .example-word { background: linear-gradient(135deg, #3c2a1f, #2a1a0f); border-radius: 18px; padding: 10px 14px; text-align: center; cursor: pointer; transition: 0.1s; min-width: 90px; border: 2px solid #5a4a3a; }
        .example-word:active { transform: scale(0.97); }
        .example-word .ex-char { font-size: 30px; font-weight: bold; color: #f7e05e; }
        .example-word .ex-pinyin { font-size: 11px; color: #ffd966; margin: 2px 0; }
        .example-word .ex-mean { font-size: 10px; color: #d4c9a6; }
        
        .notebook-actions { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
        .close-learn { background: linear-gradient(135deg, #f7b42c, #fc8e2c); border: none; padding: 10px 26px; font-size: 0.9rem; font-weight: bold; border-radius: 50px; cursor: pointer; }
        .notebook-btn { background: linear-gradient(135deg, #2ecc71, #27ae60); border: none; padding: 10px 22px; font-size: 0.85rem; font-weight: bold; border-radius: 50px; cursor: pointer; color: white; }
        
        .nav-buttons { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; }
        .back-btn { background: linear-gradient(135deg, #5a4a3a, #3a2a1a); color: #f7e05e; padding: 8px 16px; font-size: 0.8rem; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; border-radius: 40px; }
        .back-btn:active { transform: translateY(2px); }
        
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        .pulse { animation: pulse 2s infinite ease-in-out; }
        
        @media (max-width: 768px) {
            .game-grid { grid-template-columns: repeat(auto-fit, minmax(75px, 1fr)); gap: 10px; padding: 12px; }
            .tile .main-char { font-size: 34px; }
            .learn-card { padding: 12px; }
            .draw-canvas-container { padding: 4px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="nav-buttons">
        <a href="index.html" class="back-btn">◀ На главную</a>
        <div></div>
    </div>
    <h1>🀄️ МАДЖОНГ | ВСЕ РАДИКАЛЫ</h1>
    <div class="sub">🔗 Соедини радикал (ключ) со словом-примером</div>
    <div class="level-bar-wrapper"><div class="level-bar" id="levelBar">
        <div class="level-btn" data-level="1">🌱 6 пар</div>
        <div class="level-btn" data-level="2">⭐ 10 пар</div>
        <div class="level-btn active" data-level="3">🏆 15 пар</div>
        <div class="level-btn" data-level="4">🔥 20 пар</div>
        <div class="level-btn" data-level="5">💪 25 пар</div>
        <div class="level-btn" data-level="6">🎯 30 пар</div>
        <div class="level-btn" data-level="7">👑 40 пар</div>
        <div class="level-btn" data-level="8">🏅 50 пар</div>
    </div></div>
    <div class="stats-bar"><span>🎯 Счёт: <span id="scoreValue">0</span></span><span>🧩 Осталось: <span id="remainValue">0</span></span><span>🔥 Серия: <span id="streakValue">0</span></span><span>🏆 Рекорд: <span id="recordValue">0</span></span></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="game-grid" id="gameGrid"></div>
    <div class="message-area" id="gameMessage">🌟 Нажми на плитку, затем на её пару (ключ + слово)</div>
    <div class="ctrl-buttons">
        <button id="hintBtn" class="hint-btn">💡 Подсказка</button>
        <button id="shuffleBtn" class="shuffle-btn">🔄 Перемешать</button>
        <button id="resetGameBtn" class="reset-btn">🆕 Новая игра</button>
    </div>
</div>

<script>
    // ========== КОНФИГУРАЦИЯ ТЕТРАДИ ==========
    const NOTEBOOK_CONFIG = {
        canvasSize: 420,
        gridPadding: 28,
        defaultBrushWidth: 9,          // ✅ ФИКСИРОВАННАЯ толщина
        exampleOpacity: 0.35,          // ✅ Чётко видимый полупрозрачный образец
        gridColor: '#b8956a',
        gridColorCenter: '#d4b896',
        strokeColor: '#1a0f0a',
        exampleColor: '#9b59b6',
        checkThreshold: 0.40,          // Порог "Отлично"
        checkGoodThreshold: 0.25,      // Порог "Хорошо"
        blurRadius: 3                  // Сглаживание для проверки
    };

    let RADICALS_DB = [];
    let currentLevel = 3;
    let tiles = [];
    let selectedId = null;
    let matchedCount = 0;
    let totalPairs = 0;
    let score = 0;
    let streak = 0;
    let record = 0;
    let currentModal = null;
    let chineseVoice = null;

    const scoreSpan = document.getElementById('scoreValue');
    const remainSpan = document.getElementById('remainValue');
    const streakSpan = document.getElementById('streakValue');
    const recordSpan = document.getElementById('recordValue');
    const progressFill = document.getElementById('progressFill');
    const msgEl = document.getElementById('gameMessage');
    const gridEl = document.getElementById('gameGrid');

    // ========== ГОЛОС ==========
    function loadChineseVoice() { 
        if (!window.speechSynthesis) return;
        const voices = speechSynthesis.getVoices(); 
        chineseVoice = voices.find(v => v.lang.startsWith("zh")); 
    }
    if (window.speechSynthesis) {
        speechSynthesis.onvoiceschanged = loadChineseVoice;
        setTimeout(loadChineseVoice, 100);
    }
    function speakChinese(text) {
        if (!window.speechSynthesis || !text) return;
        if (["丶","丨","丿","乛","⺄","⺀","⺁","⺂"].includes(text)) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "zh-CN"; u.rate = 0.8;
        if (chineseVoice) u.voice = chineseVoice;
        speechSynthesis.speak(u);
    }

    // ========== СЕТКА МИЦЗЫГЭ ==========
    function drawMiziGeGrid(ctx, size, padding) {
        const inner = size - padding*2, center = size/2;
        ctx.lineWidth = 2.5; ctx.strokeStyle = NOTEBOOK_CONFIG.gridColor;
        ctx.strokeRect(padding, padding, inner, inner);
        ctx.setLineDash([8,5]); ctx.lineWidth = 1.3; ctx.strokeStyle = NOTEBOOK_CONFIG.gridColorCenter;
        ctx.beginPath(); ctx.moveTo(center,padding); ctx.lineTo(center,size-padding); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(padding,center); ctx.lineTo(size-padding,center); ctx.stroke();
        ctx.setLineDash([4,4]); ctx.lineWidth = 0.9; ctx.strokeStyle = NOTEBOOK_CONFIG.gridColor;
        ctx.beginPath(); ctx.moveTo(padding,padding); ctx.lineTo(size-padding,size-padding); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(size-padding,padding); ctx.lineTo(padding,size-padding); ctx.stroke();
        ctx.setLineDash([]);
    }

    function initNotebookCanvas(canvas, char) {
        const s = NOTEBOOK_CONFIG.canvasSize;
        canvas.width = canvas.height = s;
        canvas.style.cssText = `width:100%;max-width:${s}px;aspect-ratio:1/1;display:block;touch-action:none`;
        const ctx = canvas.getContext('2d', {willReadFrequently:true});
        ctx.fillStyle = '#fffef9'; ctx.fillRect(0,0,s,s);
        drawMiziGeGrid(ctx, s, NOTEBOOK_CONFIG.gridPadding);
        ctx.strokeStyle = NOTEBOOK_CONFIG.strokeColor; ctx.lineWidth = NOTEBOOK_CONFIG.defaultBrushWidth;
        ctx.lineCap = ctx.lineJoin = 'round'; ctx.globalAlpha = 1;
        return ctx;
    }

    function showExampleOnCanvas(canvas, char) {
        const ctx = canvas.getContext('2d'), s = NOTEBOOK_CONFIG.canvasSize, p = NOTEBOOK_CONFIG.gridPadding;
        ctx.fillStyle = '#fffef9'; ctx.fillRect(0,0,s,s);
        drawMiziGeGrid(ctx, s, p);
        ctx.save(); ctx.globalAlpha = NOTEBOOK_CONFIG.exampleOpacity;
        ctx.strokeStyle = 'rgba(155,89,182,0.2)'; ctx.lineWidth = 4; ctx.strokeText(char, s/2, s/2 + (s-p*2)*0.07);
        ctx.fillStyle = NOTEBOOK_CONFIG.exampleColor; ctx.font = `900 ${(s-p*2)*0.9}px "Noto Sans CJK SC", serif`;
        ctx.textAlign = ctx.textBaseline = 'middle'; ctx.fillText(char, s/2, s/2 + (s-p*2)*0.07);
        ctx.restore();
        ctx.strokeStyle = NOTEBOOK_CONFIG.strokeColor; ctx.lineWidth = NOTEBOOK_CONFIG.defaultBrushWidth;
        ctx.lineCap = ctx.lineJoin = 'round'; ctx.globalAlpha = 1;
        canvas._refData = ctx.getImageData(0,0,s,s); // Сохраняем эталон для проверки
    }

    function clearNotebookCanvas(canvas) {
        const ctx = canvas.getContext('2d'), s = NOTEBOOK_CONFIG.canvasSize;
        ctx.fillStyle = '#fffef9'; ctx.fillRect(0,0,s,s);
        drawMiziGeGrid(ctx, s, NOTEBOOK_CONFIG.gridPadding);
        ctx.strokeStyle = NOTEBOOK_CONFIG.strokeColor; ctx.lineWidth = NOTEBOOK_CONFIG.defaultBrushWidth;
        ctx.lineCap = ctx.lineJoin = 'round'; ctx.globalAlpha = 1;
        delete canvas._refData;
        canvas._drawn = false;
    }

    // ✅ ПРОВЕРКА КАЧЕСТВА ОБВОДКИ
    function checkQuality(canvas) {
        if (!canvas._refData) return {score:0, msg:'Сначала покажи образец'};
        const ctx = canvas.getContext('2d'), s = NOTEBOOK_CONFIG.canvasSize;
        const current = ctx.getImageData(0,0,s,s);
        const dRef = canvas._refData.data, dCur = current.data;
        let match=0, totalRef=0, userTotal=0;
        const bgThreshold = 240;
        for(let i=0; i<dRef.length; i+=4){
            const isRef = (dRef[i]<200 || dRef[i+1]<200 || dRef[i+2]<200);
            const isUser = (dCur[i]<bgThreshold || dCur[i+1]<bgThreshold || dCur[i+2]<bgThreshold);
            if(isRef) { totalRef++; if(isUser) match++; }
            if(isUser && !isRef) userTotal++;
        }
        if(totalRef===0) return {score:0, msg:'Нет эталона'};
        const precision = match/totalRef;
        const recall = totalRef>0 ? match/(totalRef+userTotal) : 0;
        const f1 = 2 * (precision*recall)/(precision+recall+0.001);
        let msg = '', color = '#e74c3c';
        if(f1 > NOTEBOOK_CONFIG.checkThreshold) { msg = '🌟 Отлично! Почти идеально'; color = '#2ecc71'; }
        else if(f1 > NOTEBOOK_CONFIG.checkGoodThreshold) { msg = '👍 Хорошо! Попробуй ещё точнее'; color = '#f39c12'; }
        else { msg = '📝 Продолжай тренироваться'; color = '#e67e22'; }
        return { score: Math.round(f1*100), msg, color };
    }

    // ========== РИСОВАНИЕ ==========
    function setupDrawing(canvas) {
        let drawing = false, lastX=0, lastY=0;
        const ctx = canvas.getContext('2d');
        function getPos(e) {
            const r = canvas.getBoundingClientRect();
            const cx = e.clientX ?? e.touches?.[0]?.clientX ?? 0;
            const cy = e.clientY ?? e.touches?.[0]?.clientY ?? 0;
            return { x: (cx-r.left)*canvas.width/r.width, y: (cy-r.top)*canvas.height/r.height };
        }
        function start(e) { e.preventDefault(); drawing=true; const p=getPos(e); lastX=p.x; lastY=p.y; ctx.beginPath(); ctx.moveTo(p.x,p.y); canvas._drawn=true; }
        function draw(e) { if(!drawing) return; e.preventDefault(); const p=getPos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); lastX=p.x; lastY=p.y; }
        function stop() { if(drawing) { drawing=false; ctx.closePath(); } }
        canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', draw); canvas.addEventListener('mouseup', stop); canvas.addEventListener('mouseleave', stop);
        canvas.addEventListener('touchstart', start, {passive:false}); canvas.addEventListener('touchmove', draw, {passive:false}); canvas.addEventListener('touchend', stop); canvas.addEventListener('touchcancel', stop);
    }

    // ========== МОДАЛЬНОЕ ОКНО ТЕТРАДИ ==========
    function showLearnModal(radical) {
        if(currentModal) { currentModal.remove(); currentModal=null; }
        if(!radical) return;
        const modal = document.createElement('div'); modal.className='learn-modal';
        modal.innerHTML = `
            <div class="learn-card">
                <div class="radical-header">
                    <div class="radical-big pulse" id="radicalBig">${radical.key}</div>
                    <div style="text-align:left;min-width:160px">
                        <div class="radical-name">${radical.keyName}</div>
                        <div class="radical-pinyin">${radical.keyPinyin||'?'}</div>
                        <div class="radical-mean">${radical.wordName||'пример использования'}</div>
                    </div>
                </div>
                <div class="draw-section">
                    <div class="stroke-info"><span style="color:#f7b42c">✍️</span> ${radical.strokes||'?'} черт • Перо: ${NOTEBOOK_CONFIG.defaultBrushWidth}px (фикс.)</div>
                    <div class="draw-canvas-container"><canvas class="draw-canvas" id="nbCanvas"></canvas></div>
                    <div class="quality-bar"><div class="quality-fill" id="qFill"></div></div>
                    <div class="quality-text" id="qText">Нарисуй что-нибудь</div>
                    <div class="draw-tools">
                        <button class="clear-draw" id="nbClear">🧽 Очистить</button>
                        <button class="trace-btn" id="nbShow">👁️ Показать образец</button>
                        <button class="trace-btn" id="nbHide" style="display:none">🙈 Скрыть</button>
                        <button class="trace-btn" id="nbCheck" style="background:linear-gradient(135deg,#27ae60,#2ecc71)">✅ Проверить</button>
                    </div>
                </div>
                <div style="font-size:14px;font-weight:600;color:#3c2a1f;margin:10px 0 6px">📖 Слова с радикалом <span style="color:#c0392b">${radical.key}</span>:</div>
                <div class="examples-list" id="exList"></div>
                <div class="notebook-actions">
                    <button class="close-learn" id="nbClose">✖ Закрыть</button>
                    <button class="notebook-btn" id="nbAdd">📓 В мою тетрадь</button>
                </div>
            </div>`;
        document.body.appendChild(modal); currentModal=modal;
        const cvs = modal.querySelector('#nbCanvas'); initNotebookCanvas(cvs, radical.key); setupDrawing(cvs);
        
        // Слова-примеры
        const ex = [
            {char:radical.word, py:radical.wordPinyin||radical.keyPinyin, m:radical.wordName||radical.keyName},
            ...(radical.extraWords||[])
        ];
        modal.querySelector('#exList').innerHTML = ex.map(w=>`<div class="example-word" data-char="${w.char}"><div class="ex-char">${w.char}</div><div class="ex-pinyin">${w.py}</div><div class="ex-mean">${w.m}</div></div>`).join('');
        modal.querySelectorAll('.example-word').forEach(el=>el.onclick=()=>speakChinese(el.dataset.char));

        // Управление
        let exVisible=false;
        modal.querySelector('#nbShow').onclick=()=>{ showExampleOnCanvas(cvs, radical.key); exVisible=true; modal.querySelector('#nbShow').style.display='none'; modal.querySelector('#nbHide').style.display='inline-block'; msgEl.innerHTML='👁️ Обводи фиолетовый образец'; };
        modal.querySelector('#nbHide').onclick=()=>{ clearNotebookCanvas(cvs); exVisible=false; modal.querySelector('#nbShow').style.display='inline-block'; modal.querySelector('#nbHide').style.display='none'; msgEl.innerHTML='🙈 Образец скрыт'; };
        modal.querySelector('#nbClear').onclick=()=>{ clearNotebookCanvas(cvs); modal.querySelector('#qFill').style.width='0%'; modal.querySelector('#qText').textContent='Нарисуй что-нибудь'; msgEl.innerHTML='🧽 Очищено'; };
        modal.querySelector('#nbCheck').onclick=()=>{
            const r=checkQuality(cvs); modal.querySelector('#qFill').style.width=r.score+'%'; modal.querySelector('#qFill').style.background=r.color;
            modal.querySelector('#qText').textContent=r.msg; msgEl.innerHTML=`📊 Качество: ${r.score}%`;
        };
        modal.querySelector('#radicalBig').onclick=()=>speakChinese(radical.key);
        modal.querySelector('#nbClose').onclick=()=>{modal.remove();currentModal=null};
        modal.querySelector('#nbAdd').onclick=()=>{
            let nb=JSON.parse(localStorage.getItem('chinese_notebook')||'[]');
            if(!nb.find(i=>i.char===radical.key)) { nb.push({char:radical.key,name:radical.keyName,added:new Date().toISOString(),practiced:0}); localStorage.setItem('chinese_notebook',JSON.stringify(nb)); showToast(`✅ "${radical.key}" добавлен в тетрадь!`); }
            else showToast(`⚠️ "${radical.key}" уже есть`);
        };
        modal.onclick=e=>{if(e.target===modal){modal.remove();currentModal=null}};
        speakChinese(radical.key);
    }

    function showToast(m) { const t=document.createElement('div'); t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2ecc71;color:#fff;padding:10px 20px;border-radius:50px;z-index:3000;font-size:15px;box-shadow:0 5px 20px #0003'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2000); }

    // ========== ИГРОВАЯ ЛОГИКА ==========
    function getRandomPairs(count) {
        const sh=[...RADICALS_DB]; for(let i=sh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[sh[i],sh[j]]=[sh[j],sh[i]]} return sh.slice(0,Math.min(count,sh.length));
    }
    function renderGrid() {
        gridEl.innerHTML=''; const cfg=LEVEL_CONFIG[currentLevel]; if(cfg) gridEl.style.gridTemplateColumns=`repeat(${cfg.gridCols}, minmax(80px, 1fr))`;
        tiles.forEach(t=>{ if(t.removed) return; const d=document.createElement('div'); d.className='tile'+(selectedId===t.id?' selected':'');
            d.innerHTML=`<div class="main-char">${t.char}</div><div class="pinyin">${t.pinyin||''}</div><div class="info">${t.name||''}</div>`;
            d.onclick=()=>{speakChinese(t.char);onTileClick(t)}; gridEl.appendChild(d); });
    }
    function onTileClick(c) {
        if(c.removed) return;
        if(selectedId===null){selectedId=c.id;renderGrid();msgEl.innerHTML=`✅ Выбрано: ${c.char}`;return}
        const s=tiles.find(t=>t.id===selectedId); if(!s){selectedId=null;return}
        if(s.id===c.id){selectedId=null;renderGrid();msgEl.innerHTML='🔍 Снято';return}
        if(s.pairId===c.pairId && s.type!==c.type){
            s.removed=c.removed=true; matchedCount++; streak++; score+=10+Math.floor(streak/2)*2; if(streak>record)record=streak; updateUI();
            let keyTile=s.type==='key'?s:c; let rad=RADICALS_DB.find(r=>r.key===keyTile.char); if(rad)showLearnModal(rad);
            selectedId=null; renderGrid(); msgEl.innerHTML=`✅ Верно! +${score-10} очков (🔥${streak})`;
            if(matchedCount===totalPairs){ msgEl.innerHTML='🏆 УРОВЕНЬ ПРОЙДЕН!'; speakChinese('恭喜你'); setTimeout(()=>{if(confirm('🎉 Следующий уровень?')){const n=Math.min(8,currentLevel+1);document.querySelector(`.level-btn[data-level="${n}"]`)?.click()}},600); }
        } else { streak=0; updateUI(); msgEl.innerHTML='❌ Не пара!'; selectedId=null; renderGrid(); }
    }
    function updateUI(){ scoreSpan.textContent=score; remainSpan.textContent=totalPairs-matchedCount; streakSpan.textContent=streak; recordSpan.textContent=record; progressFill.style.width=`${(matchedCount/totalPairs)*100}%`; }
    function shuffleTiles(){ const rem=tiles.filter(t=>!t.removed), rm=tiles.filter(t=>t.removed); for(let i=rem.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rem[i],rem[j]]=[rem[j],rem[i]]} tiles=[...rem,...rm]; selectedId=null; renderGrid(); msgEl.innerHTML='🃏 Перемешано'; }
    function showHint(){ for(let i=0;i<tiles.length;i++){if(tiles[i].removed)continue; for(let j=i+1;j<tiles.length;j++){if(tiles[j].removed)continue; if(tiles[i].pairId===tiles[j].pairId&&tiles[i].type!==tiles[j].type){msgEl.innerHTML=`💡 Пара: "${tiles[i].char}" ↔ "${tiles[j].char}"`; return}}} msgEl.innerHTML='💡 Нет пар? Перемешай!'; }
    function initGame(level){
        if(RADICALS_DB.length===0){msgEl.innerHTML='⚠️ Подключи WORDS.js';return}
        currentLevel=level; const cfg=LEVEL_CONFIG[level]; let needed=Math.min(cfg.pairsCount,RADICALS_DB.length); if(needed<2)needed=2;
        const pairs=getRandomPairs(needed); totalPairs=pairs.length; matchedCount=score=streak=selectedId=0; tiles=[]; let id=0;
        pairs.forEach(p=>{tiles.push({id:id++,pairId:id/2|0,type:'key',char:p.key,pinyin:p.keyPinyin,name:p.keyName,removed:false});tiles.push({id:id++,pairId:id/2|0,type:'word',char:p.word,pinyin:p.wordPinyin||p.keyPinyin,name:p.wordName||p.keyName,removed:false})});
        for(let i=tiles.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[tiles[i],tiles[j]]=[tiles[j],tiles[i]]}
        updateUI(); renderGrid(); msgEl.innerHTML=`🎮 Уровень ${level}: ${totalPairs} пар. Соединяй КЛЮЧ ↔ СЛОВО!`;
    }

    const LEVEL_CONFIG={1:{pairsCount:6,gridCols:3},2:{pairsCount:10,gridCols:4},3:{pairsCount:15,gridCols:4},4:{pairsCount:20,gridCols:5},5:{pairsCount:25,gridCols:5},6:{pairsCount:30,gridCols:6},7:{pairsCount:40,gridCols:6},8:{pairsCount:50,gridCols:7}};

    // Загрузка данных
    if(typeof RADICALS!=='undefined'&&Array.isArray(RADICALS)&&RADICALS.length>0){
        RADICALS.forEach(r=>{if(!r.s||r.s.length>2||["⺌","⺈","⺍","⺮","⺅","⺋"].includes(r.s))return;
            let ex=null; if(typeof WORDS!=='undefined'){const ws=WORDS.filter(w=>w.c?.includes(r.s)&&w.c!==r.s&&w.c.length<=3); if(ws.length>0)ex=ws[0]}
            RADICALS_DB.push({key:r.s,keyPinyin:r.p||'?',keyName:r.m||'радикал',word:ex?.c||r.ex?.split(/[、\s]/)[0]||'中',wordPinyin:ex?.p||'',wordName:ex?.m||r.ex?.substring(0,20)||'пример',strokes:Math.min(12,Math.max(1,Math.floor(Math.random()*8)+1))})});
        console.log(`✅ Загружено ${RADICALS_DB.length} радикалов`);
    } else { msgEl.innerHTML='⚠️ WORDS.js не найден'; }

    document.querySelectorAll('.level-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.level-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');initGame(+b.dataset.level)});
    document.getElementById('hintBtn').onclick=showHint;
    document.getElementById('shuffleBtn').onclick=shuffleTiles;
    document.getElementById('resetGameBtn').onclick=()=>initGame(currentLevel);
    window.onload=()=>initGame(3);
</script>
</body>
</html>
