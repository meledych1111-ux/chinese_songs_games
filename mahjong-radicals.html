<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🀄️ МАДЖОНГ | ВСЕ РАДИКАЛЫ | ТЕТРАДЬ</title>
    <!-- ПОДКЛЮЧАЕМ ВНЕШНИЙ ФАЙЛ С WORDS и RADICALS -->
    <script src="WORDS.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: linear-gradient(145deg, #1a3a2a 0%, #0a1a0f 100%); min-height: 100vh; font-family: system-ui, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif; padding: 12px; }
        .game-container { max-width: 1200px; margin: 0 auto; background: rgba(30, 25, 20, 0.65); border-radius: 36px; padding: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
        h1 { text-align: center; font-size: clamp(1.2rem, 4vw, 1.6rem); color: #f7e05e; margin-bottom: 4px; }
        .sub { text-align: center; color: #d4c9a6; margin-bottom: 12px; font-size: 0.75rem; }
        .level-bar-wrapper { overflow-x: auto; white-space: nowrap; margin-bottom: 12px; padding-bottom: 8px; scrollbar-width: none; }
        .level-bar-wrapper::-webkit-scrollbar { display: none; }
        .level-bar { display: inline-flex; gap: 8px; padding: 0 4px; }
        .level-btn { background: #4a3729; color: #d4c9a6; padding: 6px 14px; border-radius: 40px; cursor: pointer; font-weight: bold; font-size: 0.75rem; white-space: nowrap; transition: 0.15s; }
        .level-btn.active { background: linear-gradient(135deg, #f7b42c, #fc8e2c); color: #2c1a0c; box-shadow: 0 4px 0 #b36b0f; }
        .stats-bar { display: flex; justify-content: space-between; background: #2c2118; padding: 8px 12px; border-radius: 60px; margin-bottom: 12px; color: #ffecb3; font-weight: bold; font-size: 0.8rem; flex-wrap: wrap; gap: 8px; }
        .stats-bar span { background: #00000044; padding: 4px 12px; border-radius: 40px; }
        /* ✅ ИГРА НА ВСЮ ШИРИНУ, РАВНОМЕРНЫЕ ПЛИТКИ */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 14px;
            background: #3c2a1f;
            padding: 16px;
            border-radius: 28px;
            margin: 12px 0;
            min-height: 300px;
            max-height: 75vh;
            overflow-y: auto;
        }
        .game-grid::-webkit-scrollbar { width: 8px; }
        .game-grid::-webkit-scrollbar-thumb { background: #8b6946; border-radius: 4px; }
        .tile {
            background: #fff8e7;
            background-image: radial-gradient(circle at 25% 35%, rgba(255,245,200,0.6) 2%, transparent 2.5%);
            background-size: 22px 22px;
            border-radius: 18px;
            text-align: center;
            cursor: pointer;
            transition: all 0.12s;
            border: 3px solid #c8aa6e;
            box-shadow: 0 5px 0 #8b6946;
            padding: 14px 8px;
            /* ✅ ОДИНАКОВЫЙ РАЗМЕР ВСЕХ ПЛИТОК */
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100px;
        }
        .tile:active { transform: scale(0.97); }
        .tile.selected { background: #ffe6b3; border-color: #f5b042; box-shadow: 0 2px 0 #8b6946, 0 0 0 4px rgba(245,176,66,0.4); transform: scale(0.98); }
        .tile.removed { display: none; }
        .tile .main-char { font-size: clamp(36px, 9vw, 52px); font-weight: 800; color: #3c2a1f; line-height: 1; }
        .tile .pinyin { font-size: 12px; color: #b34e1a; margin-top: 6px; font-weight: 500; }
        .tile .info { font-size: 11px; margin-top: 4px; color: #6a5a4a; background: #f3e5c9; display: inline-block; padding: 3px 10px; border-radius: 20px; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .message-area { background: #261d14e6; border-radius: 60px; padding: 10px 16px; text-align: center; font-weight: bold; font-size: 0.85rem; margin: 10px 0; color: #f7e6c4; min-height: 40px; display: flex; align-items: center; justify-content: center; }
        .ctrl-buttons { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        button { background: linear-gradient(135deg, #f7b42c, #fc8e2c); border: none; padding: 9px 18px; font-size: 0.8rem; font-weight: bold; border-radius: 50px; color: #2c1a0c; cursor: pointer; box-shadow: 0 3px 0 #9b5e1c; transition: 0.08s; }
        button:active { transform: translateY(2px); box-shadow: 0 1px 0 #9b5e1c; }
        .reset-btn { background: linear-gradient(135deg, #4b6a3b, #2d5a2a); color: #f9e7b3; }
        .hint-btn { background: linear-gradient(135deg, #3a6b8a, #2a4a6a); color: white; }
        .shuffle-btn { background: linear-gradient(135deg, #8e44ad, #6c3483); color: white; }
        .progress-bar { background: #4a3729; border-radius: 30px; height: 6px; margin: 8px 0; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #f7b42c, #f5a623); width: 0%; height: 100%; transition: width 0.4s cubic-bezier(0.4,0,0.2,1); }
        
        /* ========== ТЕТРАДЬ ========== */
        .learn-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 10px; }
        .learn-card { background: linear-gradient(145deg, #fffaf0, #f8f0e0); border-radius: 32px; padding: 18px; max-width: 680px; width: 100%; text-align: center; border: 3px solid #f7b42c; max-height: 96vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        .radical-header { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 14px; flex-wrap: wrap; }
        .radical-big { font-size: clamp(70px, 15vw, 95px); font-weight: 900; color: #c0392b; background: linear-gradient(135deg, #fff0d0, #ffe8c0); display: inline-flex; align-items: center; justify-content: center; padding: 10px 28px; border-radius: 20px; cursor: pointer; border: 2px dashed #f7b42c; min-width: 110px; min-height: 110px; }
        .radical-name { font-size: 22px; font-weight: bold; color: #2c1a0c; }
        .radical-pinyin { font-size: 18px; color: #8e44ad; margin: 2px 0; font-weight: 500; }
        .radical-mean { font-size: 14px; color: #6b5a4a; }
        .draw-section { background: linear-gradient(135deg, #f5e6d3, #e8d5c0); border-radius: 24px; padding: 14px; margin: 12px 0; border: 2px solid #d4b896; }
        .draw-canvas-container { position: relative; background: #fffef9; border-radius: 18px; padding: 6px; margin: 0 auto; border: 2px solid #c8aa6e; display: inline-block; box-shadow: inset 0 2px 8px rgba(0,0,0,0.08); }
        .draw-canvas { display: block; margin: 0 auto; cursor: crosshair; background: transparent; touch-action: none; }
        .draw-tools { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
        .draw-tools button { background: linear-gradient(135deg, #4b6a3b, #2d5a2a); padding: 8px 16px; font-size: 0.8rem; box-shadow: 0 3px 0 #1e3a1a; color: white; border-radius: 50px; }
        .draw-tools .clear-draw { background: linear-gradient(135deg, #c0392b, #e74c3c); }
        .draw-tools .trace-btn { background: linear-gradient(135deg, #2980b9, #3498db); }
        .stroke-info { background: #2c2118; padding: 7px 14px; border-radius: 40px; color: #f7e05e; font-weight: bold; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 8px; margin: 6px 0; }
        .quality-bar { background: #2c2118; height: 10px; border-radius: 10px; margin: 10px auto; max-width: 300px; overflow: hidden; }
        .quality-fill { height: 100%; background: linear-gradient(90deg, #e74c3c, #f39c12, #2ecc71); width: 0%; transition: width 0.5s ease; border-radius: 10px; }
        .quality-text { font-size: 0.85rem; color: #d4c9a6; margin-top: 4px; font-weight: 500; }
        .examples-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 12px 0; }
        .example-word { background: linear-gradient(135deg, #3c2a1f, #2a1a0f); border-radius: 18px; padding: 10px 14px; text-align: center; cursor: pointer; transition: 0.1s; min-width: 90px; border: 2px solid #5a4a3a; }
        .example-word:active { transform: scale(0.97); }
        .example-word .ex-char { font-size: 30px; font-weight: bold; color: #f7e05e; }
        .example-word .ex-pinyin { font-size: 11px; color: #ffd966; margin: 2px 0; }
        .example-word .ex-mean { font-size: 10px; color: #d4c9a6; }
        .notebook-actions { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
        .close-learn { background: linear-gradient(135deg, #f7b42c, #fc8e2c); border: none; padding: 10px 26px; font-size: 0.9rem; font-weight: bold; border-radius: 50px; cursor: pointer; }
        .notebook-btn { background: linear-gradient(135deg, #2ecc71, #27ae60); border: none; padding: 10px 22px; font-size: 0.85rem; font-weight: bold; border-radius: 50px; cursor: pointer; color: white; }
        .nav-buttons { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; }
        .back-btn { background: linear-gradient(135deg, #5a4a3a, #3a2a1a); color: #f7e05e; padding: 8px 16px; font-size: 0.8rem; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; border-radius: 40px; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        .pulse { animation: pulse 2s infinite ease-in-out; }
        @media (max-width: 768px) {
            .game-grid { grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 10px; padding: 12px; }
            .tile .main-char { font-size: 34px; }
            .learn-card { padding: 12px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="nav-buttons">
        <a href="index.html" class="back-btn">◀ На главную</a>
        <div></div>
    </div>
    <h1>🀄️ МАДЖОНГ | ВСЕ РАДИКАЛЫ</h1>
    <div class="sub">🔗 Соедини радикал (ключ) со словом, в котором он есть</div>
    <div class="level-bar-wrapper"><div class="level-bar" id="levelBar">
        <div class="level-btn" data-level="1">🌱 6 пар</div>
        <div class="level-btn" data-level="2">⭐ 10 пар</div>
        <div class="level-btn active" data-level="3">🏆 15 пар</div>
        <div class="level-btn" data-level="4">🔥 20 пар</div>
        <div class="level-btn" data-level="5">💪 25 пар</div>
        <div class="level-btn" data-level="6">🎯 30 пар</div>
        <div class="level-btn" data-level="7">👑 40 пар</div>
        <div class="level-btn" data-level="8">🏅 50 пар</div>
    </div></div>
    <div class="stats-bar"><span>🎯 Счёт: <span id="scoreValue">0</span></span><span>🧩 Осталось: <span id="remainValue">0</span></span><span>🔥 Серия: <span id="streakValue">0</span></span><span>🏆 Рекорд: <span id="recordValue">0</span></span></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="game-grid" id="gameGrid"></div>
    <div class="message-area" id="gameMessage">🌟 Нажми на радикал, затем на слово с ним</div>
    <div class="ctrl-buttons">
        <button id="hintBtn" class="hint-btn">💡 Подсказка</button>
        <button id="shuffleBtn" class="shuffle-btn">🔄 Перемешать</button>
        <button id="resetGameBtn" class="reset-btn">🆕 Новая игра</button>
    </div>
</div>

<script>
    // ========== НАСТРОЙКИ ==========
    const NOTEBOOK_CONFIG = {
        canvasSize: 420,
        gridPadding: 28,
        defaultBrushWidth: 9,
        exampleOpacity: 0.35,
        gridColor: '#b8956a',
        gridColorCenter: '#d4b896',
        strokeColor: '#1a0f0a',
        exampleColor: '#9b59b6',
        checkThreshold: 0.40,
        checkGoodThreshold: 0.25
    };

    const LEVEL_CONFIG = {
        1: { pairsCount: 6, gridCols: 3 },
        2: { pairsCount: 10, gridCols: 4 },
        3: { pairsCount: 15, gridCols: 4 },
        4: { pairsCount: 20, gridCols: 5 },
        5: { pairsCount: 25, gridCols: 5 },
        6: { pairsCount: 30, gridCols: 6 },
        7: { pairsCount: 40, gridCols: 6 },
        8: { pairsCount: 50, gridCols: 7 }
    };

    // ========== ГЛОБАЛЬНЫЕ ==========
    let RADICALS_DB = [];
    let currentLevel = 3;
    let tiles = [];
    let selectedId = null;
    let matchedCount = 0;
    let totalPairs = 0;
    let score = 0;
    let streak = 0;
    let record = 0;
    let currentModal = null;
    let chineseVoice = null;

    const scoreSpan = document.getElementById('scoreValue');
    const remainSpan = document.getElementById('remainValue');
    const streakSpan = document.getElementById('streakValue');
    const recordSpan = document.getElementById('recordValue');
    const progressFill = document.getElementById('progressFill');
    const msgEl = document.getElementById('gameMessage');
    const gridEl = document.getElementById('gameGrid');

    // ========== ГОЛОС ==========
    function loadChineseVoice() {
        if (!window.speechSynthesis) return;
        const voices = speechSynthesis.getVoices();
        chineseVoice = voices.find(v => v.lang.startsWith("zh")) || null;
    }
    if (window.speechSynthesis) {
        speechSynthesis.onvoiceschanged = loadChineseVoice;
        setTimeout(loadChineseVoice, 100);
    }
    function speakChinese(text) {
        if (!window.speechSynthesis || !text) return;
        if (["丶","丨","丿","乛","⺄","⺀","⺁","⺂"].includes(text)) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "zh-CN"; u.rate = 0.8;
        if (chineseVoice) u.voice = chineseVoice;
        speechSynthesis.speak(u);
    }

    // ========== ПОИСК СЛОВ С РАДИКАЛОМ ИЗ WORDS ==========
    // ✅ Ищем в массиве WORDS (подключён из WORDS.js) слова, содержащие radicalChar
    function findWordsWithRadical(radicalChar, limit = 5) {
        if (typeof WORDS === 'undefined' || !Array.isArray(WORDS)) return [];
        const results = [];
        const seen = new Set();
        for (let w of WORDS) {
            if (results.length >= limit) break;
            if (!w.c || w.c === radicalChar || seen.has(w.c)) continue;
            if (w.c.includes(radicalChar)) {
                seen.add(w.c);
                results.push({ char: w.c, pinyin: w.p || '', meaning: w.m || '' });
            }
        }
        return results;
    }

    // ========== СЕТКА МИЦЗЫГЭ ==========
    function drawMiziGeGrid(ctx, size, padding) {
        const inner = size - padding * 2, center = size / 2;
        ctx.lineWidth = 2.5; ctx.strokeStyle = NOTEBOOK_CONFIG.gridColor;
        ctx.strokeRect(padding, padding, inner, inner);
        ctx.setLineDash([8,5]); ctx.lineWidth = 1.3; ctx.strokeStyle = NOTEBOOK_CONFIG.gridColorCenter;
        ctx.beginPath(); ctx.moveTo(center, padding); ctx.lineTo(center, size - padding); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(padding, center); ctx.lineTo(size - padding, center); ctx.stroke();
        ctx.setLineDash([4,4]); ctx.lineWidth = 0.9; ctx.strokeStyle = NOTEBOOK_CONFIG.gridColor;
        ctx.beginPath(); ctx.moveTo(padding, padding); ctx.lineTo(size - padding, size - padding); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(size - padding, padding); ctx.lineTo(padding, size - padding); ctx.stroke();
        ctx.setLineDash([]);
    }

    function initNotebookCanvas(canvas) {
        const s = NOTEBOOK_CONFIG.canvasSize;
        canvas.width = canvas.height = s;
        canvas.style.cssText = `width:100%;max-width:${s}px;aspect-ratio:1/1;display:block;touch-action:none`;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.fillStyle = '#fffef9'; ctx.fillRect(0, 0, s, s);
        drawMiziGeGrid(ctx, s, NOTEBOOK_CONFIG.gridPadding);
        ctx.strokeStyle = NOTEBOOK_CONFIG.strokeColor;
        ctx.lineWidth = NOTEBOOK_CONFIG.defaultBrushWidth;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.globalAlpha = 1;
        return ctx;
    }

    function showExampleOnCanvas(canvas, char) {
        const ctx = canvas.getContext('2d'), s = NOTEBOOK_CONFIG.canvasSize;
        const innerSize = s - NOTEBOOK_CONFIG.gridPadding * 2;
        // Перерисовка фона
        ctx.fillStyle = '#fffef9'; ctx.fillRect(0, 0, s, s);
        drawMiziGeGrid(ctx, s, NOTEBOOK_CONFIG.gridPadding);
        // ✅ ПОЛУПРОЗРАЧНЫЙ ОБРАЗЕЦ — СТГО ПО ЦЕНТРУ
        ctx.save();
        ctx.globalAlpha = NOTEBOOK_CONFIG.exampleOpacity;
        ctx.fillStyle = NOTEBOOK_CONFIG.exampleColor;
        ctx.font = `900 ${Math.floor(innerSize * 0.85)}px "Noto Sans CJK SC", "KaiTi", "STKaiti", "Microsoft YaHei", serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(char, s / 2, s / 2);
        ctx.restore();
        // Настройки для рисования
        ctx.strokeStyle = NOTEBOOK_CONFIG.strokeColor;
        ctx.lineWidth = NOTEBOOK_CONFIG.defaultBrushWidth;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.globalAlpha = 1;
        // Сохраняем эталон для проверки
        canvas._refData = ctx.getImageData(0, 0, s, s);
    }

    function clearNotebookCanvas(canvas) {
        const ctx = canvas.getContext('2d'), s = NOTEBOOK_CONFIG.canvasSize;
        ctx.fillStyle = '#fffef9'; ctx.fillRect(0, 0, s, s);
        drawMiziGeGrid(ctx, s, NOTEBOOK_CONFIG.gridPadding);
        ctx.strokeStyle = NOTEBOOK_CONFIG.strokeColor;
        ctx.lineWidth = NOTEBOOK_CONFIG.defaultBrushWidth;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.globalAlpha = 1;
        delete canvas._refData;
        canvas._drawn = false;
    }

    function checkQuality(canvas) {
        if (!canvas._refData) return { score: 0, msg: 'Сначала покажи образец', color: '#95a5a6' };
        const ctx = canvas.getContext('2d'), s = NOTEBOOK_CONFIG.canvasSize;
        const current = ctx.getImageData(0, 0, s, s);
        const dRef = canvas._refData.data, dCur = current.data;
        let match = 0, totalRef = 0, userOutside = 0;
        const threshold = 235;
        for (let i = 0; i < dRef.length; i += 4) {
            const isRef = (dRef[i] < threshold || dRef[i+1] < threshold || dRef[i+2] < threshold);
            const isUser = (dCur[i] < threshold || dCur[i+1] < threshold || dCur[i+2] < threshold);
            if (isRef) { totalRef++; if (isUser) match++; }
            else if (isUser) { userOutside++; }
        }
        if (totalRef === 0) return { score: 0, msg: 'Нет эталона', color: '#95a5a6' };
        const precision = match / totalRef;
        const recall = totalRef > 0 ? match / (totalRef + userOutside) : 0;
        const f1 = 2 * (precision * recall) / (precision + recall + 0.001);
        const pct = Math.round(f1 * 100);
        if (f1 > NOTEBOOK_CONFIG.checkThreshold) return { score: pct, msg: '🌟 Отлично! Почти идеально', color: '#2ecc71' };
        if (f1 > NOTEBOOK_CONFIG.checkGoodThreshold) return { score: pct, msg: '👍 Хорошо! Попробуй ещё точнее', color: '#f39c12' };
        return { score: pct, msg: '📝 Продолжай тренироваться', color: '#e67e22' };
    }

    // ========== РИСОВАНИЕ ==========
    function setupDrawing(canvas) {
        let drawing = false;
        const ctx = canvas.getContext('2d');
        function getPos(e) {
            const r = canvas.getBoundingClientRect();
            const cx = e.clientX ?? e.touches?.[0]?.clientX ?? 0;
            const cy = e.clientY ?? e.touches?.[0]?.clientY ?? 0;
            return { x: (cx - r.left) * canvas.width / r.width, y: (cy - r.top) * canvas.height / r.height };
        }
        function start(e) { e.preventDefault(); drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); canvas._drawn = true; }
        function draw(e) { if (!drawing) return; e.preventDefault(); const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }
        function stop() { if (drawing) { drawing = false; ctx.closePath(); } }
        canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', draw); canvas.addEventListener('mouseup', stop); canvas.addEventListener('mouseleave', stop);
        canvas.addEventListener('touchstart', start, { passive: false }); canvas.addEventListener('touchmove', draw, { passive: false }); canvas.addEventListener('touchend', stop); canvas.addEventListener('touchcancel', stop);
    }

    // ========== ТЕТРАДЬ: МОДАЛЬНОЕ ОКНО ==========
    function showLearnModal(radical) {
        if (currentModal) { currentModal.remove(); currentModal = null; }
        if (!radical) return;

        // ✅ Ищем 2-3 слова из WORDS, которые содержат этот радикал
        const wordsWithRadical = findWordsWithRadical(radical.key, 3);

        const modal = document.createElement('div');
        modal.className = 'learn-modal';
        modal.innerHTML = `
            <div class="learn-card">
                <div class="radical-header">
                    <div class="radical-big pulse">${radical.key}</div>
                    <div style="text-align:left;min-width:160px">
                        <div class="radical-name">${radical.keyName}</div>
                        <div class="radical-pinyin">${radical.keyPinyin || '?'}</div>
                        <div class="radical-mean">${radical.keyMeaning || 'радикал (ключ)'}</div>
                    </div>
                </div>
                <div class="draw-section">
                    <div class="stroke-info">✍️ ${radical.strokes || '?'} черт • Перо: ${NOTEBOOK_CONFIG.defaultBrushWidth}px (фикс.)</div>
                    <div class="draw-canvas-container">
                        <canvas class="draw-canvas" id="nbCanvas"></canvas>
                    </div>
                    <div class="quality-bar"><div class="quality-fill" id="qFill"></div></div>
                    <div class="quality-text" id="qText">Нарисуй что-нибудь</div>
                    <div class="draw-tools">
                        <button class="clear-draw" id="nbClear">🧽 Очистить</button>
                        <button class="trace-btn" id="nbShow">👁️ Показать образец</button>
                        <button class="trace-btn" id="nbHide" style="display:none">🙈 Скрыть</button>
                        <button class="trace-btn" id="nbCheck" style="background:linear-gradient(135deg,#27ae60,#2ecc71)">✅ Проверить</button>
                    </div>
                </div>
                <div style="font-size:14px;font-weight:600;color:#3c2a1f;margin:10px 0 6px">📖 Слова с радикалом <span style="color:#c0392b">${radical.key}</span>:</div>
                <div class="examples-list" id="exList">
                    ${wordsWithRadical.length > 0 ? wordsWithRadical.map(w => `
                        <div class="example-word" data-char="${w.char}">
                            <div class="ex-char">${w.char}</div>
                            <div class="ex-pinyin">${w.pinyin}</div>
                            <div class="ex-mean">${w.meaning}</div>
                        </div>
                    `).join('') : `<div style="color:#888;font-size:13px;padding:8px">Нет слов в словаре</div>`}
                </div>
                <div class="notebook-actions">
                    <button class="close-learn" id="nbClose">✖ Закрыть</button>
                    <button class="notebook-btn" id="nbAdd">📓 В мою тетрадь</button>
                </div>
            </div>`;

        document.body.appendChild(modal);
        currentModal = modal;

        const cvs = modal.querySelector('#nbCanvas');
        initNotebookCanvas(cvs);
        setupDrawing(cvs);

        // Слова с радикалом — клик = озвучка
        modal.querySelectorAll('.example-word').forEach(el => {
            el.onclick = () => speakChinese(el.dataset.char);
        });

        let exVisible = false;
        modal.querySelector('#nbShow').onclick = () => {
            showExampleOnCanvas(cvs, radical.key);
            exVisible = true;
            modal.querySelector('#nbShow').style.display = 'none';
            modal.querySelector('#nbHide').style.display = 'inline-block';
            msgEl.innerHTML = '👁️ Обводи фиолетовый образец по центру';
        };
        modal.querySelector('#nbHide').onclick = () => {
            clearNotebookCanvas(cvs);
            exVisible = false;
            modal.querySelector('#nbShow').style.display = 'inline-block';
            modal.querySelector('#nbHide').style.display = 'none';
            msgEl.innerHTML = '🙈 Образец скрыт';
        };
        modal.querySelector('#nbClear').onclick = () => {
            clearNotebookCanvas(cvs);
            modal.querySelector('#qFill').style.width = '0%';
            modal.querySelector('#qText').textContent = 'Нарисуй что-нибудь';
            msgEl.innerHTML = '🧽 Очищено';
        };
        modal.querySelector('#nbCheck').onclick = () => {
            const r = checkQuality(cvs);
            modal.querySelector('#qFill').style.width = r.score + '%';
            modal.querySelector('#qFill').style.background = r.color;
            modal.querySelector('#qText').textContent = r.msg;
            msgEl.innerHTML = `📊 Качество: ${r.score}%`;
        };
        modal.querySelector('.radical-big').onclick = () => speakChinese(radical.key);
        modal.querySelector('#nbClose').onclick = () => { modal.remove(); currentModal = null; };
        modal.querySelector('#nbAdd').onclick = () => {
            let nb = JSON.parse(localStorage.getItem('chinese_notebook') || '[]');
            if (!nb.find(i => i.char === radical.key)) {
                nb.push({ char: radical.key, name: radical.keyName, added: new Date().toISOString() });
                localStorage.setItem('chinese_notebook', JSON.stringify(nb));
                showToast(`✅ "${radical.key}" добавлен в тетрадь!`);
            } else {
                showToast(`⚠️ "${radical.key}" уже есть`);
            }
        };
        modal.onclick = e => { if (e.target === modal) { modal.remove(); currentModal = null; } };
        speakChinese(radical.key);
    }

    function showToast(m) {
        const t = document.createElement('div');
        t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2ecc71;color:#fff;padding:10px 20px;border-radius:50px;z-index:3000;font-size:15px;box-shadow:0 5px 20px rgba(0,0,0,0.3);';
        t.textContent = m;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2000);
    }

    // ========== ИГРОВАЯ ЛОГИКА ==========

    // ✅ Формируем пары: радикал + слово, в котором этот радикал есть
    function buildPairs(count) {
        if (!Array.isArray(RADICALS_DB) || RADICALS_DB.length === 0) return [];
        if (typeof WORDS === 'undefined' || !Array.isArray(WORDS)) return [];

        const pairs = [];
        const usedRadicals = new Set();
        const usedWords = new Set();
        const maxAttempts = count * 5;
        let attempts = 0;

        while (pairs.length < count && attempts < maxAttempts) {
            attempts++;
            // Берём случайный радикал
            const rad = RADICALS_DB[Math.floor(Math.random() * RADICALS_DB.length)];
            if (!rad || !rad.key || usedRadicals.has(rad.key)) continue;

            // Ищем слова с этим радикалом
            const words = findWordsWithRadical(rad.key, 3);
            if (words.length === 0) continue;

            // Берём случайное слово из найденных
            const word = words[Math.floor(Math.random() * words.length)];
            if (usedWords.has(word.char)) continue;

            usedRadicals.add(rad.key);
            usedWords.add(word.char);

            pairs.push({
                radical: rad.key,
                radicalPinyin: rad.keyPinyin || '?',
                radicalName: rad.keyName || rad.key,
                word: word.char,
                wordPinyin: word.pinyin,
                wordMeaning: word.meaning,
                strokes: rad.strokes || '?'
            });
        }
        return pairs;
    }

    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function renderGrid() {
        if (!gridEl) return;
        const cfg = LEVEL_CONFIG[currentLevel];
        if (cfg) gridEl.style.gridTemplateColumns = `repeat(auto-fill, minmax(100px, 1fr))`;
        gridEl.innerHTML = '';
        for (let i = 0; i < tiles.length; i++) {
            const t = tiles[i];
            if (t.removed) continue;
            const d = document.createElement('div');
            d.className = 'tile' + (selectedId === t.id ? ' selected' : '');
            d.innerHTML = `
                <div class="main-char">${t.char}</div>
                <div class="pinyin">${t.pinyin || ''}</div>
                <div class="info">${t.name || ''}</div>
            `;
            d.onclick = () => {
                speakChinese(t.char);
                onTileClick(t);
            };
            gridEl.appendChild(d);
        }
    }

    function onTileClick(clicked) {
        if (clicked.removed) return;
        if (selectedId === null) {
            selectedId = clicked.id;
            renderGrid();
            msgEl.innerHTML = `✅ Выбрано: ${clicked.char}`;
            return;
        }
        const sel = tiles.find(t => t.id === selectedId);
        if (!sel) { selectedId = null; return; }
        if (sel.id === clicked.id) {
            selectedId = null;
            renderGrid();
            msgEl.innerHTML = '🔍 Снято';
            return;
        }
        if (sel.pairId === clicked.pairId && sel.type !== clicked.type) {
            // ✅ ВЕРНАЯ ПАРА
            sel.removed = true;
            clicked.removed = true;
            matchedCount++;
            streak++;
            score += 10 + Math.floor(streak / 2) * 2;
            if (streak > record) record = streak;
            updateUI();

            let keyTile = sel.type === 'key' ? sel : clicked;
            let rad = RADICALS_DB.find(r => r.key === keyTile.char);
            if (rad) showLearnModal(rad);

            selectedId = null;
            renderGrid();
            msgEl.innerHTML = `✅ Верно! +${10 + Math.floor(streak / 2) * 2} очков (🔥 серия ${streak})`;

            if (matchedCount === totalPairs) {
                msgEl.innerHTML = '🏆 УРОВЕНЬ ПРОЙДЕН!';
                speakChinese('恭喜你');
                setTimeout(() => {
                    if (confirm('🎉 Следующий уровень?')) {
                        const n = Math.min(8, currentLevel + 1);
                        const btn = document.querySelector(`.level-btn[data-level="${n}"]`);
                        if (btn) btn.click();
                    }
                }, 600);
            }
        } else {
            streak = 0;
            updateUI();
            msgEl.innerHTML = `❌ Не пара! "${sel.char}" ≠ "${clicked.char}"`;
            selectedId = null;
            renderGrid();
        }
    }

    function updateUI() {
        if (scoreSpan) scoreSpan.textContent = score;
        if (remainSpan) remainSpan.textContent = totalPairs - matchedCount;
        if (streakSpan) streakSpan.textContent = streak;
        if (recordSpan) recordSpan.textContent = record;
        if (progressFill && totalPairs > 0) {
            progressFill.style.width = ((matchedCount / totalPairs) * 100) + '%';
        }
    }

    function shuffleTiles() {
        if (tiles.length === 0) { initGame(currentLevel); return; }
        const remaining = tiles.filter(t => !t.removed);
        const removed = tiles.filter(t => t.removed);
        shuffle(remaining);
        tiles = [...remaining, ...removed];
        selectedId = null;
        renderGrid();
        msgEl.innerHTML = '🃏 Плитки перемешаны!';
    }

    function showHint() {
        // ✅ Ищем первую ненайденную пару
        for (let i = 0; i < tiles.length; i++) {
            if (tiles[i].removed) continue;
            for (let j = i + 1; j < tiles.length; j++) {
                if (tiles[j].removed) continue;
                if (tiles[i].pairId === tiles[j].pairId && tiles[i].type !== tiles[j].type) {
                    msgEl.innerHTML = `💡 Пара: "${tiles[i].char}" ↔ "${tiles[j].char}"`;
                    // Подсветка пары на 2 секунды
                    const allTiles = gridEl.querySelectorAll('.tile');
                    let idx = 0;
                    for (let k = 0; k < tiles.length; k++) {
                        if (tiles[k].removed) continue;
                        if (tiles[k].id === tiles[i].id || tiles[k].id === tiles[j].id) {
                            if (allTiles[idx]) {
                                allTiles[idx].style.borderColor = '#f7b42c';
                                allTiles[idx].style.boxShadow = '0 0 0 4px rgba(247,180,44,0.5), 0 5px 0 #8b6946';
                            }
                        }
                        idx++;
                    }
                    setTimeout(() => {
                        renderGrid();
                    }, 2000);
                    return;
                }
            }
        }
        msgEl.innerHTML = '💡 Все пары найдены!';
    }

    function initGame(level) {
        if (!Array.isArray(RADICALS_DB) || RADICALS_DB.length === 0) {
            msgEl.innerHTML = '⚠️ RADICALS не загружены из WORDS.js';
            return;
        }
        currentLevel = level;
        const cfg = LEVEL_CONFIG[level];
        let needed = Math.min(cfg.pairsCount, Math.floor(RADICALS_DB.length * 0.8));
        if (needed < 3) needed = 3;

        const pairs = buildPairs(needed);
        if (pairs.length === 0) {
            msgEl.innerHTML = '⚠️ Не удалось составить пары. Проверьте WORDS.js';
            return;
        }

        totalPairs = pairs.length;
        matchedCount = 0;
        score = 0;
        streak = 0;
        selectedId = null;
        tiles = [];
        let id = 0;

        pairs.forEach((p, i) => {
            tiles.push({ id: id++, pairId: i, type: 'key', char: p.radical, pinyin: p.radicalPinyin, name: p.radicalName, removed: false });
            tiles.push({ id: id++, pairId: i, type: 'word', char: p.word, pinyin: p.wordPinyin, name: p.wordMeaning, removed: false });
        });

        // ✅ Перемешиваем ВСЕ плитки
        shuffle(tiles);
        updateUI();
        renderGrid();
        msgEl.innerHTML = `🎮 Уровень ${level}: ${totalPairs} пар. Радикал ↔ Слово с ним!`;
    }

    // ========== ЗАГРУЗКА ДАННЫХ ИЗ WORDS.JS ==========
    if (typeof RADICALS !== 'undefined' && Array.isArray(RADICALS) && RADICALS.length > 0) {
        const skip = ["⺌","⺈","⺍","⺮","⺅","⺋"];
        RADICALS.forEach(r => {
            if (!r.s || r.s.length > 2 || skip.includes(r.s)) return;
            RADICALS_DB.push({
                key: r.s,
                keyPinyin: r.p || '?',
                keyName: r.m || 'радикал',
                keyMeaning: r.m || '',
                strokes: Math.min(12, Math.max(1, Math.floor(Math.random() * 8) + 1))
            });
        });
        console.log(`✅ Загружено ${RADICALS_DB.length} радикалов из WORDS.js`);
    } else {
        console.warn('⚠️ Массив RADICALS не найден в WORDS.js');
    }

    // ========== ОБРАБОТЧИКИ ==========
    document.querySelectorAll('.level-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            initGame(parseInt(btn.dataset.level));
        };
    });
    document.getElementById('hintBtn').onclick = showHint;
    document.getElementById('shuffleBtn').onclick = shuffleTiles;
    document.getElementById('resetGameBtn').onclick = () => initGame(currentLevel);

    // Запуск
    window.addEventListener('load', () => initGame(3));
</script>
</body>
</html>
