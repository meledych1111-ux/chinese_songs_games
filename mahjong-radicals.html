        }

            padding: 20px;
        }
        h1 {
            text-align: center;
            font-size: 1.6rem;
            color: #f7e05e;
            margin-bottom: 5px;
        }
        .sub {
            text-align: center;
            color: #d4c9a6;
            margin-bottom: 15px;
            font-size: 0.75rem;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #2c2118;
            padding: 8px 16px;
            border-radius: 60px;
            margin-bottom: 15px;
            color: #ffecb3;
            font-weight: bold;
            font-size: 0.85rem;
            flex-wrap: wrap;
            gap: 8px;
        }
        .stats-bar span {
            background: #00000066;
            padding: 4px 12px;
            border-radius: 40px;
        }
        .level-bar {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .level-btn {
            background: #4a3729;
            color: #d4c9a6;
            padding: 5px 12px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.7rem;
        }
        .level-btn.active {
            background: linear-gradient(135deg, #f7b42c, #fc8e2c);
            color: #2c1a0c;
        }
        .game-grid {
            display: grid;
            gap: 8px;
            background: #4a3729;
            padding: 16px;
            border-radius: 40px;
            min-height: 400px;
            margin: 12px 0;
            max-height: 55vh;
            overflow-y: auto;
        }
        .tile {
            background: #fff8e7;
            background-image: radial-gradient(circle at 25% 35%, rgba(255,245,200,0.6) 2%, transparent 2.5%);
            background-size: 20px 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            border: 2px solid #c8aa6e;
            box-shadow: 0 4px 0 #8b6946;
            padding: 8px 4px;
        }
        .tile.selected {
            background: #ffe6b3;
            border: 3px solid #f5b042;
            transform: scale(0.96);
            box-shadow: 0 2px 0 #8b6946;
        }
        .tile.removed { display: none; }
        .tile .main-char { font-size: 32px; font-weight: 800; color: #3c2a1f; }
        .tile .pinyin { font-size: 9px; color: #b34e1a; margin-top: 3px; }
        .tile .info { font-size: 8px; margin-top: 2px; color: #7a5a3a; background: #f3e5c9; display: inline-block; padding: 2px 6px; border-radius: 40px; }
        .message-area {
            background: #261d14e6;
            border-radius: 60px;
            padding: 10px 16px;
            text-align: center;
            font-weight: bold;
            font-size: 0.85rem;
            margin: 12px 0;
            color: #f7e6c4;
        }
        .ctrl-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        button {
            background: linear-gradient(135deg, #f7b42c, #fc8e2c);
            border: none;
            padding: 8px 20px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 60px;
            color: #2c1a0c;
            cursor: pointer;
            box-shadow: 0 3px 0 #9b5e1c;
        }
        button:active { transform: translateY(2px); }
        .reset-btn { background: linear-gradient(135deg, #4b6a3b, #2d5a2a); color: #f9e7b3; }
        .hint-btn { background: linear-gradient(135deg, #3a6b8a, #2a4a6a); color: white; }
        .shuffle-btn { background: linear-gradient(135deg, #8e44ad, #6c3483); color: white; }
        .progress-bar {
            background: #4a3729;
            border-radius: 30px;
            height: 6px;
            margin: 10px 0;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, #f7b42c, #f5a623);
            width: 0%;
            height: 100%;
            transition: width 0.3s;
        }
        .learn-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 16px;
        }
        .learn-card {
            background: linear-gradient(145deg, #fff8e7, #f5e6c8);
            border-radius: 40px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 3px solid #f7b42c;
            max-height: 85vh;
            overflow-y: auto;
        }
        .learn-card .radical-big { font-size: 60px; font-weight: 800; color: #b34e1a; background: #fff0d0; display: inline-block; padding: 5px 20px; border-radius: 50px; margin-bottom: 10px; }
        .learn-card .radical-name { font-size: 18px; font-weight: bold; }
        .learn-card .radical-pinyin { font-size: 14px; color: #8e44ad; margin-bottom: 10px; }
        .examples-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 12px 0; }
        .example-word {
            background: #3c2a1f;
            border-radius: 16px;
            padding: 6px 12px;
            text-align: center;
            cursor: pointer;
        }

        .example-word .ex-pinyin { font-size: 10px; color: #ffd966; }
        .example-word .ex-mean { font-size: 9px; color: #d4c9a6; }
        .close-learn {
            background: linear-gradient(135deg, #f7b42c, #fc8e2c);
            border: none;
            padding: 8px 20px;
            font-size: 0.85rem;
            border-radius: 60px;
            cursor: pointer;
            margin-top: 10px;
        }

            currentModal = null;
        };
        speakChinese(pair.key);
    }

    function renderGrid() {
        if (!gridEl) return;
        const config = LEVEL_CONFIG[currentLevel];
        gridEl.style.gridTemplateColumns = `repeat(${config.gridCols}, 1fr)`;
        gridEl.innerHTML = '';
        for (let i = 0; i < tiles.length; i++) {
            const tile = tiles[i];
            if (tile.removed) continue;
            const div = document.createElement('div');
            div.className = 'tile';
            if (selectedId === tile.id) div.classList.add('selected');
            div.innerHTML = `
                <div class="main-char">${tile.char}</div>
                <div class="pinyin">${tile.pinyin}</div>
                <div class="info">${tile.name}</div>
            `;
            div.onclick = (function(t) { 
                return function() { 
                    speakChinese(t.char);
                    onTileClick(t); 
                }; 
            })(tile);
            gridEl.appendChild(div);
        }
        if (gridEl.children.length === 0 && matchedCount === totalPairs) {
            msgEl.innerHTML = "🏆 ПОБЕДА! Отличная игра! 🏆";
        }
    }

    function onTileClick(clickedTile) {
        if (clickedTile.removed) return;
        if (selectedId === null) {
            selectedId = clickedTile.id;
            renderGrid();
            msgEl.innerHTML = `✅ Выбрано: ${clickedTile.char} (${clickedTile.name})`;
            return;
        }
        const selectedTile = tiles.find(t => t.id === selectedId);
        if (selectedTile.id === clickedTile.id) {
            selectedId = null;
            renderGrid();
            msgEl.innerHTML = "🔍 Выделение снято";
            return;
        }
        if (selectedTile.pairId === clickedTile.pairId && selectedTile.type !== clickedTile.type) {
            selectedTile.removed = true;
            clickedTile.removed = true;
            matchedCount++;
            streak++;
            const points = 10 + Math.floor(streak / 2) * 2;
            score += points;
            if (streak > record) record = streak;
            updateUI();
            const pair = ALL_PAIRS[selectedTile.pairId % ALL_PAIRS.length];
            if (pair) showLearnModal(pair);
            selectedId = null;
            renderGrid();
            msgEl.innerHTML = `✅ Верно! +${points} очков (серия ${streak})`;
            if (matchedCount === totalPairs) {
                msgEl.innerHTML = `🏆 ПОБЕДА! Уровень ${currentLevel} пройден! 🏆`;
                speakChinese("恭喜你");
            }
        } else {
            streak = 0;
            updateUI();
            msgEl.innerHTML = `❌ Не пара! "${selectedTile.char}" ≠ "${clickedTile.char}"`;
            selectedId = null;
            renderGrid();
        }
    }

    function updateUI() {
        scoreSpan.textContent = score;
        remainSpan.textContent = totalPairs - matchedCount;
        streakSpan.textContent = streak;
        recordSpan.textContent = record;
        progressFill.style.width = ((matchedCount / totalPairs) * 100) + "%";
    }

    function shuffleTiles() {
        const remaining = tiles.filter(t => !t.removed);
        if (remaining.length === 0) {
            initGame(currentLevel);
            return;
        }
        const tileData = remaining.map(t => ({
            pairId: t.pairId,
            type: t.type,
            char: t.char,
            pinyin: t.pinyin,
            name: t.name
        }));
        for (let i = tileData.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [tileData[i], tileData[j]] = [tileData[j], tileData[i]];
        }
        let idx = 0;
        for (let i = 0; i < tiles.length; i++) {
            if (!tiles[i].removed) {
                tiles[i].pairId = tileData[idx].pairId;
                tiles[i].type = tileData[idx].type;
                tiles[i].char = tileData[idx].char;
                tiles[i].pinyin = tileData[idx].pinyin;
                tiles[i].name = tileData[idx].name;
                idx++;
            }
        }
        selectedId = null;
        renderGrid();
        msgEl.innerHTML = "🃏 Плитки перемешаны! Продолжай игру.";
    }

    function showHint() {
        for (let i = 0; i < tiles.length; i++) {
            if (tiles[i].removed) continue;
            for (let j = i + 1; j < tiles.length; j++) {
                if (tiles[j].removed) continue;
                if (tiles[i].pairId === tiles[j].pairId && tiles[i].type !== tiles[j].type) {
                    msgEl.innerHTML = `💡 Подсказка: "${tiles[i].char}" и "${tiles[j].char}" — это пара!`;
                    return;
                }
            }
        }
        msgEl.innerHTML = "💡 Попробуй перемешать плитки!";
    }

    function initGame(level) {
        currentLevel = level;
        const config = LEVEL_CONFIG[level];
        const neededPairs = config.pairsCount;
        const selectedPairs = [];
        for (let i = 0; i < neededPairs; i++) {
            selectedPairs.push(ALL_PAIRS[i % ALL_PAIRS.length]);
        }
        totalPairs = selectedPairs.length;
        matchedCount = 0;
        score = 0;
        streak = 0;
        selectedId = null;
        tiles = [];
        let idCounter = 0;
        for (let i = 0; i < selectedPairs.length; i++) {
            const pair = selectedPairs[i];
            tiles.push({
                id: idCounter++,
                pairId: i,
                type: 'key',
                char: pair.key,
                pinyin: pair.keyPinyin,
                name: pair.keyName,
                removed: false
            });
            tiles.push({
                id: idCounter++,
                pairId: i,
                type: 'word',
                char: pair.word,
                pinyin: pair.wordPinyin,
                name: pair.wordName,
                removed: false
            });
        }
        for (let i = tiles.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
        }
        updateUI();
        renderGrid();
        msgEl.innerHTML = `🎮 Уровень ${level} (${totalPairs} пар). Соединяй КЛЮЧ со СЛОВОМ!`;
    }

    document.querySelectorAll('.level-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const level = parseInt(btn.dataset.level);
            initGame(level);
        };
    });

    document.getElementById('hintBtn').onclick = showHint;
    document.getElementById('shuffleBtn').onclick = shuffleTiles;
    document.getElementById('resetGameBtn').onclick = () => initGame(currentLevel);
    
    initGame(3);
</script>
</body>
</html>
