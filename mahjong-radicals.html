<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🀄️ МАДЖОНГ | ВСЕ РАДИКАЛЫ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js"></script>
    <script src="WORDS.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
        body{background:linear-gradient(145deg,#1a3a2a,#0a1a0f);min-height:100vh;font-family:system-ui,'PingFang SC','Noto Sans CJK SC',sans-serif;padding:8px}
        .game-container{max-width:1200px;margin:0 auto;background:rgba(30,25,20,.65);border-radius:28px;padding:12px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
        h1{text-align:center;font-size:clamp(1rem,3.5vw,1.4rem);color:#f7e05e;margin-bottom:2px}
        .sub{text-align:center;color:#d4c9a6;margin-bottom:8px;font-size:.7rem}
        .level-bar-wrapper{overflow-x:auto;white-space:nowrap;margin-bottom:8px;padding-bottom:4px;scrollbar-width:none}
        .level-bar-wrapper::-webkit-scrollbar{display:none}
        .level-bar{display:inline-flex;gap:6px;padding:0 4px}
        .level-btn{background:#4a3729;color:#d4c9a6;padding:4px 12px;border-radius:40px;cursor:pointer;font-weight:bold;font-size:.7rem;white-space:nowrap;transition:.15s}
        .level-btn.active{background:linear-gradient(135deg,#f7b42c,#fc8e2c);color:#2c1a0c;box-shadow:0 3px 0 #b36b0f}
        .stats-bar{display:flex;justify-content:space-between;background:#2c2118;padding:6px 10px;border-radius:60px;margin-bottom:8px;color:#ffecb3;font-weight:bold;font-size:.75rem;flex-wrap:wrap;gap:6px}
        .stats-bar span{background:#00000044;padding:3px 10px;border-radius:40px}
        .game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;background:#3c2a1f;padding:12px;border-radius:20px;margin:8px 0;min-height:200px;max-height:70vh;overflow-y:auto}
        .game-grid::-webkit-scrollbar{width:6px}.game-grid::-webkit-scrollbar-thumb{background:#8b6946;border-radius:3px}
        .tile{background:#fff8e7;border-radius:14px;text-align:center;cursor:pointer;transition:all .12s;border:2px solid #c8aa6e;box-shadow:0 4px 0 #8b6946;padding:10px 6px;aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:80px}
        .tile:active{transform:scale(.97)}
        .tile.selected{background:#ffe6b3;border-color:#f5b042;box-shadow:0 2px 0 #8b6946,0 0 0 3px rgba(245,176,66,.4);transform:scale(.98)}
        .tile.removed{display:none}
        .tile .main-char{font-size:clamp(28px,7vw,42px);font-weight:800;color:#3c2a1f;line-height:1}
        .tile .pinyin{font-size:10px;color:#b34e1a;margin-top:3px;font-weight:500}
        .tile .info{font-size:9px;margin-top:2px;color:#6a5a4a;background:#f3e5c9;display:inline-block;padding:2px 8px;border-radius:20px;max-width:95%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .message-area{background:#261d14e6;border-radius:60px;padding:8px 14px;text-align:center;font-weight:bold;font-size:.8rem;margin:8px 0;color:#f7e6c4;min-height:36px;display:flex;align-items:center;justify-content:center}
        .ctrl-buttons{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px}
        button{background:linear-gradient(135deg,#f7b42c,#fc8e2c);border:none;padding:7px 14px;font-size:.75rem;font-weight:bold;border-radius:50px;color:#2c1a0c;cursor:pointer;box-shadow:0 3px 0 #9b5e1c;transition:.08s}
        button:active{transform:translateY(2px);box-shadow:0 1px 0 #9b5e1c}
        .reset-btn{background:linear-gradient(135deg,#4b6a3b,#2d5a2a);color:#f9e7b3}
        .hint-btn{background:linear-gradient(135deg,#3a6b8a,#2a4a6a);color:#fff}
        .shuffle-btn{background:linear-gradient(135deg,#8e44ad,#6c3483);color:#fff}
        .progress-bar{background:#4a3729;border-radius:30px;height:5px;margin:6px 0;overflow:hidden}
        .progress-fill{background:linear-gradient(90deg,#f7b42c,#f5a623);width:0%;height:100%;transition:width .4s cubic-bezier(.4,0,.2,1)}

        /* ===== МОДАЛКА: КРУПНАЯ РИСОВАЛКА + КОМПАКТНОЕ ОКРУЖЕНИЕ ===== */
        .learn-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:2000;padding:6px}
        .learn-card{background:linear-gradient(145deg,#fffaf0,#f8f0e0);border-radius:24px;padding:14px;max-width:480px;width:100%;text-align:center;border:2px solid #f7b42c;max-height:98vh;display:flex;flex-direction:column;gap:8px;box-shadow:0 20px 50px rgba(0,0,0,.6)}

        /* Шапка — радикал + инфо в одну строку, компактно */
        .radical-header{display:flex;align-items:center;gap:12px;justify-content:center}
        .radical-big{font-family:'Ma Shan Zheng',cursive;font-size:clamp(44px,10vw,56px);font-weight:400;color:#c0392b;background:linear-gradient(135deg,#fff0d0,#ffe8c0);display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:14px;cursor:pointer;border:2px dashed #f7b42c;flex-shrink:0;line-height:1}
        .radical-info{text-align:left;min-width:0}
        .radical-name{font-size:15px;font-weight:bold;color:#2c1a0c;line-height:1.2}
        .radical-pinyin{font-size:13px;color:#8e44ad;font-weight:500}
        .radical-mean{font-size:11px;color:#6b5a4a}

        /* ✅ КРУПНАЯ РИСОВАЛКА — не уменьшаем! */
        .writer-section{background:linear-gradient(135deg,#fdf6ee,#f5ead8);border-radius:16px;padding:10px;border:2px solid #d4b896;display:flex;flex-direction:column;align-items:center;gap:6px}
        .hw-box{width:220px;height:220px;background:#fffef9;border-radius:14px;border:2px solid #c8aa6e;box-shadow:inset 0 2px 6px rgba(0,0,0,.08);position:relative;overflow:hidden}
        .hw-box svg{width:100%!important;height:100%!important;display:block}
        .writer-toolbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
        .writer-toolbar button{font-size:.7rem;padding:5px 12px}

        /* Ползунок кисти — компактнее */
        .brush-controls{display:flex;align-items:center;justify-content:center;gap:8px}
        .brush-slider-wrapper{display:flex;align-items:center;gap:6px;background:#2c2118;padding:4px 12px;border-radius:40px}
        .brush-slider-wrapper label{font-size:.7rem;color:#f7e05e;font-weight:bold;white-space:nowrap}
        .brush-slider-wrapper input[type="range"]{width:100px;accent-color:#f7b42c;cursor:pointer}
        .brush-preview{border-radius:50%;background:#1a0f0a;transition:all .15s;flex-shrink:0}

        /* Примеры слов — горизонтальный скролл, компактные карточки */
        .examples-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
        .examples-row::-webkit-scrollbar{display:none}
        .example-word{background:linear-gradient(135deg,#3c2a1f,#2a1a0f);border-radius:12px;padding:6px 10px;text-align:center;cursor:pointer;transition:.1s;min-width:70px;border:1px solid #5a4a3a;flex-shrink:0}
        .example-word:active{transform:scale(.97)}
        .example-word .ex-char{font-size:22px;font-weight:bold;color:#f7e05e;line-height:1.1}
        .example-word .ex-pinyin{font-size:9px;color:#ffd966;margin:1px 0}
        .example-word .ex-mean{font-size:8px;color:#d4c9a6}

        /* Нижние кнопки */
        .notebook-actions{display:flex;gap:8px;justify-content:center}
        .close-learn{background:linear-gradient(135deg,#f7b42c,#fc8e2c);border:none;padding:8px 22px;font-size:.8rem;font-weight:bold;border-radius:50px;cursor:pointer}
        .notebook-btn{background:linear-gradient(135deg,#2ecc71,#27ae60);border:none;padding:8px 18px;font-size:.75rem;font-weight:bold;border-radius:50px;cursor:pointer;color:#fff}

        .nav-buttons{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
        .back-btn{background:linear-gradient(135deg,#5a4a3a,#3a2a1a);color:#f7e05e;padding:6px 14px;font-size:.75rem;text-decoration:none;display:inline-flex;align-items:center;gap:5px;border-radius:40px}

        /* Бонус за скорость */
        .speed-bonus{position:fixed;pointer-events:none;z-index:3000;font-size:1.2rem;font-weight:900;color:#f7b42c;text-shadow:0 2px 8px rgba(0,0,0,.5);animation:floatUpBonus 1.2s ease-out forwards}
        @keyframes floatUpBonus{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-50px) scale(1.3)}}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
        .pulse{animation:pulse 2s infinite ease-in-out}
        @media(max-width:768px){.game-grid{grid-template-columns:repeat(auto-fill,minmax(75px,1fr));gap:8px;padding:10px}.tile .main-char{font-size:28px}.learn-card{padding:10px}.hw-box{width:180px;height:180px}}
    </style>
</head>
<body>
<div class="game-container">
    <div class="nav-buttons"><a href="index.html" class="back-btn">◀ На главную</a><div></div></div>
    <h1>🀄️ МАДЖОНГ | ВСЕ РАДИКАЛЫ</h1>
    <div class="sub">🔗 Соедини радикал со словом, в котором он есть</div>
    <div class="level-bar-wrapper"><div class="level-bar" id="levelBar">
        <div class="level-btn" data-level="1">🌱 6</div><div class="level-btn" data-level="2">⭐ 10</div><div class="level-btn active" data-level="3">🏆 15</div><div class="level-btn" data-level="4">🔥 20</div><div class="level-btn" data-level="5">💪 25</div><div class="level-btn" data-level="6">🎯 30</div><div class="level-btn" data-level="7">👑 40</div><div class="level-btn" data-level="8">🏅 50</div><div class="level-btn" data-level="9">🏆 60</div>
    </div></div>
    <div class="stats-bar">
        <span>🎯 <span id="scoreValue">0</span></span>
        <span>🧩 <span id="remainValue">0</span></span>
        <span>🔥 <span id="streakValue">0</span></span>
        <span>⏱️ <span id="timerValue">0:00</span></span>
        <span>🏆 <span id="recordValue">0</span></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="game-grid" id="gameGrid"></div>
    <div class="message-area" id="gameMessage">🌟 Нажми на радикал, затем на слово с ним</div>
    <div class="ctrl-buttons">
        <button id="hintBtn" class="hint-btn">💡 Подсказка</button>
        <button id="shuffleBtn" class="shuffle-btn">🔄 Перемешать</button>
        <button id="resetGameBtn" class="reset-btn">🆕 Новая игра</button>
    </div>
</div>

<script>
    const NOTEBOOK_CONFIG = {
        canvasSize: 420, gridPadding: 28, defaultBrushWidth: 14,
        minBrushWidth: 4, maxBrushWidth: 30, exampleOpacity: 0.45,
        gridColor: '#b8956a', gridColorCenter: '#d4b896',
        strokeColor: '#1a0f0a', exampleColor: '#9b59b6',
        checkThreshold: 0.40, checkGoodThreshold: 0.25
    };
    const LEVEL_CONFIG = {
        1:{pairsCount:6},2:{pairsCount:10},3:{pairsCount:15},4:{pairsCount:20},
        5:{pairsCount:25},6:{pairsCount:30},7:{pairsCount:40},8:{pairsCount:50},9:{pairsCount:60}
    };

    let RADICALS_DB=[],currentLevel=3,tiles=[],selectedId=null;
    let matchedCount=0,totalPairs=0,score=0,streak=0,record=0;
    let currentModal=null,chineseVoice=null;
    let gameStartTime=0,timerInterval=null,lastMatchTime=0;
    let currentBrushWidth=NOTEBOOK_CONFIG.defaultBrushWidth;
    let hwWriterInstance=null;

    const scoreSpan=document.getElementById('scoreValue'),remainSpan=document.getElementById('remainValue');
    const streakSpan=document.getElementById('streakValue'),recordSpan=document.getElementById('recordValue');
    const timerSpan=document.getElementById('timerValue');
    const progressFill=document.getElementById('progressFill'),msgEl=document.getElementById('gameMessage');
    const gridEl=document.getElementById('gameGrid');

    function loadChineseVoice(){if(!window.speechSynthesis)return;const voices=speechSynthesis.getVoices();chineseVoice=voices.find(v=>v.lang.startsWith("zh"))||null}
    if(window.speechSynthesis){speechSynthesis.onvoiceschanged=loadChineseVoice;setTimeout(loadChineseVoice,100)}
    function speakChinese(text){if(!window.speechSynthesis||!text)return;if(["丶","丨","丿","乛","⺄","⺀","⺁","⺂"].includes(text))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="zh-CN";u.rate=0.8;if(chineseVoice)u.voice=chineseVoice;speechSynthesis.speak(u)}

    function startTimer(){gameStartTime=Date.now();lastMatchTime=Date.now();if(timerInterval)clearInterval(timerInterval);timerInterval=setInterval(()=>{const elapsed=Math.floor((Date.now()-gameStartTime)/1000);const m=Math.floor(elapsed/60),s=elapsed%60;if(timerSpan)timerSpan.textContent=`<LaTex>id_8</LaTex>{s.toString().padStart(2,'0')}`},1000)}
    function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null}}

    function calcSpeedBonus(){const now=Date.now();const diff=(now-lastMatchTime)/1000;lastMatchTime=now;let bonus=0,label='';if(diff<2){bonus=15;label='⚡+15'}else if(diff<4){bonus=10;label='🔥+10'}else if(diff<7){bonus=5;label='👍+5'}return{bonus,label}}

    function showFloatingBonus(text,x,y){if(!text)return;const el=document.createElement('div');el.className='speed-bonus';el.textContent=text;el.style.left=x+'px';el.style.top=y+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),1300)}

    function findWordsWithRadical(radicalChar,limit=5){
        if(typeof WORDS==='undefined'||!Array.isArray(WORDS))return[];
        const RADICAL_INDEX={"氵":["河","海","江","洗","游","湖","湿","满","深","法","泪","油","温","渴"],"扌":["打","找","拉","推","拿","提","接","拍","搬","换","扫","按","招","抓"],"艹":["花","草","茶","药","菜","蓝","苹","莓","莲","菊","芳","芽","苗","范"],"钅":["钱","银","铁","铜","钢","针","钟","镜","锁","锅","钻","锋","锐","链"],"讠":["说","话","请","认","记","试","讲","谢","词","语","谈","诉","误","调"],"忄":["怕","忙","快","慢","懂","惊","慌","忆","情","惊","愉","悦","恨","悔"],"辶":["过","还","远","近","进","退","追","逃","达","送","遇","边","遍","连"],"饣":["饭","饱","饿","饮","饺","饼","馆","饰","饿","饨","馄","饲","饵","饥"],"衤":["衫","裤","袜","被","初","补","裙","袄","袋","装","裁","裂","袭","衬"],"礻":["礼","社","神","福","祖","祝","祈","祷","祥","视","禅","禄","祸","禁"],"犭":["猫","狗","狼","狐","猴","狮","猎","独","狭","猛","狂","狡","猩","猬"],"⺮":["笔","笑","篮","等","箱","算","管","箭","符","简","笨","笛","筝","策"],"阝":["阳","阴","队","阿","陈","陆","院","阵","阶","限","隔","防","险","陵"],"攵":["放","收","教","改","政","故","效","敌","敬","敏","救","散","整","数"],"灬":["热","煮","焦","照","黑","烈","点","熟","熊","然","蒸","煎","熬","煦"],"疒":["病","疼","痛","疗","疫","疯","疤","疾","症","瘦","疲","痒","疮","痊"],"罒":["罪","罗","罚","网","罩","置","署","羁","罢","罹","罕","罔","罪","罚"],"廾":["弄","异","开","弊","式","弄","弈","弊","弄","弄","弄","弄","弄","弄"],"夂":["冬","处","备","复","夏","各","名","处","夏","复","备","冬","处","各"],"冫":["冰","冷","冻","凉","次","决","冲","减","准","凝","凛","冽","凄","凋"]};
        const results=[],seen=new Set();
        if(RADICAL_INDEX[radicalChar]){for(let trigger of RADICAL_INDEX[radicalChar]){if(results.length>=limit)break;const match=WORDS.find(w=>w.c===trigger&&!seen.has(w.c));if(match){seen.add(match.c);results.push({char:match.c,pinyin:match.p||'',meaning:match.m||''})}}}
        if(results.length<limit){for(let w of WORDS){if(results.length>=limit)break;if(!w.c||w.c===radicalChar||seen.has(w.c))continue;if(w.c.includes(radicalChar)){seen.add(w.c);results.push({char:w.c,pinyin:w.p||'',meaning:w.m||''})}}}
        return results;
    }

    // ===== HANZI WRITER =====
    function initHanziWriter(container,char){
        container.innerHTML='';
        if(hwWriterInstance){try{hwWriterInstance._renderer.dispose()}catch(e){}hwWriterInstance=null}
        try{
            hwWriterInstance=HanziWriter.create(container,char,{
                width:container.clientWidth||220,height:container.clientHeight||220,
                padding:15,showOutline:true,strokeAnimationSpeed:1,delayBetweenStrokes:400,
                showCharacter:false,highlightColor:'#c0392b',outlineColor:'#d4b896',
                drawingColor:'#1a0f0a',radicalColor:'#c0392b'
            });
            setTimeout(()=>{if(hwWriterInstance)hwWriterInstance.animateCharacter()},300);
        }catch(e){
            container.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100%;font-family:'Ma Shan Zheng';font-size:80px;color:#c0392b"><LaTex>id_7</LaTex>{radical.key}</div>
                <div class="radical-info">
                    <div class="radical-name"><LaTex>id_6</LaTex>{radical.keyPinyin||'?'}</div>
                    <div class="radical-mean"><LaTex>id_5</LaTex>{radical.strokes||'?'} черт</div>
                </div>
            </div>
            <div class="writer-section">
                <div class="hw-box" id="hwContainer"></div>
                <div class="writer-toolbar">
                    <button id="replayAnimBtn" style="background:linear-gradient(135deg,#e67e22,#d35400);color:#fff">▶ Анимация</button>
                    <button id="quizModeBtn" style="background:linear-gradient(135deg,#2980b9,#3498db);color:#fff">✍️ Проверка черт</button>
                    <button id="brushToggleBtn" style="background:linear-gradient(135deg,#8e44ad,#6c3483);color:#fff">🖌️ Кисть</button>
                </div>
                <div class="brush-controls" id="brushControls" style="display:none">
                    <div class="brush-slider-wrapper">
                        <label>Толщина:</label>
                        <input type="range" id="brushSlider" min="<LaTex>id_4</LaTex>{NOTEBOOK_CONFIG.maxBrushWidth}" value="<LaTex>id_3</LaTex>{currentBrushWidth}px;height:<LaTex>id_2</LaTex>{wordsWithRadical.length>0?`<div class="examples-row">${wordsWithRadical.map(w=>`<div class="example-word" data-char="${w.char}"><div class="ex-char"><LaTex>id_1</LaTex>{w.pinyin}</div><div class="ex-mean">${w.meaning}</div></div>`).join('')}</div>`:''}
            <div class="notebook-actions">
                <button class="notebook-btn" id="nbAdd">📓 В тетрадь</button>
                <button class="close-learn" id="nbClose">✖ Закрыть</button>
            </div>
        </div>`;

        document.body.appendChild(modal);currentModal=modal;

        // Hanzi Writer
        const hwContainer=modal.querySelector('#hwContainer');
        initHanziWriter(hwContainer,radical.key);

        let quizActive=false;
        const replayBtn=modal.querySelector('#replayAnimBtn');
        const quizBtn=modal.querySelector('#quizModeBtn');
        const brushToggleBtn=modal.querySelector('#brushToggleBtn');
        const brushControls=modal.querySelector('#brushControls');

        replayBtn.onclick=()=>{
            if(hwWriter
