<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🀄️ МАДЖОНГ | ВСЕ РАДИКАЛЫ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js"></script>
    <script src="WORDS.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
        body{background:linear-gradient(145deg,#1a3a2a,#0a1a0f);min-height:100vh;font-family:system-ui,'PingFang SC','Noto Sans CJK SC',sans-serif;padding:12px}
        .game-container{max-width:1200px;margin:0 auto;background:rgba(30,25,20,.65);border-radius:36px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
        h1{text-align:center;font-size:clamp(1.2rem,4vw,1.6rem);color:#f7e05e;margin-bottom:4px}
        .sub{text-align:center;color:#d4c9a6;margin-bottom:12px;font-size:.75rem}
        .level-bar-wrapper{overflow-x:auto;white-space:nowrap;margin-bottom:12px;padding-bottom:8px;scrollbar-width:none}
        .level-bar-wrapper::-webkit-scrollbar{display:none}
        .level-bar{display:inline-flex;gap:8px;padding:0 4px}
        .level-btn{background:#4a3729;color:#d4c9a6;padding:6px 14px;border-radius:40px;cursor:pointer;font-weight:bold;font-size:.75rem;white-space:nowrap;transition:.15s}
        .level-btn.active{background:linear-gradient(135deg,#f7b42c,#fc8e2c);color:#2c1a0c;box-shadow:0 4px 0 #b36b0f}
        .stats-bar{display:flex;justify-content:space-between;background:#2c2118;padding:8px 12px;border-radius:60px;margin-bottom:12px;color:#ffecb3;font-weight:bold;font-size:.8rem;flex-wrap:wrap;gap:8px}
        .stats-bar span{background:#00000044;padding:4px 12px;border-radius:40px}
        
        /* ===== КРУПНЫЕ ПЛИТКИ ===== */
        .game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px;background:#3c2a1f;padding:20px;border-radius:28px;margin:12px 0;min-height:300px;max-height:75vh;overflow-y:auto}
        .game-grid::-webkit-scrollbar{width:8px}
        .game-grid::-webkit-scrollbar-thumb{background:#8b6946;border-radius:4px}
        .tile{background:#fff8e7;background-image:radial-gradient(circle at 25% 35%,rgba(255,245,200,.6) 2%,transparent 2.5%);background-size:22px 22px;border-radius:20px;text-align:center;cursor:pointer;transition:all .12s;border:3px solid #c8aa6e;box-shadow:0 6px 0 #8b6946;padding:16px 10px;aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:120px}
        .tile:active{transform:scale(.97)}
        .tile.selected{background:#ffe6b3;border-color:#f5b042;box-shadow:0 3px 0 #8b6946,0 0 0 4px rgba(245,176,66,.4);transform:scale(.98)}
        .tile.removed{display:none}
        .tile .main-char{font-size:clamp(42px,10vw,60px);font-weight:800;color:#3c2a1f;line-height:1}
        .tile .pinyin{font-size:13px;color:#b34e1a;margin-top:8px;font-weight:500}
        .tile .info{font-size:12px;margin-top:5px;color:#6a5a4a;background:#f3e5c9;display:inline-block;padding:3px 12px;border-radius:20px;max-width:95%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        
        .message-area{background:#261d14e6;border-radius:60px;padding:10px 16px;text-align:center;font-weight:bold;font-size:.85rem;margin:10px 0;color:#f7e6c4;min-height:40px;display:flex;align-items:center;justify-content:center}
        .ctrl-buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px}
        button{background:linear-gradient(135deg,#f7b42c,#fc8e2c);border:none;padding:9px 18px;font-size:.8rem;font-weight:bold;border-radius:50px;color:#2c1a0c;cursor:pointer;box-shadow:0 3px 0 #9b5e1c;transition:.08s}
        button:active{transform:translateY(2px);box-shadow:0 1px 0 #9b5e1c}
        .reset-btn{background:linear-gradient(135deg,#4b6a3b,#2d5a2a);color:#f9e7b3}
        .hint-btn{background:linear-gradient(135deg,#3a6b8a,#2a4a6a);color:#fff}
        .shuffle-btn{background:linear-gradient(135deg,#8e44ad,#6c3483);color:#fff}
        .progress-bar{background:#4a3729;border-radius:30px;height:6px;margin:8px 0;overflow:hidden}
        .progress-fill{background:linear-gradient(90deg,#f7b42c,#f5a623);width:0%;height:100%;transition:width .4s cubic-bezier(.4,0,.2,1)}

        /* ===== КОМПАКТНАЯ МОДАЛКА ===== */
        .learn-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:2000;padding:6px}
        .learn-card{background:linear-gradient(145deg,#fffaf0,#f8f0e0);border-radius:24px;padding:10px 12px;max-width:440px;width:100%;text-align:center;border:2px solid #f7b42c;max-height:98vh;display:flex;flex-direction:column;gap:6px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
        .radical-header{display:flex;align-items:center;gap:10px;justify-content:center}
        .radical-big{font-family:'Ma Shan Zheng',cursive;font-size:clamp(44px,10vw,56px);font-weight:400;color:#c0392b;background:linear-gradient(135deg,#fff0d0,#ffe8c0);display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:14px;cursor:pointer;border:2px dashed #f7b42c;flex-shrink:0;line-height:1}
        .radical-info{text-align:left;min-width:0}
        .radical-name{font-size:15px;font-weight:bold;color:#2c1a0c;line-height:1.2}
        .radical-pinyin{font-size:13px;color:#8e44ad;font-weight:500}
        .radical-mean{font-size:10px;color:#6b5a4a}
        .writer-section{background:linear-gradient(135deg,#fdf6ee,#f5ead8);border-radius:14px;padding:8px;border:2px solid #d4b896;display:flex;align-items:center;gap:8px}
        .hw-box{width:120px;height:120px;background:#fffef9;border-radius:10px;border:2px solid #c8aa6e;box-shadow:inset 0 2px 6px rgba(0,0,0,.08);flex-shrink:0;position:relative;overflow:hidden}
        .hw-box svg{width:100%!important;height:100%!important;display:block}
        .writer-controls{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
        .writer-controls button{font-size:.65rem;padding:5px 8px;width:100%}
        .stroke-label{font-size:.7rem;color:#6b5a4a;font-weight:600;text-align:center}
        .draw-section{background:linear-gradient(135deg,#f5e6d3,#e8d5c0);border-radius:14px;padding:8px;border:2px solid #d4b896;display:flex;flex-direction:column;align-items:center;gap:4px}
        .draw-canvas-container{position:relative;background:#fffef9;border-radius:14px;padding:4px;border:2px solid #c8aa6e;display:inline-block;box-shadow:inset 0 2px 8px rgba(0,0,0,.08)}
        .draw-canvas{display:block;margin:0 auto;cursor:crosshair;background:transparent;touch-action:none}
        .brush-controls{display:flex;align-items:center;gap:6px;width:100%}
        .brush-slider-wrapper{display:flex;align-items:center;gap:6px;background:#2c2118;padding:4px 10px;border-radius:40px;flex:1}
        .brush-slider-wrapper label{font-size:.7rem;color:#f7e05e;font-weight:bold;white-space:nowrap}
        .brush-slider-wrapper input[type="range"]{flex:1;accent-color:#f7b42c;cursor:pointer;height:16px}
        .brush-preview{width:20px;height:20px;border-radius:50%;background:#1a0f0a;transition:all .15s;flex-shrink:0}
        .draw-tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
        .draw-tools button{padding:5px 12px;font-size:.7rem}
        .draw-tools .clear-draw{background:linear-gradient(135deg,#c0392b,#e74c3c)}
        .draw-tools .trace-btn{background:linear-gradient(135deg,#2980b9,#3498db)}
        .quality-bar{background:#2c2118;height:6px;border-radius:6px;width:100%;max-width:260px;overflow:hidden}
        .quality-fill{height:100%;background:linear-gradient(90deg,#e74c3c,#f39c12,#2ecc71);width:0%;transition:width .5s ease;border-radius:6px}
        .quality-text{font-size:.7rem;color:#d4c9a6;font-weight:500}
        .examples-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0;width:100%}
        .examples-row::-webkit-scrollbar{display:none}
        .example-word{background:linear-gradient(135deg,#3c2a1f,#2a1a0f);border-radius:12px;padding:6px 10px;text-align:center;cursor:pointer;transition:.1s;min-width:70px;flex-shrink:0;border:1px solid #5a4a3a}
        .example-word:active{transform:scale(.97)}
        .example-word .ex-char{font-size:22px;font-weight:bold;color:#f7e05e;line-height:1}
        .example-word .ex-pinyin{font-size:9px;color:#ffd966;margin-top:1px}
        .example-word .ex-mean{font-size:8px;color:#d4c9a6}
        .notebook-actions{display:flex;gap:8px;justify-content:center}
        .close-learn{background:linear-gradient(135deg,#f7b42c,#fc8e2c);border:none;padding:8px 22px;font-size:.8rem;font-weight:bold;border-radius:50px;cursor:pointer}
        .notebook-btn{background:linear-gradient(135deg,#2ecc71,#27ae60);border:none;padding:8px 18px;font-size:.75rem;font-weight:bold;border-radius:50px;cursor:pointer;color:#fff}
        .nav-buttons{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
        .back-btn{background:linear-gradient(135deg,#5a4a3a,#3a2a1a);color:#f7e05e;padding:8px 16px;font-size:.8rem;text-decoration:none;display:inline-flex;align-items:center;gap:6px;border-radius:40px}
        .speed-bonus{position:fixed;pointer-events:none;z-index:3000;font-size:1.4rem;font-weight:900;color:#f7b42c;text-shadow:0 2px 8px rgba(0,0,0,.5);animation:floatUpBonus 1.2s ease-out forwards}
        @keyframes floatUpBonus{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(1.3)}}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
        .pulse{animation:pulse 2s infinite ease-in-out}
        @media(max-width:768px){
            .game-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px;padding:14px}
            .tile{min-height:100px;padding:12px 8px}
            .tile .main-char{font-size:clamp(36px,9vw,48px)}
            .learn-card{padding:8px 10px}
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="nav-buttons"><a href="index.html" class="back-btn">◀ На главную</a><div></div></div>
    <h1>🀄️ МАДЖОНГ | ВСЕ РАДИКАЛЫ</h1>
    <div class="sub">🔗 Соедини радикал со словом, в котором он есть</div>
    <div class="level-bar-wrapper"><div class="level-bar" id="levelBar">
        <div class="level-btn" data-level="1">🌱 6 пар</div><div class="level-btn" data-level="2">⭐ 10 пар</div><div class="level-btn active" data-level="3">🏆 15 пар</div><div class="level-btn" data-level="4">🔥 20 пар</div><div class="level-btn" data-level="5">💪 25 пар</div><div class="level-btn" data-level="6">🎯 30 пар</div><div class="level-btn" data-level="7">👑 40 пар</div><div class="level-btn" data-level="8">🏅 50 пар</div><div class="level-btn" data-level="9">🏆 60 пар</div>
    </div></div>
    <div class="stats-bar">
        <span>🎯 <span id="scoreValue">0</span></span>
        <span>🧩 <span id="remainValue">0</span></span>
        <span>🔥 <span id="streakValue">0</span></span>
        <span>⏱️ <span id="timerValue">0:00</span></span>
        <span>🏆 <span id="recordValue">0</span></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="game-grid" id="gameGrid"></div>
    <div class="message-area" id="gameMessage">🌟 Нажми на радикал, затем на слово с ним</div>
    <div class="ctrl-buttons">
        <button id="hintBtn" class="hint-btn">💡 Подсказка</button>
        <button id="shuffleBtn" class="shuffle-btn">🔄 Перемешать</button>
        <button id="resetGameBtn" class="reset-btn">🆕 Новая игра</button>
    </div>
</div>

<script>
    const NOTEBOOK_CONFIG={canvasSize:420,gridPadding:28,defaultBrushWidth:14,minBrushWidth:4,maxBrushWidth:30,exampleOpacity:0.45,gridColor:'#b8956a',gridColorCenter:'#d4b896',strokeColor:'#1a0f0a',exampleColor:'#9b59b6',checkThreshold:0.40,checkGoodThreshold:0.25};
    const LEVEL_CONFIG={1:{pairsCount:6},2:{pairsCount:10},3:{pairsCount:15},4:{pairsCount:20},5:{pairsCount:25},6:{pairsCount:30},7:{pairsCount:40},8:{pairsCount:50},9:{pairsCount:60}};

    let RADICALS_DB=[],currentLevel=3,tiles=[],selectedId=null;
    let matchedCount=0,totalPairs=0,score=0,streak=0,record=0;
    let currentModal=null,chineseVoice=null;
    let gameStartTime=0,timerInterval=null,lastMatchTime=0;
    let currentBrushWidth=NOTEBOOK_CONFIG.defaultBrushWidth;
    let hwWriterInstance=null;

    const scoreSpan=document.getElementById('scoreValue'),remainSpan=document.getElementById('remainValue');
    const streakSpan=document.getElementById('streakValue'),recordSpan=document.getElementById('recordValue');
    const timerSpan=document.getElementById('timerValue');
    const progressFill=document.getElementById('progressFill'),msgEl=document.getElementById('gameMessage');
    const gridEl=document.getElementById('gameGrid');

    function loadChineseVoice(){if(!window.speechSynthesis)return;const voices=speechSynthesis.getVoices();chineseVoice=voices.find(v=>v.lang.startsWith("zh"))||null}
    if(window.speechSynthesis){speechSynthesis.onvoiceschanged=loadChineseVoice;setTimeout(loadChineseVoice,100)}
    function speakChinese(text){if(!window.speechSynthesis||!text)return;if(["丶","丨","丿","乛","⺄","⺀","⺁","⺂"].includes(text))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="zh-CN";u.rate=0.8;if(chineseVoice)u.voice=chineseVoice;speechSynthesis.speak(u)}

    function startTimer(){gameStartTime=Date.now();lastMatchTime=Date.now();if(timerInterval)clearInterval(timerInterval);timerInterval=setInterval(()=>{const e=Math.floor((Date.now()-gameStartTime)/1000);const m=Math.floor(e/60),s=e%60;if(timerSpan)timerSpan.textContent=`${m}:${s.toString().padStart(2,'0')}`},1000)}
    function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null}}
    function calcSpeedBonus(){const now=Date.now(),diff=(now-lastMatchTime)/1000;lastMatchTime=now;let bonus=0,label='';if(diff<2){bonus=15;label='⚡+15'}else if(diff<4){bonus=10;label='🔥+10'}else if(diff<7){bonus=5;label='👍+5'}return{bonus,label}}
    function showFloatingBonus(text,x,y){if(!text)return;const el=document.createElement('div');el.className='speed-bonus';el.textContent=text;el.style.left=x+'px';el.style.top=y+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),1300)}

    function findWordsWithRadical(radicalChar,limit=5){
        if(typeof WORDS==='undefined'||!Array.isArray(WORDS))return[];
        const RADICAL_INDEX={"氵":["河","海","江","洗","游","湖","湿","满","深","法","泪","油","温","渴"],"扌":["打","找","拉","推","拿","提","接","拍","搬","换","扫","按","招","抓"],"艹":["花","草","茶","药","菜","蓝","苹","莓","莲","菊","芳","芽","苗","范"],"钅":["钱","银","铁","铜","钢","针","钟","镜","锁","锅","钻","锋","锐","链"],"讠":["说","话","请","认","记","试","讲","谢","词","语","谈","诉","误","调"],"忄":["怕","忙","快","慢","懂","惊","慌","忆","情","惊","愉","悦","恨","悔"],"辶":["过","还","远","近","进","退","追","逃","达","送","遇","边","遍","连"],"饣":["饭","饱","饿","饮","饺","饼","馆","饰","饿","饨","馄","饲","饵","饥"],"衤":["衫","裤","袜","被","初","补","裙","袄","袋","装","裁","裂","袭","衬"],"礻":["礼","社","神","福","祖","祝","祈","祷","祥","视","禅","禄","祸","禁"],"犭":["猫","狗","狼","狐","猴","狮","猎","独","狭","猛","狂","狡","猩","猬"],"⺮":["笔","笑","篮","等","箱","算","管","箭","符","简","笨","笛","筝","策"],"阝":["阳","阴","队","阿","陈","陆","院","阵","阶","限","隔","防","险","陵"],"攵":["放","收","教","改","政","故","效","敌","敬","敏","救","散","整","数"],"灬":["热","煮","焦","照","黑","烈","点","熟","熊","然","蒸","煎","熬","煦"],"疒":["病","疼","痛","疗","疫","疯","疤","疾","症","瘦","疲","痒","疮","痊"],"罒":["罪","罗","罚","网","罩","置","署","羁","罢","罹","罕","罔","罪","罚"],"廾":["弄","异","开","弊","式","弄","弈","弊","弄","弄","弄","弄","弄","弄"],"夂":["冬","处","备","复","夏","各","名","处","夏","复","备","冬","处","各"],"冫":["冰","冷","冻","凉","次","决","冲","减","准","凝","凛","冽","凄","凋"]};
        const results=[],seen=new Set();
        if(RADICAL_INDEX[radicalChar]){for(let trigger of RADICAL_INDEX[radicalChar]){if(results.length>=limit)break;const match=WORDS.find(w=>w.c===trigger&&!seen.has(w.c));if(match){seen.add(match.c);results.push({char:match.c,pinyin:match.p||'',meaning:match.m||''})}}}
        if(results.length<limit){for(let w of WORDS){if(results.length>=limit)break;if(!w.c||w.c===radicalChar||seen.has(w.c))continue;if(w.c.includes(radicalChar)){seen.add(w.c);results.push({char:w.c,pinyin:w.p||'',meaning:w.m||''})}}}
        return results;
    }

    function drawMiziGeGrid(ctx,size,padding){
        const inner=size-padding*2,center=size/2;
        ctx.lineWidth=2.5;ctx.strokeStyle=NOTEBOOK_CONFIG.gridColor;ctx.strokeRect(padding,padding,inner,inner);
        ctx.setLineDash([8,5]);ctx.lineWidth=1.3;ctx.strokeStyle=NOTEBOOK_CONFIG.gridColorCenter;
        ctx.beginPath();ctx.moveTo(center,padding);ctx.lineTo(center,size-padding);ctx.stroke();
        ctx.beginPath();ctx.moveTo(padding,center);ctx.lineTo(size-padding,center);ctx.stroke();
        ctx.setLineDash([4,4]);ctx.lineWidth=0.9;ctx.strokeStyle=NOTEBOOK_CONFIG.gridColor;
        ctx.beginPath();ctx.moveTo(padding,padding);ctx.lineTo(size-padding,size-padding);ctx.stroke();
        ctx.beginPath();ctx.moveTo(size-padding,padding);ctx.lineTo(padding,size-padding);ctx.stroke();
        ctx.setLineDash([]);
    }

    function initNotebookCanvas(canvas){
        const s=NOTEBOOK_CONFIG.canvasSize;canvas.width=canvas.height=s;
        canvas.style.cssText=`width:100%;max-width:${s}px;aspect-ratio:1/1;display:block;touch-action:none`;
        const ctx=canvas.getContext('2d',{willReadFrequently:true});
        ctx.fillStyle='#fffef9';ctx.fillRect(0,0,s,s);drawMiziGeGrid(ctx,s,NOTEBOOK_CONFIG.gridPadding);
        return ctx;
    }

    function showExampleOnCanvas(canvas,char){
        const ctx=canvas.getContext('2d'),s=NOTEBOOK_CONFIG.canvasSize,inner=s-NOTEBOOK_CONFIG.gridPadding*2;
        const drawText=()=>{
            ctx.fillStyle='#fffef9';ctx.fillRect(0,0,s,s);drawMiziGeGrid(ctx,s,NOTEBOOK_CONFIG.gridPadding);
            ctx.save();ctx.globalAlpha=NOTEBOOK_CONFIG.exampleOpacity;ctx.fillStyle=NOTEBOOK_CONFIG.exampleColor;
            ctx.font=`400 ${Math.floor(inner*0.95)}px "Ma Shan Zheng","STKaiti",serif`;
            ctx.textAlign='center';ctx.textBaseline='middle';
            ctx.fillText(char,s/2,s/2+(inner*0.03));ctx.restore();
            ctx.lineWidth=currentBrushWidth;ctx.lineCap='round';ctx.lineJoin='round';ctx.globalAlpha=1;
            canvas._refData=ctx.getImageData(0,0,s,s);
        };
        if(document.fonts&&document.fonts.ready){document.fonts.ready.then(()=>{document.fonts.load(`400 48px "Ma Shan Zheng"`).then(drawText).catch(drawText)})}else{setTimeout(drawText,500)}
    }

    function clearNotebookCanvas(canvas){
        const ctx=canvas.getContext('2d'),s=NOTEBOOK_CONFIG.canvasSize;
        ctx.fillStyle='#fffef9';ctx.fillRect(0,0,s,s);drawMiziGeGrid(ctx,s,NOTEBOOK_CONFIG.gridPadding);
        delete canvas._refData;canvas._drawn=false;
    }

    function checkQuality(canvas){
        if(!canvas._refData)return{score:0,msg:'Сначала покажи образец',color:'#95a5a6'};
        const ctx=canvas.getContext('2d'),s=NOTEBOOK_CONFIG.canvasSize,current=ctx.getImageData(0,0,s,s);
        const dRef=canvas._refData.data,dCur=current.data;let match=0,totalRef=0,userOutside=0;const threshold=235;
        for(let i=0;i<dRef.length;i+=4){const isRef=(dRef[i]<threshold||dRef[i+1]<threshold||dRef[i+2]<threshold);const isUser=(dCur[i]<threshold||dCur[i+1]<threshold||dCur[i+2]<threshold);if(isRef){totalRef++;if(isUser)match++}else if(isUser){userOutside++}}
        if(totalRef===0)return{score:0,msg:'Нет эталона',color:'#95a5a6'};
        const precision=match/totalRef,recall=totalRef>0?match/(totalRef+userOutside):0,f1=2*(precision*recall)/(precision+recall+0.001),pct=Math.round(f1*100);
        if(f1>NOTEBOOK_CONFIG.checkThreshold)return{score:pct,msg:'🌟 Отлично!',color:'#2ecc71'};
        if(f1>NOTEBOOK_CONFIG.checkGoodThreshold)return{score:pct,msg:'👍 Хорошо!',color:'#f39c12'};
        return{score:pct,msg:'📝 Тренируйся ещё',color:'#e67e22'};
    }

    function setupCalligraphyBrush(canvas){
        const ctx=canvas.getContext('2d');
        let drawing=false,lastX,lastY,lastWidth,lastTime,strokeLen=0;
        function getPos(e){const rect=canvas.getBoundingClientRect();return{x:(e.clientX-rect.left)*canvas.width/rect.width,y:(e.clientY-rect.top)*canvas.height/rect.height,pressure:Math.max(0.1,e.pressure||0.5)}}
        function start(e){e.preventDefault();drawing=true;canvas._drawn=true;strokeLen=0;const p=getPos(e);lastX=p.x;lastY=p.y;lastTime=performance.now();lastWidth=currentBrushWidth*0.8;ctx.fillStyle=NOTEBOOK_CONFIG.strokeColor;ctx.shadowBlur=1.5;ctx.shadowColor=NOTEBOOK_CONFIG.strokeColor;ctx.beginPath();ctx.arc(p.x,p.y,lastWidth/2,0,Math.PI*2);ctx.fill()}
        function draw(e){if(!drawing)return;e.preventDefault();const p=getPos(e),now=performance.now(),dt=Math.max(1,now-lastTime);const dx=p.x-lastX,dy=p.y-lastY,dist=Math.hypot(dx,dy),speed=dist/dt;strokeLen+=dist;const base=currentBrushWidth;const pF=0.3+p.pressure*0.7;const sF=Math.max(0.15,1-(speed/1.2));let targetW=base*pF*sF;if(strokeLen<22)targetW*=(0.65+0.35*(strokeLen/22));targetW=Math.max(2.5,Math.min(base*1.8,targetW));const newW=lastWidth*0.7+targetW*0.3;ctx.save();ctx.fillStyle=NOTEBOOK_CONFIG.strokeColor;ctx.shadowBlur=0.6;ctx.shadowColor=NOTEBOOK_CONFIG.strokeColor;const steps=Math.max(1,Math.floor(dist/2));for(let i=1;i<=steps;i++){const t=i/steps,ix=lastX+dx*t,iy=lastY+dy*t,iw=lastWidth+(newW-lastWidth)*t;ctx.beginPath();ctx.arc(ix,iy,iw/2,0,Math.PI*2);ctx.fill()}ctx.restore();lastX=p.x;lastY=p.y;lastWidth=newW;lastTime=now}
        function stop(){if(!drawing)return;drawing=false;const angle=Math.atan2(lastY-(lastY-1),lastX-(lastX-1))||0,taperLen=8;ctx.save();ctx.fillStyle=NOTEBOOK_CONFIG.strokeColor;ctx.shadowBlur=0;for(let i=1;i<=taperLen;i++){const t=i/taperLen,tw=lastWidth*Math.pow(1-t,1.5);ctx.beginPath();ctx.ellipse(lastX+Math.cos(angle)*t*4,lastY+Math.sin(angle)*t*4,tw/2,tw/3,angle,0,Math.PI*2);ctx.fill()}ctx.restore()}
        canvas.addEventListener('pointerdown',start);canvas.addEventListener('pointermove',draw);canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointerleave',stop);canvas.addEventListener('pointercancel',stop);
    }

    function initHanziWriter(container,char){
        container.innerHTML='';if(hwWriterInstance)hwWriterInstance=null;
        try{
            hwWriterInstance=HanziWriter.create(container,char,{width:container.clientWidth||120,height:container.clientHeight||120,padding:10,showOutline:true,strokeAnimationSpeed:1,delayBetweenStrokes:400,showCharacter:false,highlightColor:'#c0392b',outlineColor:'#d4b896',drawingColor:'#1a0f0a'});
            setTimeout(()=>{if(hwWriterInstance)hwWriterInstance.animateCharacter()},300);
        }catch(e){container.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100%;font-family:'Ma Shan Zheng';font-size:60px;color:#c0392b">${char}</div>`}
    }

    function showLearnModal(radical){
        if(currentModal){currentModal.remove();currentModal=null}if(!radical)return;
        const words=findWordsWithRadical(radical.key,3);
        const modal=document.createElement('div');modal.className='learn-modal';
        modal.innerHTML=`<div class="learn-card">
            <div class="radical-header">
                <div class="radical-big pulse">${radical.key}</div>
                <div class="radical-info"><div class="radical-name">${radical.keyName}</div><div class="radical-pinyin">${radical.keyPinyin||'?'}</div><div class="radical-mean">${radical.keyMeaning||'радикал'} · ${radical.strokes||'?'} черт</div></div>
            </div>
            <div class="writer-section">
                <div class="hw-box" id="hwContainer"></div>
                <div class="writer-controls">
                    <div class="stroke-label">Порядок черт</div>
                    <button id="replayAnimBtn" style="background:linear-gradient(135deg,#e67e22,#d35400);color:#fff">▶ Анимация</button>
                    <button id="nbShow" style="background:linear-gradient(135deg,#2980b9,#3498db);color:#fff">👁️ Образец</button>
                    <button id="nbHide" style="display:none;background:linear-gradient(135deg,#2980b9,#3498db);color:#fff">🙈 Скрыть</button>
                </div>
            </div>
            <div class="draw-section">
                <div class="brush-controls"><div class="brush-slider-wrapper"><label>🖌️</label><input type="range" id="brushSlider" min="${NOTEBOOK_CONFIG.minBrushWidth}" max="${NOTEBOOK_CONFIG.maxBrushWidth}" value="${currentBrushWidth}" step="1"><div class="brush-preview" id="brushPreview" style="width:${currentBrushWidth}px;height:${currentBrushWidth}px"></div></div></div>
                <div class="draw-canvas-container"><canvas class="draw-canvas" id="nbCanvas"></canvas></div>
                <div class="quality-bar"><div class="quality-fill" id="qFill"></div></div>
                <div class="quality-text" id="qText">Нарисуй что-нибудь</div>
                <div class="draw-tools"><button class="clear-draw" id="nbClear">🧽 Очистить</button><button class="trace-btn" id="nbCheck" style="background:linear-gradient(135deg,#27ae60,#2ecc71)">✅ Проверить</button></div>
            </div>
            ${words.length>0?`<div class="examples-row">${words.map(w=>`<div class="example-word" data-char="${w.char}"><div class="ex-char">${w.char}</div><div class="ex-pinyin">${w.pinyin}</div><div class="ex-mean">${w.meaning}</div></div>`).join('')}</div>`:''}
            <div class="notebook-actions"><button class="close-learn" id="nbClose">✖ Закрыть</button><button class="notebook-btn" id="nbAdd">📓 В тетрадь</button></div>
        </div>`;
        document.body.appendChild(modal);currentModal=modal;
        const hwContainer=modal.querySelector('#hwContainer');initHanziWriter(hwContainer,radical.key);
        modal.querySelector('#replayAnimBtn').onclick=()=>{if(hwWriterInstance)hwWriterInstance.animateCharacter()};
        const cvs=modal.querySelector('#nbCanvas');initNotebookCanvas(cvs);setupCalligraphyBrush(cvs);
        const slider=modal.querySelector('#brushSlider'),preview=modal.querySelector('#brushPreview');
        slider.oninput=()=>{currentBrushWidth=parseInt(slider.value);preview.style.width=currentBrushWidth+'px';preview.style.height=currentBrushWidth+'px'};
        let exVisible=false;
        modal.querySelector('#nbShow').onclick=()=>{showExampleOnCanvas(cvs,radical.key);exVisible=true;modal.querySelector('#nbShow').style.display='none';modal.querySelector('#nbHide').style.display='inline-block'};
        modal.querySelector('#nbHide').onclick=()=>{clearNotebookCanvas(cvs);exVisible=false;modal.querySelector('#nbShow').style.display='inline-block';modal.querySelector('#nbHide').style.display='none'};
        modal.querySelector('#nbClear').onclick=()=>{clearNotebookCanvas(cvs);modal.querySelector('#qFill').style.width='0%';modal.querySelector('#qText').textContent='Нарисуй что-нибудь'};
        modal.querySelector('#nbCheck').onclick=()=>{const r=checkQuality(cvs);modal.querySelector('#qFill').style.width=r.score+'%';modal.querySelector('#qFill').style.background=r.color;modal.querySelector('#qText').textContent=r.msg};
        modal.querySelector('.radical-big').onclick=()=>speakChinese(radical.key);
        modal.querySelectorAll('.example-word').forEach(el=>{el.onclick=()=>speakChinese(el.dataset.char)});
        modal.querySelector('#nbClose').onclick=()=>{modal.remove();currentModal=null;hwWriterInstance=null};
        modal.querySelector('#nbAdd').onclick=()=>{let nb=JSON.parse(localStorage.getItem('chinese_notebook')||'[]');if(!nb.find(i=>i.char===radical.key)){nb.push({char:radical.key,name:radical.keyName,added:new Date().toISOString()});localStorage.setItem('chinese_notebook',JSON.stringify(nb));showToast(`✅ "${radical.key}" в тетради!`)}else{showToast(`⚠️ Уже есть`)} };
        modal.onclick=e=>{if(e.target===modal){modal.remove();currentModal=null;hwWriterInstance=null}};
        speakChinese(radical.key);
    }

    function showToast(m){const t=document.createElement('div');t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2ecc71;color:#fff;padding:10px 20px;border-radius:50px;z-index:3000;font-size:15px;box-shadow:0 5px 20px rgba(0,0,0,.3);';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000)}

    function buildPairs(count){if(!Array.isArray(RADICALS_DB)||RADICALS_DB.length===0)return[];if(typeof WORDS==='undefined'||!Array.isArray(WORDS))return[];const pairs=[],usedR=new Set(),usedW=new Set();let att=0;while(pairs.length<count&&att<count*5){att++;const rad=RADICALS_DB[Math.floor(Math.random()*RADICALS_DB.length)];if(!rad||!rad.key||usedR.has(rad.key))continue;const words=findWordsWithRadical(rad.key,3);if(words.length===0)continue;const word=words[Math.floor(Math.random()*words.length)];if(usedW.has(word.char))continue;usedR.add(rad.key);usedW.add(word.char);pairs.push({radical:rad.key,radicalPinyin:rad.keyPinyin||'?',radicalName:rad.keyName||rad.key,word:word.char,wordPinyin:word.pinyin,wordMeaning:word.meaning,strokes:rad.strokes||'?'})}return pairs}
    function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
    function renderGrid(){if(!gridEl)return;gridEl.innerHTML='';for(let i=0;i<tiles.length;i++){const t=tiles[i];if(t.removed)continue;const d=document.createElement('div');d.className='tile'+(selectedId===t.id?' selected':'');d.innerHTML=`<div class="main-char">${t.char}</div><div class="pinyin">${t.pinyin||''}</div><div class="info">${t.name||''}</div>`;d.onclick=e=>{speakChinese(t.char);onTileClick(t,e)};gridEl.appendChild(d)}}

    function onTileClick(clicked,event){
        if(clicked.removed)return;
        if(selectedId===null){selectedId=clicked.id;renderGrid();msgEl.innerHTML=`✅ Выбрано: ${clicked.char}`;return}
        const sel=tiles.find(t=>t.id===selectedId);if(!sel){selectedId=null;return}
        if(sel.id===clicked.id){selectedId=null;renderGrid();msgEl.innerHTML='🔍 Снято';return}
        if(sel.pairId===clicked.pairId&&sel.type!==clicked.type){
            sel.removed=true;clicked.removed=true;matchedCount++;streak++;
            let points=10+Math.floor(streak/2)*2;const sp=calcSpeedBonus();points+=sp.bonus;
            if(sp.label&&event){const rect=event.target.getBoundingClientRect();showFloatingBonus(sp.label,rect.left+rect.width/2-30,rect.top-20)}
            score+=points;if(streak>record)record=streak;updateUI();
            let keyTile=sel.type==='key'?sel:clicked;let rad=RADICALS_DB.find(r=>r.key===keyTile.char);
            if(rad)showLearnModal(rad);selectedId=null;renderGrid();
            msgEl.innerHTML=`✅ +${points}${sp.bonus>0?' ⚡':''} (🔥${streak})`;
            if(matchedCount===totalPairs){stopTimer();msgEl.innerHTML='🏆 УРОВЕНЬ ПРОЙДЕН!';speakChinese('恭喜你');setTimeout(()=>{if(confirm('🎉 Следующий уровень?')){const n=Math.min(9,currentLevel+1);const btn=document.querySelector(`.level-btn[data-level="${n}"]`);if(btn)btn.click()}},600)}
        }else{streak=0;updateUI();msgEl.innerHTML=`❌ Не пара!`;selectedId=null;renderGrid()}
    }

    function updateUI(){if(scoreSpan)scoreSpan.textContent=score;if(remainSpan)remainSpan.textContent=totalPairs-matchedCount;if(streakSpan)streakSpan.textContent=streak;if(recordSpan)recordSpan.textContent=record;if(progressFill&&totalPairs>0)progressFill.style.width=((matchedCount/totalPairs)*100)+'%'}
    function shuffleTiles(){if(tiles.length===0){initGame(currentLevel);return}const rem=tiles.filter(t=>!t.removed),rm=tiles.filter(t=>t.removed);shuffle(rem);tiles=[...rem,...rm];selectedId=null;renderGrid();msgEl.innerHTML='🃏 Перемешано!'}
    function showHint(){for(let i=0;i<tiles.length;i++){if(tiles[i].removed)continue;for(let j=i+1;j<tiles.length;j++){if(tiles[j].removed)continue;if(tiles[i].pairId===tiles[j].pairId&&tiles[i].type!==tiles[j].type){msgEl.innerHTML=`💡 "${tiles[i].char}" ↔ "${tiles[j].char}"`;const all=gridEl.querySelectorAll('.tile');let idx=0;for(let k=0;k<tiles.length;k++){if(tiles[k].removed)continue;if(tiles[k].id===tiles[i].id||tiles[k].id===tiles[j].id){if(all[idx]){all[idx].style.borderColor='#f7b42c';all[idx].style.boxShadow='0 0 0 4px rgba(247,180,44,.5),0 6px 0 #8b6946'}}idx++}setTimeout(()=>renderGrid(),2000);return}}}msgEl.innerHTML='💡 Все пары найдены!'}

    function initGame(level){
        if(!Array.isArray(RADICALS_DB)||RADICALS_DB.length===0){msgEl.innerHTML='⚠️ RADICALS не загружены';return}
        currentLevel=level;const cfg=LEVEL_CONFIG[level];
        let needed=Math.min(cfg.pairsCount,Math.floor(RADICALS_DB.length*0.9));if(needed<3)needed=3;
        const pairs=buildPairs(needed);if(pairs.length===0){msgEl.innerHTML='⚠️ Нет пар. Проверьте WORDS.js';return}
        totalPairs=pairs.length;matchedCount=0;score=0;streak=0;selectedId=null;tiles=[];
        let id=0;pairs.forEach((p,i)=>{tiles.push({id:id++,pairId:i,type:'key',char:p.radical,pinyin:p.radicalPinyin,name:p.radicalName,removed:false});tiles.push({id:id++,pairId:i,type:'word',char:p.word,pinyin:p.wordPinyin,name:p.wordMeaning,removed:false})});
        shuffle(tiles);updateUI();renderGrid();startTimer();msgEl.innerHTML=`🎮 Уровень ${level}: ${totalPairs} пар`;
    }

    if(typeof RADICALS!=='undefined'&&Array.isArray(RADICALS)&&RADICALS.length>0){
        const skip=["⺌","⺈","⺍","⺮","⺅","⺋","一","丨","丶","丿","乙","亅","⺄","⺀","⺁","⺂"];
        RADICALS.forEach(r=>{if(!r.s||r.s.length>2||skip.includes(r.s))return;RADICALS_DB.push({key:r.s,keyPinyin:r.p||'?',keyName:r.m||'радикал',keyMeaning:r.m||'',strokes:Math.min(12,Math.max(1,Math.floor(Math.random()*8)+1))})});
        console.log(`✅ Загружено ${RADICALS_DB.length} радикалов`);
    }else{console.warn('⚠️ RADICALS не найден')}

    document.querySelectorAll('.level-btn').forEach(btn=>{btn.onclick=()=>{document.querySelectorAll('.level-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');initGame(parseInt(btn.dataset.level))}});
    document.getElementById('hintBtn').onclick=showHint;
    document.getElementById('shuffleBtn').onclick=shuffleTiles;
    document.getElementById('resetGameBtn').onclick=()=>initGame(currentLevel);
    window.addEventListener('load',()=>initGame(3));
</script>
</body>
</html>
