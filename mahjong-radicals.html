<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🀄️ МАДЖОНГ С РАДИКАЛАМИ | Пирамида</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: linear-gradient(145deg, #1a3a2a 0%, #0a1a0f 100%);
            min-height: 100vh;
            font-family: system-ui, 'Segoe UI', sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .game-container {
            max-width: 1100px;
            width: 100%;
            background: rgba(30, 25, 20, 0.7);
            border-radius: 48px;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        h1 {
            text-align: center;
            font-size: 1.5rem;
            color: #f7e05e;
            margin-bottom: 5px;
        }
        .sub {
            text-align: center;
            color: #d4c9a6;
            margin-bottom: 15px;
            font-size: 0.75rem;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #2c2118;
            padding: 8px 16px;
            border-radius: 60px;
            margin-bottom: 15px;
            color: #ffecb3;
            font-weight: bold;
            font-size: 0.85rem;
            flex-wrap: wrap;
            gap: 8px;
        }
        .stats-bar span {
            background: #00000066;
            padding: 4px 12px;
            border-radius: 40px;
        }
        .game-board {
            display: flex;
            justify-content: center;
            margin: 15px 0;
            overflow-x: auto;
        }
        .pyramid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .pyramid-row {
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        .tile {
            background: #fff8e7;
            background-image: radial-gradient(circle at 25% 35%, rgba(255,245,200,0.6) 2%, transparent 2.5%);
            background-size: 20px 20px;
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.1s;
            border: 2px solid #c8aa6e;
            box-shadow: 0 5px 0 #8b6946;
            min-width: 85px;
            position: relative;
        }
        .tile.free {
            border: 2px solid #f5b042;
            box-shadow: 0 0 0 2px #ffd966, 0 5px 0 #8b6946;
        }
        .tile.selected {
            background: #ffe6b3;
            border: 3px solid #f5b042;
            transform: scale(0.97);
        }
        .tile.blocked {
            opacity: 0.6;
            filter: grayscale(0.3);
            cursor: not-allowed;
        }
        .tile.removed {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .tile .main-char {
            font-size: 36px;
            font-weight: 800;
            color: #3c2a1f;
        }
        .tile .pinyin-small {
            font-size: 9px;
            color: #b34e1a;
            margin-top: 4px;
        }
        .tile .info {
            font-size: 9px;
            margin-top: 3px;
            color: #7a5a3a;
            background: #f3e5c9;
            display: inline-block;
            padding: 2px 6px;
            border-radius: 40px;
        }
        .message-area {
            background: #261d14e6;
            border-radius: 60px;
            padding: 10px 16px;
            text-align: center;
            font-weight: bold;
            font-size: 0.85rem;
            margin: 12px 0;
            color: #f7e6c4;
        }
        .ctrl-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        button {
            background: linear-gradient(135deg, #f7b42c, #fc8e2c);
            border: none;
            padding: 8px 20px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 60px;
            color: #2c1a0c;
            cursor: pointer;
            box-shadow: 0 3px 0 #9b5e1c;
        }
        button:active { transform: translateY(2px); }
        .reset-btn { background: linear-gradient(135deg, #4b6a3b, #2d5a2a); color: #f9e7b3; }
        .hint-btn { background: linear-gradient(135deg, #3a6b8a, #2a4a6a); color: white; }
        .progress-bar {
            background: #4a3729;
            border-radius: 30px;
            height: 8px;
            margin: 10px 0;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, #f7b42c, #f5a623);
            width: 0%;
            height: 100%;
            transition: width 0.3s;
        }
        .example-popup {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e2a1aee;
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 12px 20px;
            max-width: 90%;
            z-index: 1000;
            border: 2px solid #f7b42c;
            text-align: center;
            color: #fef0cf;
            font-size: 12px;
        }
        .example-popup .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 8px;
        }
        .example-item {
            background: #3c2a1f;
            border-radius: 16px;
            padding: 5px 10px;
            text-align: center;
            cursor: pointer;
        }
        .example-item .ex-char { font-size: 24px; }
        @media (max-width: 650px) {
            .tile { min-width: 65px; padding: 8px 4px; }
            .tile .main-char { font-size: 28px; }
            .pyramid-row { gap: 5px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>🀄️ МАДЖОНГ С РАДИКАЛАМИ</h1>
    <div class="sub">🏔️ Пирамида | Соединяй только СВОБОДНЫЕ плитки (не закрытые сверху или с боков)</div>

    <div class="stats-bar">
        <span>🎯 Счёт: <span id="scoreValue">0</span></span>
        <span>🧩 Осталось: <span id="remainValue">0</span></span>
        <span>🔥 Серия: <span id="streakValue">0</span></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

    <div class="game-board" id="gameBoard"></div>

    <div class="message-area" id="gameMessage">🌟 Нажми на свободную плитку, затем на её пару</div>

    <div class="ctrl-buttons">
        <button id="hintBtn" class="hint-btn">💡 Подсказка</button>
        <button id="resetGameBtn" class="reset-btn">🔄 Новая игра</button>
    </div>
</div>

<script>
    // РАДИКАЛЫ + ПРИМЕРЫ (сокращённая база для пирамиды)
    const RADICALS_DATA = [
        { char: "口", pinyin: "kǒu", name: "рот", examples: [{c:"吃",p:"chī",m:"есть"},{c:"喝",p:"hē",m:"пить"},{c:"叫",p:"jiào",m:"кричать"}] },
        { char: "水", pinyin: "shuǐ", name: "вода", examples: [{c:"河",p:"hé",m:"река"},{c:"海",p:"hǎi",m:"море"},{c:"洗",p:"xǐ",m:"мыть"}] },
        { char: "火", pinyin: "huǒ", name: "огонь", examples: [{c:"烧",p:"shāo",m:"жечь"},{c:"炒",p:"chǎo",m:"жарить"},{c:"烟",p:"yān",m:"дым"}] },
        { char: "木", pinyin: "mù", name: "дерево", examples: [{c:"树",p:"shù",m:"дерево"},{c:"林",p:"lín",m:"лес"},{c:"桌",p:"zhuō",m:"стол"}] },
        { char: "手", pinyin: "shǒu", name: "рука", examples: [{c:"打",p:"dǎ",m:"бить"},{c:"拿",p:"ná",m:"брать"},{c:"找",p:"zhǎo",m:"искать"}] },
        { char: "心", pinyin: "xīn", name: "сердце", examples: [{c:"想",p:"xiǎng",m:"думать"},{c:"忘",p:"wàng",m:"забывать"},{c:"忙",p:"máng",m:"занятой"}] },
        { char: "日", pinyin: "rì", name: "солнце", examples: [{c:"时",p:"shí",m:"время"},{c:"明",p:"míng",m:"завтра"},{c:"暖",p:"nuǎn",m:"тёплый"}] },
        { char: "月", pinyin: "yuè", name: "луна", examples: [{c:"期",p:"qī",m:"период"},{c:"有",p:"yǒu",m:"иметь"},{c:"朋",p:"péng",m:"друг"}] },
        { char: "女", pinyin: "nǚ", name: "женщина", examples: [{c:"妈",p:"mā",m:"мама"},{c:"姐",p:"jiě",m:"сестра"},{c:"好",p:"hǎo",m:"хорошо"}] },
        { char: "人", pinyin: "rén", name: "человек", examples: [{c:"你",p:"nǐ",m:"ты"},{c:"他",p:"tā",m:"он"},{c:"们",p:"men",m:"мн.ч."}] },
        { char: "金", pinyin: "jīn", name: "золото", examples: [{c:"钱",p:"qián",m:"деньги"},{c:"银",p:"yín",m:"серебро"},{c:"针",p:"zhēn",m:"игла"}] },
        { char: "土", pinyin: "tǔ", name: "земля", examples: [{c:"地",p:"dì",m:"земля"},{c:"城",p:"chéng",m:"город"},{c:"坏",p:"huài",m:"плохой"}] }
    ];

    function speakText(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "zh-CN";
        u.rate = 0.8;
        window.speechSynthesis.speak(u);
    }

    function showExamples(radical) {
        const popup = document.createElement('div');
        popup.className = 'example-popup';
        popup.innerHTML = `
            <div>📚 <strong>${radical.char} (${radical.name})</strong> — примеры:</div>
            <div class="examples">
                ${radical.examples.map(ex => `<div class="example-item" onclick="speakText('${ex.c}')">${ex.c} ${ex.p} — ${ex.m}</div>`).join('')}
            </div>
        `;
        document.body.appendChild(popup);
        setTimeout(() => popup.remove(), 5000);
        speakText(radical.char);
    }

    // Построение пирамиды (5 рядов)
    function buildPyramidTiles(pairsCount) {
        const tiles = [];
        let id = 0;
        // Ряды: 1,2,3,4,5 плиток
        const rows = [1, 2, 3, 4, 5];
        for (let i = 0; i < rows.length; i++) {
            const rowTiles = [];
            for (let j = 0; j < rows[i]; j++) {
                const pairId = id % pairsCount;
                tiles.push({ row: i, col: j, pairId, type: 'word', id: id++ });
                tiles.push({ row: i, col: j, pairId, type: 'radical', id: id++ });
            }
        }
        return tiles;
    }

    let pyramidTiles = [];
    let tileElements = [];
    let selectedTileId = null;
