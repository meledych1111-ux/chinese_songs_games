<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🀄️ МАДЖОНГ | Найди пару ключ+слово</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: linear-gradient(145deg, #1a3a2a 0%, #0a1a0f 100%);
            min-height: 100vh;
            font-family: system-ui, 'Segoe UI', 'PingFang SC', sans-serif;
            padding: 20px;
        }
        .game-container {
            max-width: 1300px;
            margin: 0 auto;
            background: rgba(30, 25, 20, 0.6);
            border-radius: 48px;
            padding: 24px;
        }
        h1 {
            text-align: center;
            font-size: 1.8rem;
            color: #f7e05e;
            margin-bottom: 8px;
        }
        .sub {
            text-align: center;
            color: #d4c9a6;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #2c2118;
            padding: 12px 24px;
            border-radius: 60px;
            margin-bottom: 20px;
            color: #ffecb3;
            font-weight: bold;
            font-size: 1rem;
            flex-wrap: wrap;
            gap: 12px;
        }
        .stats-bar span {
            background: #00000066;
            padding: 6px 18px;
            border-radius: 40px;
        }
        .level-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .level-btn {
            background: #4a3729;
            color: #d4c9a6;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.1s;
        }
        .level-btn.active {
            background: linear-gradient(135deg, #f7b42c, #fc8e2c);
            color: #2c1a0c;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
            background: #4a3729;
            padding: 25px;
            border-radius: 48px;
            min-height: 500px;
            margin: 20px 0;
        }
        .tile {
            background: #fff8e7;
            background-image: radial-gradient(circle at 25% 35%, rgba(255,245,200,0.6) 2%, transparent 2.5%);
            background-size: 25px 25px;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.1s;
            border: 3px solid #c8aa6e;
            box-shadow: 0 6px 0 #8b6946;
            padding: 18px 8px;
        }
        .tile.selected {
            background: #ffe6b3;
            border: 3px solid #f5b042;
            transform: scale(0.96);
            box-shadow: 0 3px 0 #8b6946;
        }
        .tile.removed {
            display: none;
        }
        .tile .main-char {
            font-size: 52px;
            font-weight: 800;
            color: #3c2a1f;
        }
        .tile .pinyin {
            font-size: 13px;
            color: #b34e1a;
            margin-top: 8px;
        }
        .tile .info {
            font-size: 11px;
            margin-top: 5px;
            color: #7a5a3a;
            background: #f3e5c9;
            display: inline-block;
            padding: 3px 12px;
            border-radius: 40px;
        }
        .message-area {
            background: #261d14e6;
            border-radius: 60px;
            padding: 14px 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
            margin: 20px 0;
            color: #f7e6c4;
        }
        .ctrl-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        button {
            background: linear-gradient(135deg, #f7b42c, #fc8e2c);
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 60px;
            color: #2c1a0c;
            cursor: pointer;
            box-shadow: 0 4px 0 #9b5e1c;
        }
        button:active { transform: translateY(2px); }
        .reset-btn { background: linear-gradient(135deg, #4b6a3b, #2d5a2a); color: #f9e7b3; }
        .hint-btn { background: linear-gradient(135deg, #3a6b8a, #2a4a6a); color: white; }
        .shuffle-btn { background: linear-gradient(135deg, #8e44ad, #6c3483); color: white; }
        .progress-bar {
            background: #4a3729;
            border-radius: 30px;
            height: 10px;
            margin: 15px 0;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, #f7b42c, #f5a623);
            width: 0%;
            height: 100%;
            transition: width 0.3s;
        }
        .example-popup {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e2a1aee;
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 16px 24px;
            max-width: 90%;
            z-index: 1000;
            border: 2px solid #f7b42c;
            text-align: center;
            color: #fef0cf;
            font-size: 13px;
        }
        .example-popup .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 12px;
        }
        .example-item {
            background: #3c2a1f;
            border-radius: 16px;
            padding: 8px 14px;
            text-align: center;
            cursor: pointer;
        }
        .example-item:active { transform: scale(0.95); }
        .example-item .ex-char { font-size: 28px; font-weight: bold; }
        .example-item .ex-pinyin { font-size: 11px; color: #ffd966; }
        @media (max-width: 800px) {
            .game-grid { grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 20px; }
            .tile .main-char { font-size: 42px; }
        }
        @media (max-width: 550px) {
            .game-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; }
            .tile .main-char { font-size: 34px; }
            .tile { padding: 12px 5px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>🀄️ МАДЖОНГ С РАДИКАЛАМИ</h1>
    <div class="sub">🔗 Соедини КЛЮЧ и СЛОВО | Никаких блокировок!</div>

    <div class="level-bar" id="levelBar">
        <div class="level-btn" data-level="1">🌱 Лёгкий (6 пар)</div>
        <div class="level-btn" data-level="2" class="active">⭐ Средний (12 пар)</div>
        <div class="level-btn" data-level="3">🏆 Сложный (18 пар)</div>
        <div class="level-btn" data-level="4">🔥 Мастер (24 пары)</div>
    </div>

    <div class="stats-bar">
        <span>🎯 Счёт: <span id="scoreValue">0</span></span>
        <span>🧩 Осталось: <span id="remainValue">0</span></span>
        <span>🔥 Серия: <span id="streakValue">0</span></span>
        <span>🏆 Рекорд: <span id="recordValue">0</span></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

    <div class="game-grid" id="gameGrid"></div>

    <div class="message-area" id="gameMessage">🌟 Нажми на плитку, затем на её пару (ключ + слово)</div>

    <div class="ctrl-buttons">
        <button id="hintBtn" class="hint-btn">💡 Подсказка</button>
        <button id="shuffleBtn" class="shuffle-btn">🔄 Перемешать</button>
        <button id="resetGameBtn" class="reset-btn">🆕 Новая игра</button>
    </div>
</div>

<script>
    // ==================== РАДИКАЛЫ (ключ + слово = пара) ====================
    const PAIRS = [
        { key: "口", keyPinyin: "kǒu", keyName: "рот (ключ)", word: "吃", wordPinyin: "chī", wordName: "есть", examples: [{c:"喝",p:"hē",m:"пить"},{c:"叫",p:"jiào",m:"кричать"},{c:"唱",p:"chàng",m:"петь"}] },
        { key: "氵", keyPinyin: "shuǐ", keyName: "вода (ключ)", word: "河", wordPinyin: "hé", wordName: "река", examples: [{c:"海",p:"hǎi",m:"море"},{c:"洗",p:"xǐ",m:"мыть"},{c:"泳",p:"yǒng",m:"плыть"}] },
        { key: "火", keyPinyin: "huǒ", keyName: "огонь (ключ)", word: "烧", wordPinyin: "shāo", wordName: "жечь", examples: [{c:"炒",p:"chǎo",m:"жарить"},{c:"烟",p:"yān",m:"дым"},{c:"灯",p:"dēng",m:"лампа"}] },
        { key: "木", keyPinyin: "mù", keyName: "дерево (ключ)", word: "树", wordPinyin: "shù", wordName: "дерево", examples: [{c:"林",p:"lín",m:"лес"},{c:"桌",p:"zhuō",m:"стол"},{c:"椅",p:"yǐ",m:"стул"}] },
        { key: "扌", keyPinyin: "shǒu", keyName: "рука (ключ)", word: "打", wordPinyin: "dǎ", wordName: "бить", examples: [{c:"拿",p:"ná",m:"брать"},{c:"找",p:"zhǎo",m:"искать"},{c:"拉",p:"lā",m:"тянуть"}] },
        { key: "忄", keyPinyin: "xīn", keyName: "сердце (ключ)", word: "想", wordPinyin: "xiǎng", wordName: "думать", examples: [{c:"忘",p:"wàng",m:"забывать"},{c:"忙",p:"máng",m:"занятой"},{c:"情",p:"qíng",m:"чувство"}] },
        { key: "日", keyPinyin: "rì", keyName: "солнце (ключ)", word: "时", wordPinyin: "shí", wordName: "время", examples: [{c:"明",p:"míng",m:"яркий"},{c:"暖",p:"nuǎn",m:"тёплый"},{c:"晚",p:"wǎn",m:"вечер"}] },
        { key: "月", keyPinyin: "yuè", keyName: "луна (ключ)", word: "期", wordPinyin: "qī", wordName: "период", examples: [{c:"有",p:"yǒu",m:"иметь"},{c:"朋",p:"péng",m:"друг"},{c:"朝",p:"zhāo",m:"утро"}] },
        { key: "女", keyPinyin: "nǚ", keyName: "женщина (ключ)", word: "妈", wordPinyin: "mā", wordName: "мама", examples: [{c:"姐",p:"jiě",m:"сестра"},{c:"妹",p:"mèi",m:"младшая сестра"},{c:"好",p:"hǎo",m:"хорошо"}] },
        { key: "亻", keyPinyin: "rén", keyName: "человек (ключ)", word: "你", wordPinyin: "nǐ", wordName: "ты", examples: [{c:"他",p:"tā",m:"он"},{c:"们",p:"men",m:"мн.ч."},{c:"住",p:"zhù",m:"жить"}] },
        { key: "钅", keyPinyin: "jīn", keyName: "металл (ключ)", word: "钱", wordPinyin: "qián", wordName: "деньги", examples: [{c:"银",p:"yín",m:"серебро"},{c:"针",p:"zhēn",m:"игла"},{c:"钢",p:"gāng",m:"сталь"}] },
        { key: "土", keyPinyin: "tǔ", keyName: "земля (ключ)", word: "地", wordPinyin: "dì", wordName: "земля", examples: [{c:"城",p:"chéng",m:"город"},{c:"坏",p:"huài",m:"плохой"},{c:"块",p:"kuài",m:"кусок"}] },
        { key: "山", keyPinyin: "shān", keyName: "гора (ключ)", word: "峰", wordPinyin: "fēng", wordName: "вершина", examples: [{c:"岛",p:"dǎo",m:"остров"},{c:"岁",p:"suì",m:"возраст"},{c:"岸",p:"àn",m:"берег"}] },
        { key: "田", keyPinyin: "tián", keyName: "поле (ключ)", word: "男", wordPinyin: "nán", wordName: "мужчина", examples: [{c:"留",p:"liú",m:"оставлять"},{c:"累",p:"lèi",m:"уставать"}] },
        { key: "目", keyPinyin: "mù", keyName: "глаз (ключ)", word: "看", wordPinyin: "kàn", wordName: "смотреть", examples: [{c:"眼",p:"yǎn",m:"глаз"},{c:"睡",p:"shuì",m:"спать"},{c:"睛",p:"jīng",m:"глаз"}] },
        { key: "耳", keyPinyin: "ěr", keyName: "ухо (ключ)", word: "听", wordPinyin: "tīng", wordName: "слушать", examples: [{c:"闻",p:"wén",m:"слышать"},{c:"聪",p:"cōng",m:"умный"}] },
        { key: "足", keyPinyin: "zú", keyName: "нога (ключ)", word: "跑", wordPinyin: "pǎo", wordName: "бежать", examples: [{c:"跳",p:"tiào",m:"прыгать"},{c:"踢",p:"tī",m:"пинать"},{c:"跟",p:"gēn",m:"следовать"}] },
        { key: "讠", keyPinyin: "yán", keyName: "речь (ключ)", word: "说", wordPinyin: "shuō", wordName: "говорить", examples: [{c:"话",p:"huà",m:"слова"},{c:"请",p:"qǐng",m:"пожалуйста"},{c:"读",p:"dú",m:"читать"}] },
        { key: "饣", keyPinyin: "shí", keyName: "еда (ключ)", word: "饭", wordPinyin: "fàn", wordName: "рис", examples: [{c:"饱",p:"bǎo",m:"сытый"},{c:"饿",p:"è",m:"голодный"},{c:"饼",p:"bǐng",m:"лепёшка"}] },
        { key: "衤", keyPinyin: "yī", keyName: "одежда (ключ)", word: "裤", wordPinyin: "kù", wordName: "штаны", examples: [{c:"衬衫",p:"chènshān",m:"рубашка"},{c:"袜",p:"wà",m:"носки"},{c:"裙",p:"qún",m:"юбка"}] },
        { key: "辶", keyPinyin: "chuò", keyName: "движение (ключ)", word: "过", wordPinyin: "guò", wordName: "проходить", examples: [{c:"还",p:"hái",m:"ещё"},{c:"送",p:"sòng",m:"отправлять"},{c:"进",p:"jìn",m:"входить"}] },
        { key: "门", keyPinyin: "mén", keyName: "дверь (ключ)", word: "问", wordPinyin: "wèn", wordName: "спрашивать", examples: [{c:"间",p:"jiān",m:"комната"},{c:"开",p:"kāi",m:"открывать"},{c:"关",p:"guān",m:"закрывать"}] },
        { key: "车", keyPinyin: "chē", keyName: "машина (ключ)", word: "轮", wordPinyin: "lún", wordName: "колесо", examples: [{c:"转",p:"zhuǎn",m:"поворачивать"},{c:"轻",p:"qīng",m:"лёгкий"}] },
        { key: "雨", keyPinyin: "yǔ", keyName: "дождь (ключ)", word: "雪", wordPinyin: "xuě", wordName: "снег", examples: [{c:"雷",p:"léi",m:"гром"},{c:"雾",p:"wù",m:"туман"}] }
    ];

    let currentLevel = 2;
    let tiles = [];
    let selectedId = null;
    let matchedCount = 0;
    let totalPairs = 0;
    let score = 0;
    let streak = 0;
    let record = 0;

    const LEVEL_CONFIG = {
        1: { pairsCount: 6, gridCols: 4 },
        2: { pairsCount: 12, gridCols: 6 },
        3: { pairsCount: 18, gridCols: 6 },
        4: { pairsCount: 24, gridCols: 8 }
    };

    const scoreSpan = document.getElementById('scoreValue');
    const remainSpan = document.getElementById('remainValue');
    const streakSpan = document.getElementById('streakValue');
    const recordSpan = document.getElementById('recordValue');
    const progressFill = document.getElementById('progressFill');
    const msgEl = document.getElementById('gameMessage');
    const gridEl = document.getElementById('gameGrid');

    function speakText(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "zh-CN";
        u.rate = 0.8;
        window.speechSynthesis.speak(u);
    }

    function showExamples(pair) {
        const examples = pair.examples || [];
        const popup = document.createElement('div');
        popup.className = 'example-popup';
        popup.innerHTML = `
            <div>📚 <strong>${pair.key} (${pair.keyPinyin})</strong> — ${pair.keyName}</div>
            <div class="examples">
                <div class="example-item" onclick="speakText('${pair.word}')">
                    <div class="ex-char">${pair.word}</div>
                    <div class="ex-pinyin">${pair.wordPinyin}</div>
                    <div>${pair.wordName}</div>
                </div>
                ${examples.map(ex => `<div class="example-item" onclick="speakText('${ex.c}')"><div class="ex-char">${ex.c}</div><div class="ex-pinyin">${ex.p}</div><div>${ex.m}</div></div>`).join('')}
            </div>
            <div style="font-size:10px; margin-top:8px;">✨ Нажми на слово, чтобы услышать</div>
        `;
        document.body.appendChild(popup);
        setTimeout(() => popup.remove(), 5000);
        speakText(pair.key);
    }

    function renderGrid() {
        if (!gridEl) return;
        const config = LEVEL_CONFIG[currentLevel];
        gridEl.style.gridTemplateColumns = `repeat(${config.gridCols}, 1fr)`;
        gridEl.innerHTML = '';
        
        for (let i = 0; i < tiles.length; i++) {
            const tile = tiles[i];
            if (tile.removed) continue;
            const div = document.createElement('div');
            div.className = 'tile';
            if (selectedId === tile.id) div.classList.add('selected');
            div.innerHTML = `
                <div class="main-char">${tile.char}</div>
                <div class="pinyin">${tile.pinyin}</div>
                <div class="info">${tile.name}</div>
            `;
            div.onclick = (function(t) { return function() { onTileClick(t); }; })(tile);
            gridEl.appendChild(div);
        }
        
        if (gridEl.children.length === 0 && matchedCount === totalPairs) {
            msgEl.innerHTML = "🏆 ПОБЕДА! Отличная игра! 🏆";
        }
    }

    function onTileClick(clickedTile) {
        if (clickedTile.removed) return;
        
        if (selectedId === null) {
            selectedId = clickedTile.id;
            renderGrid();
            msgEl.innerHTML = `✅ Выбрано: ${clickedTile.char} (${clickedTile.name})`;
            return;
        }
        
        const selectedTile = tiles.find(t => t.id === selectedId);
        if (selectedTile.id === clickedTile.id) {
            selectedId = null;
            renderGrid();
            msgEl.innerHTML = "🔍 Выделение снято";
            return;
        }
        
        // Проверяем пару: одинаковый pairId и разные типы (ключ + слово)
        if (selectedTile.pairId === clickedTile.pairId && selectedTile.type !== clickedTile.type) {
            selectedTile.removed = true;
            clickedTile.removed = true;
            matchedCount++;
            streak++;
            const points = 10 + Math.floor(streak / 2) * 2;
            score += points;
            if (streak > record) record = streak;
            updateUI();
            
            const pair = PAIRS[selectedTile.pairId % PAIRS.length];
            if (pair) showExamples(pair);
            
            selectedId = null;
            renderGrid();
            msgEl.innerHTML = `✅ Верно! +${points} очков (серия ${streak})`;
            
            if (matchedCount === totalPairs) {
                msgEl.innerHTML = `🏆 ПОБЕДА! Уровень ${currentLevel} пройден! 🏆`;
                speakText("Поздравляю! Уровень пройден!");
            }
        } else {
            streak = 0;
            updateUI();
            msgEl.innerHTML = `❌ Не пара! "${selectedTile.char}" ≠ "${clickedTile.char}"`;
            selectedId = null;
            renderGrid();
        }
    }

    function updateUI() {
        scoreSpan.textContent = score;
        remainSpan.textContent = totalPairs - matchedCount;
        streakSpan.textContent = streak;
        recordSpan.textContent = record;
        progressFill.style.width = ((matchedCount / totalPairs) * 100) + "%";
    }

    function shuffleTiles() {
        const remaining = tiles.filter(t => !t.removed);
        if (remaining.length === 0) {
            initGame(currentLevel);
            return;
        }
        
        const tileData = remaining.map(t => ({
            pairId: t.pairId,
            type: t.type,
            char: t.char,
            pinyin: t.pinyin,
            name: t.name
        }));
        
        for (let i = tileData.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [tileData[i], tileData[j]] = [tileData[j], tileData[i]];
        }
        
        let idx = 0;
        for (let i = 0; i < tiles.length; i++) {
            if (!tiles[i].removed) {
                tiles[i].pairId = tileData[idx].pairId;
                tiles[i].type = tileData[idx].type;
                tiles[i].char = tileData[idx].char;
                tiles[i].pinyin = tileData[idx].pinyin;
                tiles[i].name = tileData[idx].name;
                idx++;
            }
        }
        
        selectedId = null;
        renderGrid();
        msgEl.innerHTML = "🃏 Плитки перемешаны! Продолжай игру.";
    }

    function showHint() {
        for (let i = 0; i < tiles.length; i++) {
            if (tiles[i].removed) continue;
            for (let j = i + 1; j < tiles.length; j++) {
                if (tiles[j].removed) continue;
                if (tiles[i].pairId === tiles[j].pairId && tiles[i].type !== tiles[j].type) {
                    msgEl.innerHTML = `💡 Подсказка: "${tiles[i].char}" и "${tiles[j].char}" — это пара!`;
                    return;
                }
            }
        }
        msgEl.innerHTML = "💡 Нет доступных пар? Попробуй перемешать плитки!";
    }

    function initGame(level) {
        currentLevel = level;
        const config = LEVEL_CONFIG[level];
        const neededPairs = config.pairsCount;
        
        const selectedPairs = [];
        for (let i = 0; i < neededPairs; i++) {
            selectedPairs.push(PAIRS[i % PAIRS.length]);
        }
        
        totalPairs = selectedPairs.length;
        matchedCount = 0;
        score = 0;
        streak = 0;
        selectedId = null;
        
        tiles = [];
        let idCounter = 0;
        for (let i = 0; i < selectedPairs.length; i++) {
            const pair = selectedPairs[i];
            tiles.push({
                id: idCounter++,
                pairId: i,
                type: 'key',
                char: pair.key,
                pinyin: pair.keyPinyin,
                name: pair.keyName,
                removed: false
            });
            tiles.push({
                id: idCounter++,
                pairId: i,
                type: 'word',
                char: pair.word,
                pinyin: pair.wordPinyin,
                name: pair.wordName,
                removed: false
            });
        }
        
        for (let i = tiles.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
        }
        
        updateUI();
        renderGrid();
        msgEl.innerHTML = `🎮 Уровень ${level} (${totalPairs} пар). Соединяй ключи со словами!`;
    }

    document.querySelectorAll('.level-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const level = parseInt(btn.dataset.level);
            initGame(level);
        };
    });

    document.getElementById('hintBtn').onclick = showHint;
    document.getElementById('shuffleBtn').onclick = shuffleTiles;
    document.getElementById('resetGameBtn').onclick = () => initGame(currentLevel);
    
    initGame(2);
</script>
</body>
</html>
