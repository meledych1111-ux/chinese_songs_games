<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🀄️ МАДЖОНГ С РАДИКАЛАМИ | 214 ключей | Пирамида</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: linear-gradient(145deg, #1a3a2a 0%, #0a1a0f 100%);
            min-height: 100vh;
            font-family: system-ui, 'Segoe UI', 'PingFang SC', sans-serif;
            padding: 16px;
        }
        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(30, 25, 20, 0.6);
            border-radius: 48px;
            padding: 16px;
            backdrop-filter: blur(4px);
        }
        h1 {
            text-align: center;
            font-size: 1.5rem;
            color: #f7e05e;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .sub {
            text-align: center;
            color: #d4c9a6;
            margin-bottom: 12px;
            font-size: 0.7rem;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #2c2118;
            padding: 8px 16px;
            border-radius: 60px;
            margin-bottom: 12px;
            color: #ffecb3;
            font-weight: bold;
            font-size: 0.8rem;
            flex-wrap: wrap;
            gap: 8px;
        }
        .stats-bar span {
            background: #00000066;
            padding: 4px 12px;
            border-radius: 40px;
        }
        .game-board {
            display: flex;
            justify-content: center;
            margin: 15px 0;
            overflow-x: auto;
        }
        .pyramid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .pyramid-row {
            display: flex;
            justify-content: center;
            gap: 6px;
        }
        .tile {
            background: #fff8e7;
            background-image: radial-gradient(circle at 25% 35%, rgba(255,245,200,0.6) 2%, transparent 2.5%);
            background-size: 20px 20px;
            border-radius: 12px;
            padding: 10px 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.1s;
            border: 2px solid #c8aa6e;
            box-shadow: 0 4px 0 #8b6946;
            min-width: 75px;
            position: relative;
        }
        .tile.free {
            border: 2px solid #f5b042;
            box-shadow: 0 0 0 1px #ffd966, 0 4px 0 #8b6946;
        }
        .tile.selected {
            background: #ffe6b3;
            border: 3px solid #f5b042;
            transform: scale(0.96);
        }
        .tile.blocked {
            opacity: 0.5;
            filter: grayscale(0.3);
            cursor: not-allowed;
        }
        .tile.removed {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .tile .main-char {
            font-size: 32px;
            font-weight: 800;
            color: #3c2a1f;
        }
        .tile .pinyin-small {
            font-size: 8px;
            color: #b34e1a;
            margin-top: 3px;
        }
        .tile .info {
            font-size: 8px;
            margin-top: 3px;
            color: #7a5a3a;
            background: #f3e5c9;
            display: inline-block;
            padding: 2px 5px;
            border-radius: 40px;
        }
        .message-area {
            background: #261d14e6;
            border-radius: 60px;
            padding: 8px 16px;
            text-align: center;
            font-weight: bold;
            font-size: 0.8rem;
            margin: 10px 0;
            color: #f7e6c4;
        }
        .ctrl-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        button {
            background: linear-gradient(135deg, #f7b42c, #fc8e2c);
            border: none;
            padding: 8px 20px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 60px;
            color: #2c1a0c;
            cursor: pointer;
            box-shadow: 0 3px 0 #9b5e1c;
        }
        button:active { transform: translateY(2px); }
        .reset-btn { background: linear-gradient(135deg, #4b6a3b, #2d5a2a); color: #f9e7b3; }
        .hint-btn { background: linear-gradient(135deg, #3a6b8a, #2a4a6a); color: white; }
        .progress-bar {
            background: #4a3729;
            border-radius: 30px;
            height: 6px;
            margin: 8px 0;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, #f7b42c, #f5a623);
            width: 0%;
            height: 100%;
            transition: width 0.3s;
        }
        .example-popup {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e2a1aee;
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 12px 20px;
            max-width: 90%;
            z-index: 1000;
            border: 2px solid #f7b42c;
            text-align: center;
            color: #fef0cf;
            font-size: 11px;
        }
        .example-popup .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
        }
        .example-item {
            background: #3c2a1f;
            border-radius: 14px;
            padding: 5px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.1s;
        }
        .example-item:active { transform: scale(0.95); }
        .example-item .ex-char { font-size: 22px; font-weight: bold; }
        @media (max-width: 650px) {
            .tile { min-width: 60px; padding: 6px 3px; }
            .tile .main-char { font-size: 24px; }
            .pyramid-row { gap: 4px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>🀄️ МАДЖОНГ С РАДИКАЛАМИ <span style="font-size: 0.8rem;">🏔️ 214 ключей</span></h1>
    <div class="sub">🔗 Соединяй ТОЛЬКО СВОБОДНЫЕ плитки (не закрытые сверху или с боков)</div>

        <span>🎯 Счёт: <span id="scoreValue">0</span></span>

        <span>🔥 Серия: <span id="streakValue">0</span></span>
        <span>🏆 Рекорд: <span id="recordValue">0</span></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

    <div class="game-board" id="gameBoard"></div>

    <div class="message-area" id="gameMessage">🌟 Нажми на свободную плитку, затем на её пару</div>

    <div class="ctrl-buttons">
        <button id="hintBtn" class="hint-btn">💡 Подсказка</button>
        <button id="resetGameBtn" class="reset-btn">🔄 Новая игра</button>
    </div>
</div>

    // Функции озвучки и показа примеров
    function speakText(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "zh-CN";
        u.rate = 0.8;
        window.speechSynthesis.speak(u);
    }

    function showExamples(radical) {
        const examples = radical.examples || [{c:radical.char,p:radical.pinyin,m:radical.name}];
        const popup = document.createElement('div');
        popup.className = 'example-popup';
        popup.innerHTML = `
            <div>📚 <strong>${radical.char} (${radical.pinyin})</strong> — ${radical.name}</div>
            <div class="examples">
                ${examples.map(ex => `<div class="example-item" onclick="speakText('${ex.c}')"><span class="ex-char">${ex.c}</span> ${ex.p} — ${ex.m}</div>`).join('')}
            </div>
            <div style="font-size:10px; margin-top:6px;">✨ Нажми на слово, чтобы услышать</div>
        `;
        document.body.appendChild(popup);
        setTimeout(() => popup.remove(), 6000);
        speakText(radical.char);
    }

    // Построение пирамиды
    let tiles = [];
    let tileDivs = [];
    let selectedId = null;
    let matchedCount = 0;
    let totalTiles = 0;
    let score = 0;
    let streak = 0;
    let record = 0;

    const scoreSpan = document.getElementById('scoreValue');
    const remainSpan = document.getElementById('remainValue');
    const streakSpan = document.getElementById('streakValue');
    const recordSpan = document.getElementById('recordValue');
    const progressFill = document.getElementById('progressFill');
    const msgEl = document.getElementById('gameMessage');
    const boardEl = document.getElementById('gameBoard');

    function updateUI() {
        scoreSpan.textContent = score;
        const leftPairs = (totalTiles / 2) - matchedCount;
        remainSpan.textContent = leftPairs;
        streakSpan.textContent = streak;
        if (streak > record) { record = streak; recordSpan.textContent = record; }
        const percent = (matchedCount / (totalTiles / 2)) * 100;
        progressFill.style.width = percent + "%";
    }

    function isTileFree(tile, allTiles) {
        if (tile.removed) return false;
        // Проверяем, есть ли плитка сверху (в ряду выше, та же колонка)
        const above = allTiles.find(t => t.row === tile.row - 1 && t.col === tile.col && !t.removed);
        if (above) return false;
        // Проверяем, есть ли плитка слева в этом же ряду
        const left = allTiles.find(t => t.row === tile.row && t.col === tile.col - 1 && !t.removed);
        // Проверяем, есть ли плитка справа в этом же ряду
        const right = allTiles.find(t => t.row === tile.row && t.col === tile.col + 1 && !t.removed);
        // Если есть и слева, и справа — плитка зажата
        if (left && right) return false;
        return true;
    }

    function renderBoard() {
        boardEl.innerHTML = '';
        const rows = Math.max(...tiles.map(t => t.row)) + 1;
        const pyramidDiv = document.createElement('div');
        pyramidDiv.className = 'pyramid';
        for (let r = 0; r <= rows; r++) {
            const rowTiles = tiles.filter(t => t.row === r && !t.removed);
            if (rowTiles.length === 0 && r === rows) continue;
            const rowDiv = document.createElement('div');
            rowDiv.className = 'pyramid-row';
            // добавляем отступы для центрирования
            rowDiv.style.marginLeft = `${(rows - r) * 35}px`;
            for (let c = 0; c <= Math.max(...tiles.filter(t => t.row === r).map(t => t.col), 0); c++) {
                const tile = tiles.find(t => t.row === r && t.col === c);
                if (!tile || tile.removed) continue;
                const div = document.createElement('div');
                div.className = 'tile';
                const isFree = isTileFree(tile, tiles);
                if (!isFree) div.classList.add('blocked');
                if (selectedId === tile.id) div.classList.add('selected');
                div.innerHTML = `
                    <div class="main-char">${tile.char}</div>
                    <div class="pinyin-small">${tile.pinyin}</div>
                    <div class="info">${tile.name}</div>
                `;
                div.onclick = (function(t) { return () => onTileClick(t); })(tile);
                rowDiv.appendChild(div);
            }
            if (rowDiv.children.length > 0) pyramidDiv.appendChild(rowDiv);
        }
        boardEl.appendChild(pyramidDiv);
    }

    function onTileClick(clickedTile) {
        if (clickedTile.removed) return;
        if (!isTileFree(clickedTile, tiles)) {
            msgEl.innerHTML = "🔒 Эта плитка заблокирована! Сначала уберите те, что сверху или по бокам.";
            return;
        }
        if (selectedId === null) {
            selectedId = clickedTile.id;
            renderBoard();
            msgEl.innerHTML = `✅ Выбрано: ${clickedTile.char} (${clickedTile.name})`;
            return;
        }
        const selectedTile = tiles.find(t => t.id === selectedId);
        if (selectedTile.id === clickedTile.id) {
            selectedId = null;
            renderBoard();
            msgEl.innerHTML = "🔍 Выделение снято";
            return;
        }
        // Проверяем пару
        if (selectedTile.pairId === clickedTile.pairId && selectedTile.type !== clickedTile.type) {
            // Правильная пара
            selectedTile.removed = true;
            clickedTile.removed = true;
            matchedCount++;
            streak++;
            const points = 10 + Math.floor(streak / 2) * 2;
            score += points;
            updateUI();
            // Показываем обучающее окно с примерами радикала
            const radicalData = selectedTile.type === 'radical' ? selectedTile.radicalData : clickedTile.radicalData;
            if (radicalData) showExamples(radicalData);
            selectedId = null;
            renderBoard();
            msgEl.innerHTML = `✅ Верно! +${points} очков (серия ${streak})`;
            if (matchedCount === totalTiles / 2) {
                msgEl.innerHTML = "🏆 ПОБЕДА! Ты знаток всех 214 радикалов! 🏆";
                speakText("Поздравляю! Вы выиграли игру маджонг с радикалами!");
            }
        } else {
            streak = 0;
            updateUI();
            msgEl.innerHTML = `❌ Не пара! "${selectedTile.char}" не подходит к "${clickedTile.char}"`;
            selectedId = null;
            renderBoard();
        }
    }

    function buildPyramid() {
        // Берём 30 случайных радикалов для игры (чтобы пирамида не была огромной)
        const shuffled = [...ALL_RADICALS].sort(() => Math.random() - 0.5);
        const selectedRadicals = shuffled.slice(0, 24);
        const pairs = [];
        for (let i = 0; i < selectedRadicals.length; i++) {
            const rad = selectedRadicals[i];
            pairs.push({ word: rad, type: 'word', pairId: i });
            pairs.push({ word: rad, type: 'radical', pairId: i });
        }
        // Строим пирамиду (5 рядов)
        const newTiles = [];
        let idCounter = 0;
        const rowsConfig = [1, 2, 3, 4, 5];
        let pairIdx = 0;
        for (let r = 0; r < rowsConfig.length; r++) {
            for (let c = 0; c < rowsConfig[r]; c++) {
                if (pairIdx >= pairs.length) pairIdx = 0;
                const p = pairs[pairIdx];
                newTiles.push({
                    id: idCounter++,
                    row: r,
                    col: c,
                    char: p.word.char,
                    pinyin: p.word.pinyin,
                    name: p.word.name,
                    type: p.type,
                    pairId: p.pairId,
                    radicalData: p.word,
                    removed: false
                });
                pairIdx++;
            }
        }
        return newTiles;
    }

    function initGame() {
        tiles = buildPyramid();
        totalTiles = tiles.length;
        matchedCount = 0;
        score = 0;
        streak = 0;
        selectedId = null;
        updateUI();
        renderBoard();
        msgEl.innerHTML = "🏔️ Маджонг-пирамида! Соединяй только свободные плитки.";
    }

    function showHint() {
        for (let i = 0; i < tiles.length; i++) {
            if (tiles[i].removed) continue;
            if (!isTileFree(tiles[i], tiles)) continue;
            for (let j = i + 1; j < tiles.length; j++) {
                if (tiles[j].removed) continue;
                if (!isTileFree(tiles[j], tiles)) continue;
                if (tiles[i].pairId === tiles[j].pairId && tiles[i].type !== tiles[j].type) {
                    msgEl.innerHTML = `💡 Подсказка: "${tiles[i].char}" и "${tiles[j].char}" — это пара! Оба свободны.`;
                    return;
                }
            }
        }
        msgEl.innerHTML = "💡 Попробуй убрать верхние плитки, чтобы открыть нижние.";
    }

    document.getElementById('hintBtn').onclick = showHint;
    document.getElementById('resetGameBtn').onclick = initGame;
    initGame();
</script>
