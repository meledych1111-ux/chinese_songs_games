<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🀄️ МАДЖОНГ С РАДИКАЛАМИ | Классическая пирамида</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: linear-gradient(145deg, #1a3a2a 0%, #0a1a0f 100%);
            min-height: 100vh;
            font-family: system-ui, 'Segoe UI', 'PingFang SC', sans-serif;
            padding: 20px;
        }
        .game-container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(30, 25, 20, 0.6);
            border-radius: 48px;
            padding: 24px;
        }
        h1 {
            text-align: center;
            font-size: 1.8rem;
            color: #f7e05e;
        }
        .sub {
            text-align: center;
            color: #d4c9a6;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #2c2118;
            padding: 12px 24px;
            border-radius: 60px;
            margin-bottom: 20px;
            color: #ffecb3;
            font-weight: bold;
            font-size: 1rem;
            flex-wrap: wrap;
            gap: 12px;
        }
        .stats-bar span {
            background: #00000066;
            padding: 6px 18px;
            border-radius: 40px;
        }
        .level-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        .level-btn {
            background: #4a3729;
            color: #d4c9a6;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
        }
        .level-btn.active {
            background: linear-gradient(135deg, #f7b42c, #fc8e2c);
            color: #2c1a0c;
        }
        .game-board {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            overflow-x: auto;
            min-height: 500px;
        }
        .pyramid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .pyramid-row {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .tile {
            background: #fff8e7;
            background-image: radial-gradient(circle at 25% 35%, rgba(255,245,200,0.6) 2%, transparent 2.5%);
            background-size: 25px 25px;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.1s;
            border: 3px solid #c8aa6e;
            box-shadow: 0 6px 0 #8b6946;
            min-width: 110px;
            padding: 14px 6px;
        }
        .tile.selected {
            background: #ffe6b3;
            border: 3px solid #f5b042;
            transform: scale(0.96);
            box-shadow: 0 3px 0 #8b6946;
        }
        .tile.blocked {
            opacity: 0.4;
            filter: grayscale(0.3);
            cursor: not-allowed;
        }
        .tile.removed {
            display: none;
        }
        .tile .main-char {
            font-size: 48px;
            font-weight: 800;
            color: #3c2a1f;
        }
        .tile .pinyin {
            font-size: 12px;
            color: #b34e1a;
            margin-top: 6px;
        }
        .tile .info {
            font-size: 10px;
            margin-top: 4px;
            color: #7a5a3a;
            background: #f3e5c9;
            display: inline-block;
            padding: 2px 10px;
            border-radius: 40px;
        }
        .message-area {
            background: #261d14e6;
            border-radius: 60px;
            padding: 14px 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
            margin: 20px 0;
            color: #f7e6c4;
        }
        .ctrl-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        button {
            background: linear-gradient(135deg, #f7b42c, #fc8e2c);
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 60px;
            color: #2c1a0c;
            cursor: pointer;
            box-shadow: 0 4px 0 #9b5e1c;
        }
        button:active { transform: translateY(2px); }
        .reset-btn { background: linear-gradient(135deg, #4b6a3b, #2d5a2a); color: #f9e7b3; }
        .hint-btn { background: linear-gradient(135deg, #3a6b8a, #2a4a6a); color: white; }
        .shuffle-btn { background: linear-gradient(135deg, #8e44ad, #6c3483); color: white; }
        .progress-bar {
            background: #4a3729;
            border-radius: 30px;
            height: 10px;
            margin: 15px 0;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, #f7b42c, #f5a623);
            width: 0%;
            height: 100%;
            transition: width 0.3s;
        }
        .example-popup {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e2a1aee;
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 16px 24px;
            max-width: 90%;
            z-index: 1000;
            border: 2px solid #f7b42c;
            text-align: center;
            color: #fef0cf;
            font-size: 13px;
        }
        .example-popup .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 12px;
        }
        .example-item {
            background: #3c2a1f;
            border-radius: 16px;
            padding: 8px 14px;
            text-align: center;
            cursor: pointer;
        }
        .example-item:active { transform: scale(0.95); }
        .example-item .ex-char { font-size: 28px; font-weight: bold; }
        @media (max-width: 800px) {
            .tile { min-width: 90px; padding: 10px 4px; }
            .tile .main-char { font-size: 38px; }
        }
        @media (max-width: 600px) {
            .tile { min-width: 75px; padding: 8px 3px; }
            .tile .main-char { font-size: 30px; }
            .tile .pinyin { font-size: 9px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>🀄️ МАДЖОНГ С РАДИКАЛАМИ</h1>
    <div class="sub">🔗 Соедини КЛЮЧ и СЛОВО | Только свободные плитки</div>

    <div class="level-bar" id="levelBar">
        <div class="level-btn" data-level="1">🌟 Уровень 1 (2 ряда)</div>
        <div class="level-btn" data-level="2">⭐ Уровень 2 (3 ряда)</div>
        <div class="level-btn" data-level="3" class="active">🏆 Уровень 3 (4 ряда)</div>
        <div class="level-btn" data-level="4">🔥 Уровень 4 (5 рядов)</div>
        <div class="level-btn" data-level="5">💎 Уровень 5 (6 рядов)</div>
    </div>

    <div class="stats-bar">
        <span>🎯 Счёт: <span id="scoreValue">0</span></span>
        <span>🧩 Осталось: <span id="remainValue">0</span></span>
        <span>🔥 Серия: <span id="streakValue">0</span></span>
        <span>🏆 Рекорд: <span id="recordValue">0</span></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

    <div class="game-board" id="gameBoard"></div>

    <div class="message-area" id="gameMessage">🌟 Нажми на свободную плитку, затем на её пару</div>

    <div class="ctrl-buttons">
        <button id="hintBtn" class="hint-btn">💡 Подсказка</button>
        <button id="shuffleBtn" class="shuffle-btn">🔄 Перемешать</button>
        <button id="resetGameBtn" class="reset-btn">🆕 Новая игра</button>
    </div>
</div>

<script>
    // ==================== РАДИКАЛЫ (ключ + слово = пара) ====================
    const PAIRS_DATA = [
        { key: "口", keyPinyin: "kǒu", keyName: "рот", word: "吃", wordPinyin: "chī", wordName: "есть", examples: [{c:"喝",p:"hē",m:"пить"},{c:"叫",p:"jiào",m:"кричать"}] },
        { key: "水", keyPinyin: "shuǐ", keyName: "вода", word: "河", wordPinyin: "hé", wordName: "река", examples: [{c:"海",p:"hǎi",m:"море"},{c:"洗",p:"xǐ",m:"мыть"}] },
        { key: "火", keyPinyin: "huǒ", keyName: "огонь", word: "烧", wordPinyin: "shāo", wordName: "жечь", examples: [{c:"炒",p:"chǎo",m:"жарить"},{c:"烟",p:"yān",m:"дым"}] },
        { key: "木", keyPinyin: "mù", keyName: "дерево", word: "树", wordPinyin: "shù", wordName: "дерево", examples: [{c:"林",p:"lín",m:"лес"},{c:"桌",p:"zhuō",m:"стол"}] },
        { key: "手", keyPinyin: "shǒu", keyName: "рука", word: "打", wordPinyin: "dǎ", wordName: "бить", examples: [{c:"拿",p:"ná",m:"брать"},{c:"找",p:"zhǎo",m:"искать"}] },
        { key: "心", keyPinyin: "xīn", keyName: "сердце", word: "想", wordPinyin: "xiǎng", wordName: "думать", examples: [{c:"忘",p:"wàng",m:"забывать"},{c:"忙",p:"máng",m:"занятой"}] },
        { key: "日", keyPinyin: "rì", keyName: "солнце", word: "时", wordPinyin: "shí", wordName: "время", examples: [{c:"明",p:"míng",m:"яркий"},{c:"暖",p:"nuǎn",m:"тёплый"}] },
        { key: "月", keyPinyin: "yuè", keyName: "луна", word: "期", wordPinyin: "qī", wordName: "период", examples: [{c:"有",p:"yǒu",m:"иметь"},{c:"朋",p:"péng",m:"друг"}] },
        { key: "女", keyPinyin: "nǚ", keyName: "женщина", word: "妈", wordPinyin: "mā", wordName: "мама", examples: [{c:"姐",p:"jiě",m:"сестра"},{c:"好",p:"hǎo",m:"хорошо"}] },
        { key: "人", keyPinyin: "rén", keyName: "человек", word: "你", wordPinyin: "nǐ", wordName: "ты", examples: [{c:"他",p:"tā",m:"он"},{c:"们",p:"men",m:"мн.ч."}] },
        { key: "金", keyPinyin: "jīn", keyName: "золото", word: "钱", wordPinyin: "qián", wordName: "деньги", examples: [{c:"银",p:"yín",m:"серебро"},{c:"针",p:"zhēn",m:"игла"}] },
        { key: "土", keyPinyin: "tǔ", keyName: "земля", word: "地", wordPinyin: "dì", wordName: "земля", examples: [{c:"城",p:"chéng",m:"город"},{c:"坏",p:"huài",m:"плохой"}] },
        { key: "山", keyPinyin: "shān", keyName: "гора", word: "峰", wordPinyin: "fēng", wordName: "вершина", examples: [{c:"岛",p:"dǎo",m:"остров"},{c:"岁",p:"suì",m:"возраст"}] },
        { key: "田", keyPinyin: "tián", keyName: "поле", word: "男", wordPinyin: "nán", wordName: "мужчина", examples: [{c:"留",p:"liú",m:"оставлять"},{c:"累",p:"lèi",m:"уставать"}] },
        { key: "目", keyPinyin: "mù", keyName: "глаз", word: "看", wordPinyin: "kàn", wordName: "смотреть", examples: [{c:"眼",p:"yǎn",m:"глаз"},{c:"睡",p:"shuì",m:"спать"}] },
        { key: "耳", keyPinyin: "ěr", keyName: "ухо", word: "听", wordPinyin: "tīng", wordName: "слушать", examples: [{c:"闻",p:"wén",m:"слышать"}] },
        { key: "足", keyPinyin: "zú", keyName: "нога", word: "跑", wordPinyin: "pǎo", wordName: "бежать", examples: [{c:"跳",p:"tiào",m:"прыгать"},{c:"踢",p:"tī",m:"пинать"}] }
    ];

    let currentLevel = 3;
    let tiles = [];
    let selectedId = null;
    let matchedCount = 0;
    let totalPairs = 0;
    let score = 0;
    let streak = 0;
    let record = 0;

    // Конфигурация уровней (количество рядов в пирамиде)
    const LEVEL_CONFIG = {
        1: { rows: [1, 2], pairsCount: 3 },
        2: { rows: [1, 2, 3], pairsCount: 6 },
        3: { rows: [1, 2, 3, 4], pairsCount: 10 },
        4: { rows: [1, 2, 3, 4, 5], pairsCount: 15 },
        5: { rows: [1, 2, 3, 4, 5, 6], pairsCount: 21 }
    };

    const scoreSpan = document.getElementById('scoreValue');
    const remainSpan = document.getElementById('remainValue');
    const streakSpan = document.getElementById('streakValue');
    const recordSpan = document.getElementById('recordValue');
    const progressFill = document.getElementById('progressFill');
    const msgEl = document.getElementById('gameMessage');
    const boardEl = document.getElementById('gameBoard');

    function speakText(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "zh-CN";
        u.rate = 0.8;
        window.speechSynthesis.speak(u);
    }

    function showExamples(pair) {
        const examples = pair.examples || [];
        if (examples.length === 0) {
            speakText(pair.key);
            return;
        }
        const popup = document.createElement('div');
        popup.className = 'example-popup';
        popup.innerHTML = `
            <div>📚 <strong>${pair.key} (${pair.keyPinyin})</strong> — ${pair.keyName}</div>
            <div class="examples">
                ${examples.map(ex => `<div class="example-item" onclick="speakText('${ex.c}')"><div class="ex-char">${ex.c}</div><div>${ex.p} — ${ex.m}</div></div>`).join('')}
                <div class="example-item" onclick="speakText('${pair.word}')"><div class="ex-char">${pair.word}</div><div>${pair.wordPinyin} — ${pair.wordName}</div></div>
            </div>
            <div style="font-size:10px; margin-top:8px;">✨ Нажми на слово, чтобы услышать</div>
        `;
        document.body.appendChild(popup);
        setTimeout(() => popup.remove(), 6000);
        speakText(pair.key);
    }

    // Проверка: свободна ли плитка (классическое правило: нет плитки сверху)
    function isTileFree(tile, allTiles) {
        if (tile.removed) return false;
        // Проверяем плитку сверху (в ряду выше, та же позиция)
        const above = allTiles.find(t => t.row === tile.row - 1 && Math.abs(t.col - tile.col) <= 1 && !t.removed);
        return !above;
    }

    // Проверка: есть ли доступные ходы
    function hasAvailableMoves() {
        for (let i = 0; i < tiles.length; i++) {
            if (tiles[i].removed) continue;
            if (!isTileFree(tiles[i], tiles)) continue;
            for (let j = i + 1; j < tiles.length; j++) {
                if (tiles[j].removed) continue;
                if (!isTileFree(tiles[j], tiles)) continue;
                if (tiles[i].pairId === tiles[j].pairId && tiles[i].type !== tiles[j].type) {
                    return true;
                }
            }
        }
        return false;
    }

    function renderBoard() {
        if (!boardEl) return;
        boardEl.innerHTML = '';
        const maxRow = Math.max(...tiles.map(t => t.row));
        const pyramidDiv = document.createElement('div');
        pyramidDiv.className = 'pyramid';
        
        for (let r = 0; r <= maxRow; r++) {
            const rowTiles = tiles.filter(t => t.row === r && !t.removed);
            if (rowTiles.length === 0) continue;
            const rowDiv = document.createElement('div');
            rowDiv.className = 'pyramid-row';
            rowDiv.style.marginLeft = `${(maxRow - r) * 35}px`;
            
            const maxCol = Math.max(...tiles.filter(t => t.row === r).map(t => t.col));
            for (let c = 0; c <= maxCol; c++) {
                const tile = tiles.find(t => t.row === r && t.col === c);
                if (!tile || tile.removed) continue;
                const div = document.createElement('div');
                div.className = 'tile';
                const free = isTileFree(tile, tiles);
                if (!free) div.classList.add('blocked');
                if (selectedId === tile.id) div.classList.add('selected');
                div.innerHTML = `
                    <div class="main-char">${tile.char}</div>
                    <div class="pinyin">${tile.pinyin}</div>
                    <div class="info">${tile.name}</div>
                `;
                div.onclick = (function(t) { return function() { onTileClick(t); }; })(tile);
                rowDiv.appendChild(div);
            }
            if (rowDiv.children.length > 0) pyramidDiv.appendChild(rowDiv);
        }
        boardEl.appendChild(pyramidDiv);
        
        // Проверяем, есть ли доступные ходы
        if (!hasAvailableMoves() && matchedCount < totalPairs) {
            msgEl.innerHTML = "⚠️ Нет доступных ходов! Нажми 'Перемешать' чтобы продолжить.";
        }
    }

    function onTileClick(clickedTile) {
        if (clickedTile.removed) return;
        if (!isTileFree(clickedTile, tiles)) {
            msgEl.innerHTML = "🔒 Эта плитка заблокирована! Сначала уберите ту, что сверху.";
            return;
        }
        if (selectedId === null) {
            selectedId = clickedTile.id;
            renderBoard();
            msgEl.innerHTML = `✅ Выбрано: ${clickedTile.char} (${clickedTile.name})`;
            return;
        }
        const selectedTile = tiles.find(t => t.id === selectedId);
        if (selectedTile.id === clickedTile.id) {
            selectedId = null;
            renderBoard();
            msgEl.innerHTML = "🔍 Выделение снято";
            return;
        }
        // Проверяем пару: одинаковый pairId и разные типы (ключ+слово)
        if (selectedTile.pairId === clickedTile.pairId && selectedTile.type !== clickedTile.type) {
            selectedTile.removed = true;
            clickedTile.removed = true;
            matchedCount++;
            streak++;
            const points = 10 + Math.floor(streak / 2) * 2;
            score += points;
            if (streak > record) record = streak;
            updateUI();
            
            const pair = PAIRS_DATA[selectedTile.pairId];
            if (pair) showExamples(pair);
            
            selectedId = null;
            renderBoard();
            msgEl.innerHTML = `✅ Верно! +${points} очков (серия ${streak})`;
            
            if (matchedCount === totalPairs) {
                msgEl.innerHTML = `🏆 ПОБЕДА! Уровень ${currentLevel} пройден! Нажми следующий уровень. 🏆`;
                speakText("Поздравляю! Уровень пройден!");
            }
        } else {
            streak = 0;
            updateUI();
            msgEl.innerHTML = `❌ Не пара! "${selectedTile.char}" ≠ "${clickedTile.char}"`;
            selectedId = null;
            renderBoard();
        }
    }

    function updateUI() {
        scoreSpan.textContent = score;
        remainSpan.textContent = totalPairs - matchedCount;
        streakSpan.textContent = streak;
        recordSpan.textContent = record;
        progressFill.style.width = ((matchedCount / totalPairs) * 100) + "%";
    }

    function shuffleRemaining() {
        const remaining = tiles.filter(t => !t.removed);
        if (remaining.length === 0) {
            initGame(currentLevel);
            return;
        }
        // Перемешиваем только оставшиеся плитки, сохраняя их позиции
        const remainingPairs = [];
        for (let i = 0; i < remaining.length; i++) {
            const tile = remaining[i];
            remainingPairs.push({
                pairId: tile.pairId,
                type: tile.type,
                char: tile.char,
                pinyin: tile.pinyin,
                name: tile.name
            });
        }
        // Перемешиваем
        for (let i = remainingPairs.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [remainingPairs[i], remainingPairs[j]] = [remainingPairs[j], remainingPairs[i]];
        }
        // Обновляем плитки
        let idx = 0;
        for (let i = 0; i < tiles.length; i++) {
            if (!tiles[i].removed) {
                tiles[i].pairId = remainingPairs[idx].pairId;
                tiles[i].type = remainingPairs[idx].type;
                tiles[i].char = remainingPairs[idx].char;
                tiles[i].pinyin = remainingPairs[idx].pinyin;
                tiles[i].name = remainingPairs[idx].name;
                idx++;
            }
        }
        selectedId = null;
        renderBoard();
        msgEl.innerHTML = "🃏 Оставшиеся плитки перемешаны! Продолжай игру.";
    }

    function initGame(level) {
        currentLevel = level;
        const config = LEVEL_CONFIG[level];
        const totalPairsNeeded = config.pairsCount;
        
        // Берём нужное количество пар
        const selectedPairs = [];
        for (let i = 0; i < totalPairsNeeded; i++) {
            selectedPairs.push(PAIRS_DATA[i % PAIRS_DATA.length]);
        }
        
        totalPairs = selectedPairs.length;
        matchedCount = 0;
        score = 0;
        streak = 0;
        selectedId = null;
        
        // Строим пирамиду
        tiles = [];
        let idCounter = 0;
        const rows = config.rows;
        
        // Создаём список всех плиток (каждая пара даёт ключ и слово)
        let allTilesList = [];
        for (let i = 0; i < selectedPairs.length; i++) {
            const pair = selectedPairs[i];
            allTilesList.push({
                pairId: i,
                type: 'key',
                char: pair.key,
                pinyin: pair.keyPinyin,
                name: pair.keyName
            });
            allTilesList.push({
                pairId: i,
                type: 'word',
                char: pair.word,
                pinyin: pair.wordPinyin,
                name: pair.wordName
            });
        }
        
        // Перемешиваем
        for (let i = allTilesList.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [allTilesList[i], allTilesList[j]] = [allTilesList[j], allTilesList[i]];
        }
        
        // Раскладываем по рядам
        let tileIdx = 0;
        for (let r = 0; r < rows.length; r++) {
            const rowSize = rows[r];
            for (let c = 0; c < rowSize; c++) {
                if (tileIdx >= allTilesList.length) break;
                const tileData = allTilesList[tileIdx];
                tiles.push({
                    id: idCounter++,
                    row: r,
                    col: c,
                    pairId: tileData.pairId,
                    type: tileData.type,
                    char: tileData.char,
                    pinyin: tileData.pinyin,
                    name: tileData.name,
                    removed: false
                });
                tileIdx++;
            }
        }
        
        updateUI();
        renderBoard();
        msgEl.innerHTML = `🏔️ Уровень ${level} (${rows.length} рядов, ${totalPairs} пар). Соединяй ключи со словами!`;
    }

    function showHint() {
        for (let i = 0; i < tiles.length; i++) {
            if (tiles[i].removed) continue;
            if (!isTileFree(tiles[i], tiles)) continue;
            for (let j = i + 1; j < tiles.length; j++) {
                if (tiles[j].removed) continue;
                if (!isTileFree(tiles[j], tiles)) continue;
                if (tiles[i].pairId === tiles[j].pairId && tiles[i].type !== tiles[j].type) {
                    msgEl.innerHTML = `💡 Подсказка: "${tiles[i].char}" и "${tiles[j].char}" — это пара! Оба свободны.`;
                    return;
                }
            }
        }
        if (hasAvailableMoves()) {
            msgEl.innerHTML = "💡 Осмотрись внимательно! Есть доступные пары.";
        } else {
            msgEl.innerHTML = "💡 Нет доступных ходов! Нажми 'Перемешать'.";
        }
    }

    // Обработчики уровней
    document.querySelectorAll('.level-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const level = parseInt(btn.dataset.level);
            initGame(level);
        };
    });

    document.getElementById('hintBtn').onclick = showHint;
    document.getElementById('shuffleBtn').onclick = shuffleRemaining;
    document.getElementById('resetGameBtn').onclick = () => initGame(currentLevel);
    
    // Запуск
    initGame(3);
</script>
</body>
</html>
