<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🀄️ МАДЖОНГ С РАДИКАЛАМИ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: linear-gradient(145deg, #1e3c2c 0%, #0a2a1a 100%);
            min-height: 100vh;
            font-family: system-ui, 'Segoe UI', sans-serif;
            padding: 20px;
        }
        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(30, 20, 15, 0.6);
            border-radius: 48px;
            padding: 20px;
        }
        h1 {
            text-align: center;
            font-size: 1.8rem;
            color: #f7e05e;
            margin-bottom: 8px;
        }
        .sub {
            text-align: center;
            color: #d4c9a6;
            margin-bottom: 20px;
        }
        .score-board {
            display: flex;
            justify-content: space-between;
            background: #2c2118;
            padding: 12px 24px;
            border-radius: 60px;
            margin-bottom: 25px;
            color: #ffecb3;
            font-weight: bold;
            font-size: 1.2rem;
            flex-wrap: wrap;
        }
        .score-board span {
            background: #00000066;
            padding: 6px 18px;
            border-radius: 40px;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin: 20px 0;
            background: #4a3729;
            padding: 24px;
            border-radius: 48px;
            min-height: 400px;
        }
        .tile {
            background: #fff8e7;
            border-radius: 20px;
            padding: 20px 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.1s;
            border: 2px solid #c8aa6e;
            box-shadow: 0 7px 0 #8b6946;
        }
        .tile.selected {
            background: #ffe6b3;
            border: 3px solid #f5b042;
            transform: scale(0.97);
        }
        .tile .main-char {
            font-size: 52px;
            font-weight: 800;
            color: #3c2a1f;
        }
        .tile .info {
            font-size: 12px;
            margin-top: 8px;
            color: #7a5a3a;
            font-weight: 600;
            background: #f3e5c9;
            display: inline-block;
            padding: 3px 12px;
            border-radius: 40px;
        }
        .message-area {
            background: #261d14e6;
            border-radius: 60px;
            padding: 12px 20px;
            text-align: center;
            font-weight: bold;
            margin: 15px 0;
            color: #f7e6c4;
        }
        .ctrl-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        button {
            background: linear-gradient(135deg, #f7b42c, #fc8e2c);
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 60px;
            color: #2c1a0c;
            cursor: pointer;
            box-shadow: 0 4px 0 #9b5e1c;
        }
        button:active {
            transform: translateY(2px);
        }
        .reset-btn {
            background: linear-gradient(135deg, #4b6a3b, #2d5a2a);
            color: #f9e7b3;
        }
        @media (max-width: 650px) {
            .game-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 16px; }
            .tile .main-char { font-size: 38px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>🀄️ МАДЖОНГ С РАДИКАЛАМИ</h1>
    <div class="sub">🔤 Найди пару: иероглиф ⟷ радикал</div>

    <div class="score-board">
        <span>🎯 Счёт: <span id="scoreValue">0</span></span>
        <span>🧩 Осталось: <span id="remainValue">0</span></span>
        <span>🔥 Серия: <span id="streakValue">0</span></span>
    </div>

    <div class="game-grid" id="gameGrid"></div>

    <div class="message-area" id="gameMessage">
        🌟 Нажми на карточку, затем на её пару
    </div>

    <div class="ctrl-buttons">
        <button id="shuffleBtn">♻️ Перемешать</button>
        <button id="resetGameBtn" class="reset-btn">🔄 Новая игра</button>
    </div>
</div>

<script>
    // ==================== ГОТОВЫЕ ПАРЫ (СЛОВО + РАДИКАЛ) ====================
    const PAIRS = [
        { word: "水", wordM: "вода", radical: "氵", radicalM: "вода" },
        { word: "火", wordM: "огонь", radical: "火", radicalM: "огонь" },
        { word: "木", wordM: "дерево", radical: "木", radicalM: "дерево" },
        { word: "口", wordM: "рот", radical: "口", radicalM: "рот" },
        { word: "手", wordM: "рука", radical: "扌", radicalM: "рука" },
        { word: "心", wordM: "сердце", radical: "忄", radicalM: "сердце" },
        { word: "日", wordM: "солнце", radical: "日", radicalM: "день" },
        { word: "月", wordM: "луна", radical: "月", radicalM: "луна" },
        { word: "女", wordM: "женщина", radical: "女", radicalM: "женщина" },
        { word: "子", wordM: "ребёнок", radical: "子", radicalM: "ребёнок" },
        { word: "田", wordM: "поле", radical: "田", radicalM: "поле" },
        { word: "山", wordM: "гора", radical: "山", radicalM: "гора" },
        { word: "人", wordM: "человек", radical: "亻", radicalM: "человек" },
        { word: "言", wordM: "речь", radical: "讠", radicalM: "речь" },
        { word: "金", wordM: "золото", radical: "钅", radicalM: "металл" },
        { word: "土", wordM: "земля", radical: "土", radicalM: "земля" },
        { word: "力", wordM: "сила", radical: "力", radicalM: "сила" },
        { word: "刀", wordM: "нож", radical: "刂", radicalM: "нож" },
        { word: "车", wordM: "машина", radical: "车", radicalM: "машина" },
        { word: "马", wordM: "лошадь", radical: "马", radicalM: "лошадь" },
        { word: "鸟", wordM: "птица", radical: "鸟", radicalM: "птица" },
        { word: "鱼", wordM: "рыба", radical: "鱼", radicalM: "рыба" },
        { word: "虫", wordM: "насекомое", radical: "虫", radicalM: "насекомое" },
        { word: "雨", wordM: "дождь", radical: "雨", radicalM: "дождь" },
        { word: "门", wordM: "дверь", radical: "门", radicalM: "дверь" },
        { word: "石", wordM: "камень", radical: "石", radicalM: "камень" },
        { word: "目", wordM: "глаз", radical: "目", radicalM: "глаз" },
        { word: "耳", wordM: "ухо", radical: "耳", radicalM: "ухо" },
        { word: "足", wordM: "нога", radical: "足", radicalM: "нога" },
        { word: "走", wordM: "идти", radical: "走", radicalM: "ходить" },
        { word: "食", wordM: "еда", radical: "饣", radicalM: "еда" },
        { word: "衣", wordM: "одежда", radical: "衤", radicalM: "одежда" }
    ];

    // ==================== ПЕРЕМЕННЫЕ ====================
    let gameCards = [];
    let selectedIndex = null;
    let matchedCount = 0;
    let totalPairs = 0;
    let score = 0;
    let streak = 0;
    
    // DOM элементы
    const gridEl = document.getElementById('gameGrid');
    const scoreSpan = document.getElementById('scoreValue');
    const remainSpan = document.getElementById('remainValue');
    const streakSpan = document.getElementById('streakValue');
    const msgEl = document.getElementById('gameMessage');
    
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }
    
    function updateUI() {
        scoreSpan.textContent = score;
        remainSpan.textContent = totalPairs - matchedCount;
        streakSpan.textContent = streak;
    }
    
    function render() {
        gridEl.innerHTML = '';
        for (let i = 0; i < gameCards.length; i++) {
            const card = gameCards[i];
            if (card.matched) continue;
            
            const tile = document.createElement('div');
            tile.className = 'tile';
            if (selectedIndex === i) tile.classList.add('selected');
            
            tile.innerHTML = `
                <div class="main-char">${card.char}</div>
                <div class="info">${card.info}</div>
            `;
            
            tile.onclick = (function(idx) {
                return function() { onCardClick(idx); };
            })(i);
            
            gridEl.appendChild(tile);
        }
    }
    
    function onCardClick(clickedIndex) {
        if (matchedCount === totalPairs) {
            msgEl.innerHTML = "🏆 ПОБЕДА! Нажми 'Новая игра'";
            return;
        }
        
        if (selectedIndex === null) {
            // Первая карточка
            selectedIndex = clickedIndex;
            render();
            msgEl.innerHTML = `✅ Выбрано: ${gameCards[clickedIndex].char} (${gameCards[clickedIndex].info})`;
        } else if (selectedIndex === clickedIndex) {
            // Снять выделение
            selectedIndex = null;
            render();
            msgEl.innerHTML = "🔍 Выделение снято";
        } else {
            // Проверяем пару
            const card1 = gameCards[selectedIndex];
            const card2 = gameCards[clickedIndex];
            
            if (card1.pairId === card2.pairId && card1.type !== card2.type) {
                // Правильная пара!
                card1.matched = true;
                card2.matched = true;
                matchedCount++;
                streak++;
                score += 10 + Math.floor(streak / 2) * 2;
                updateUI();
                msgEl.innerHTML = `✅ Правильно! +${10 + Math.floor(streak / 2) * 2} очков (серия ${streak})`;
                selectedIndex = null;
                render();
                
                if (matchedCount === totalPairs) {
                    msgEl.innerHTML = "🎉 ПОБЕДА! Ты знаток радикалов! 🎉";
                }
            } else {
                // Неправильная пара
                streak = 0;
                updateUI();
                msgEl.innerHTML = `❌ Не пара! "${card1.char}" не подходит к "${card2.char}"`;
                selectedIndex = null;
                render();
            }
        }
    }
    
    function initGame(selectedPairs) {
        totalPairs = selectedPairs.length;
        matchedCount = 0;
        score = 0;
        streak = 0;
        selectedIndex = null;
        
        gameCards = [];
        for (let i = 0; i < selectedPairs.length; i++) {
            const p = selectedPairs[i];
            // Карточка слова
            gameCards.push({
                id: `w_${i}`,
                type: 'word',
                char: p.word,
                info: p.wordM,
                pairId: i,
                matched: false
            });
            // Карточка радикала
            gameCards.push({
                id: `r_${i}`,
                type: 'radical',
                char: p.radical,
                info: p.radicalM,
                pairId: i,
                matched: false
            });
        }
        
        gameCards = shuffleArray(gameCards);
        updateUI();
        render();
        msgEl.innerHTML = `🎋 Игра началась! Найди ${totalPairs} пар слов с их радикалами!`;
    }
    
    function startNewGame() {
        // Берём случайные 12 пар для разнообразия
        const shuffledPairs = shuffleArray([...PAIRS]);
        const selectedPairs = shuffledPairs.slice(0, 16);
        initGame(selectedPairs);
    }
    
    function shuffleGame() {
        if (matchedCount === totalPairs) {
            startNewGame();
            return;
        }
        // Перемешиваем только активные карточки
        const activeCards = gameCards.filter(c => !c.matched);
        const matchedCards = gameCards.filter(c => c.matched);
        gameCards = shuffleArray([...activeCards, ...matchedCards]);
        selectedIndex = null;
        render();
        msgEl.innerHTML = "🃏 Колода перемешана! Продолжай искать пары.";
    }
    
    // Кнопки
    document.getElementById('shuffleBtn').onclick = shuffleGame;
    document.getElementById('resetGameBtn').onclick = startNewGame;
    
    // Запуск
    startNewGame();
</script>
</body>
</html>
