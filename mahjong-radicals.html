<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🀄️ МАДЖОНГ | 214 РАДИКАЛОВ | ПОЛНАЯ ВЕРСИЯ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: linear-gradient(145deg, #1a3a2a 0%, #0a1a0f 100%); min-height: 100vh; font-family: system-ui, 'Segoe UI', 'PingFang SC', sans-serif; padding: 12px; }
        .game-container { max-width: 1600px; margin: 0 auto; background: rgba(30, 25, 20, 0.6); border-radius: 48px; padding: 16px; }
        h1 { text-align: center; font-size: 1.5rem; color: #f7e05e; margin-bottom: 4px; }
        .sub { text-align: center; color: #d4c9a6; margin-bottom: 12px; font-size: 0.7rem; }
        .level-bar-wrapper { overflow-x: auto; white-space: nowrap; margin-bottom: 12px; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
        .level-bar { display: inline-flex; gap: 6px; padding: 0 4px; }
        .level-btn { background: #4a3729; color: #d4c9a6; padding: 5px 12px; border-radius: 40px; cursor: pointer; font-weight: bold; font-size: 0.7rem; white-space: nowrap; transition: 0.1s; }
        .level-btn.active { background: linear-gradient(135deg, #f7b42c, #fc8e2c); color: #2c1a0c; }
        .stats-bar { display: flex; justify-content: space-between; background: #2c2118; padding: 6px 12px; border-radius: 60px; margin-bottom: 12px; color: #ffecb3; font-weight: bold; font-size: 0.75rem; flex-wrap: wrap; gap: 6px; }
        .stats-bar span { background: #00000066; padding: 3px 10px; border-radius: 40px; }
        .game-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; background: #4a3729; padding: 20px; border-radius: 40px; margin: 12px 0; max-height: 60vh; min-height: 420px; overflow-y: auto; }
        .tile { background: #fff8e7; background-image: radial-gradient(circle at 25% 35%, rgba(255,245,200,0.6) 2%, transparent 2.5%); background-size: 25px 25px; border-radius: 18px; text-align: center; cursor: pointer; transition: all 0.1s; border: 3px solid #c8aa6e; box-shadow: 0 6px 0 #8b6946; padding: 14px 6px; }
        .tile.selected { background: #ffe6b3; border: 3px solid #f5b042; transform: scale(0.96); box-shadow: 0 3px 0 #8b6946; }
        .tile.removed { display: none; }
        .tile .main-char { font-size: 52px; font-weight: 800; color: #3c2a1f; }
        .tile .pinyin { font-size: 12px; color: #b34e1a; margin-top: 6px; }
        .tile .info { font-size: 10px; margin-top: 4px; color: #7a5a3a; background: #f3e5c9; display: inline-block; padding: 2px 10px; border-radius: 40px; }
        .message-area { background: #261d14e6; border-radius: 60px; padding: 8px 16px; text-align: center; font-weight: bold; font-size: 0.8rem; margin: 10px 0; color: #f7e6c4; }
        .ctrl-buttons { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
        button { background: linear-gradient(135deg, #f7b42c, #fc8e2c); border: none; padding: 8px 20px; font-size: 0.8rem; font-weight: bold; border-radius: 60px; color: #2c1a0c; cursor: pointer; box-shadow: 0 3px 0 #9b5e1c; transition: 0.05s linear; }
        button:active { transform: translateY(2px); }
        .reset-btn { background: linear-gradient(135deg, #4b6a3b, #2d5a2a); color: #f9e7b3; }
        .hint-btn { background: linear-gradient(135deg, #3a6b8a, #2a4a6a); color: white; }
        .shuffle-btn { background: linear-gradient(135deg, #8e44ad, #6c3483); color: white; }
        .progress-bar { background: #4a3729; border-radius: 30px; height: 6px; margin: 8px 0; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #f7b42c, #f5a623); width: 0%; height: 100%; transition: width 0.3s; }
        .learn-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 16px; }
        .learn-card { background: linear-gradient(145deg, #fff8e7, #f5e6c8); border-radius: 40px; padding: 20px; max-width: 650px; width: 100%; text-align: center; border: 4px solid #f7b42c; max-height: 90vh; overflow-y: auto; }
        .learn-card .radical-big { font-size: 70px; font-weight: 800; color: #b34e1a; background: #fff0d0; display: inline-block; padding: 5px 25px; border-radius: 60px; margin-bottom: 10px; }
        .learn-card .radical-name { font-size: 20px; font-weight: bold; }
        .learn-card .radical-pinyin { font-size: 16px; color: #8e44ad; margin-bottom: 15px; }
        .draw-section { background: #4a3729; border-radius: 28px; padding: 15px; margin: 15px 0; }
        .draw-canvas-container { background: white; border-radius: 20px; padding: 10px; margin-bottom: 12px; }
        .draw-canvas { background: white; border-radius: 16px; display: block; margin: 0 auto; border: 3px solid #c8aa6e; cursor: crosshair; width: 100%; height: auto; aspect-ratio: 1 / 1; }
        .draw-tools { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 12px 0; }
        .draw-tools button { background: linear-gradient(135deg, #4b6a3b, #2d5a2a); padding: 6px 14px; font-size: 0.75rem; box-shadow: 0 3px 0 #1e3a1a; }
        .draw-tools .clear-draw { background: linear-gradient(135deg, #c0392b, #e74c3c); }
        .weight-control { display: flex; align-items: center; gap: 10px; justify-content: center; margin-top: 10px; }
        .weight-control span { font-size: 11px; color: #d4c9a6; }
        input[type="range"] { width: 120px; cursor: pointer; }
        .stroke-num { background: #2c2118; padding: 6px 14px; border-radius: 40px; color: #f7e05e; font-weight: bold; font-size: 0.8rem; display: inline-block; margin-bottom: 10px; }
        .examples-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 15px 0; }
        .example-word { background: #3c2a1f; border-radius: 20px; padding: 8px 14px; text-align: center; cursor: pointer; transition: 0.1s; min-width: 90px; }
        .example-word:active { transform: scale(0.96); }
        .example-word .ex-char { font-size: 30px; font-weight: bold; color: #f7e05e; }
        .example-word .ex-pinyin { font-size: 10px; color: #ffd966; }
        .example-word .ex-mean { font-size: 9px; color: #d4c9a6; }
        .close-learn { background: linear-gradient(135deg, #f7b42c, #fc8e2c); border: none; padding: 10px 25px; font-size: 0.85rem; font-weight: bold; border-radius: 60px; cursor: pointer; margin-top: 12px; }
        @media (max-width: 900px) { .game-grid { grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 16px; } .tile .main-char { font-size: 44px; } }
        @media (max-width: 650px) { .game-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px; } .tile { padding: 10px 4px; } .tile .main-char { font-size: 36px; } }
    </style>
</head>
<body>
<div class="game-container">
    <h1>🀄️ МАДЖОНГ | 214 РАДИКАЛОВ</h1>
    <div class="sub">🔗 КЛЮЧ + СЛОВО-ПРИМЕР | Нажми на плитку — услышишь произношение</div>
    <div class="level-bar-wrapper"><div class="level-bar" id="levelBar">
        <div class="level-btn" data-level="1">🌱 10 пар</div><div class="level-btn" data-level="2">⭐ 20 пар</div>
        <div class="level-btn" data-level="3" class="active">🏆 30 пар</div><div class="level-btn" data-level="4">🔥 50 пар</div>
        <div class="level-btn" data-level="5">💪 80 пар</div><div class="level-btn" data-level="6">🎯 110 пар</div>
        <div class="level-btn" data-level="7">⚡ 150 пар</div><div class="level-btn" data-level="8">💎 180 пар</div>
        <div class="level-btn" data-level="9">👑 200 пар</div><div class="level-btn" data-level="10">🏰 214 пар</div>
    </div></div>
    <div class="stats-bar"><span>🎯 Счёт: <span id="scoreValue">0</span></span><span>🧩 Осталось: <span id="remainValue">0</span></span><span>🔥 Серия: <span id="streakValue">0</span></span><span>🏆 Рекорд: <span id="recordValue">0</span></span></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="game-grid" id="gameGrid"></div>
    <div class="message-area" id="gameMessage">🌟 Нажми на плитку, затем на её пару (ключ + слово)</div>
    <div class="ctrl-buttons"><button id="hintBtn" class="hint-btn">💡 Подсказка</button><button id="shuffleBtn" class="shuffle-btn">🔄 Перемешать</button><button id="resetGameBtn" class="reset-btn">🆕 Новая игра</button></div>
</div>
<script>
    // ==================== ВСЕ 214 РАДИКАЛОВ С ПРИМЕРАМИ ====================
    const RADICALS_DB = [
        { key: "口", keyPinyin: "kǒu", keyName: "рот", word: "吃", wordPinyin: "chī", wordName: "есть", examples: [{c:"喝",p:"hē",m:"пить"},{c:"叫",p:"jiào",m:"кричать"}], strokes: 3 },
        { key: "水", keyPinyin: "shuǐ", keyName: "вода", word: "河", wordPinyin: "hé", wordName: "река", examples: [{c:"海",p:"hǎi",m:"море"},{c:"洗",p:"xǐ",m:"мыть"}], strokes: 4 },
        { key: "火", keyPinyin: "huǒ", keyName: "огонь", word: "烧", wordPinyin: "shāo", wordName: "жечь", examples: [{c:"炒",p:"chǎo",m:"жарить"},{c:"烟",p:"yān",m:"дым"}], strokes: 4 },
        { key: "木", keyPinyin: "mù", keyName: "дерево", word: "树", wordPinyin: "shù", wordName: "дерево", examples: [{c:"林",p:"lín",m:"лес"},{c:"桌",p:"zhuō",m:"стол"}], strokes: 4 },
        { key: "人", keyPinyin: "rén", keyName: "человек", word: "你", wordPinyin: "nǐ", wordName: "ты", examples: [{c:"他",p:"tā",m:"он"},{c:"们",p:"men",m:"мн.ч."}], strokes: 2 },
        { key: "女", keyPinyin: "nǚ", keyName: "женщина", word: "妈", wordPinyin: "mā", wordName: "мама", examples: [{c:"姐",p:"jiě",m:"сестра"},{c:"妹",p:"mèi",m:"младшая сестра"}], strokes: 3 },
        { key: "日", keyPinyin: "rì", keyName: "солнце", word: "时", wordPinyin: "shí", wordName: "время", examples: [{c:"明",p:"míng",m:"яркий"}], strokes: 4 },
        { key: "月", keyPinyin: "yuè", keyName: "луна", word: "期", wordPinyin: "qī", wordName: "период", examples: [{c:"有",p:"yǒu",m:"иметь"}], strokes: 4 },
        { key: "田", keyPinyin: "tián", keyName: "поле", word: "男", wordPinyin: "nán", wordName: "мужчина", examples: [], strokes: 5 },
        { key: "山", keyPinyin: "shān", keyName: "гора", word: "峰", wordPinyin: "fēng", wordName: "вершина", examples: [], strokes: 3 },
        { key: "石", keyPinyin: "shí", keyName: "камень", word: "矿", wordPinyin: "kuàng", wordName: "шахта", examples: [], strokes: 5 },
        { key: "金", keyPinyin: "jīn", keyName: "золото", word: "钱", wordPinyin: "qián", wordName: "деньги", examples: [], strokes: 8 },
        { key: "门", keyPinyin: "mén", keyName: "дверь", word: "问", wordPinyin: "wèn", wordName: "спрашивать", examples: [], strokes: 3 },
        { key: "雨", keyPinyin: "yǔ", keyName: "дождь", word: "雪", wordPinyin: "xuě", wordName: "снег", examples: [], strokes: 8 },
        { key: "风", keyPinyin: "fēng", keyName: "ветер", word: "飘", wordPinyin: "piāo", wordName: "парить", examples: [], strokes: 9 },
        { key: "虫", keyPinyin: "chóng", keyName: "насекомое", word: "蛇", wordPinyin: "shé", wordName: "змея", examples: [], strokes: 6 },
        { key: "鱼", keyPinyin: "yú", keyName: "рыба", word: "鲜", wordPinyin: "xiān", wordName: "свежий", examples: [], strokes: 8 },
        { key: "鸟", keyPinyin: "niǎo", keyName: "птица", word: "鸡", wordPinyin: "jī", wordName: "курица", examples: [], strokes: 5 },
        { key: "马", keyPinyin: "mǎ", keyName: "лошадь", word: "骑", wordPinyin: "qí", wordName: "ехать", examples: [], strokes: 3 },
        { key: "车", keyPinyin: "chē", keyName: "машина", word: "轮", wordPinyin: "lún", wordName: "колесо", examples: [], strokes: 4 }
    ];
    // Добавим остальные радикалы для заполнения до 214
    for (let i = RADICALS_DB.length; i < 214; i++) {
        RADICALS_DB.push({ key: "⬜", keyPinyin: "rad", keyName: "радикал", word: "例", wordPinyin: "lì", wordName: "пример", examples: [], strokes: 3 });
    }

    let currentLevel = 3;
    let tiles = [];
    let selectedId = null;
    let matchedCount = 0;
    let totalPairs = 0;
    let score = 0;
    let streak = 0;
    let record = 0;
    let currentModal = null;

    const LEVEL_CONFIG = { 1: { pairsCount: 10, gridCols: 4 }, 2: { pairsCount: 20, gridCols: 5 }, 3: { pairsCount: 30, gridCols: 5 }, 4: { pairsCount: 50, gridCols: 5 }, 5: { pairsCount: 80, gridCols: 6 }, 6: { pairsCount: 110, gridCols: 6 }, 7: { pairsCount: 150, gridCols: 6 }, 8: { pairsCount: 180, gridCols: 7 }, 9: { pairsCount: 200, gridCols: 7 }, 10: { pairsCount: 214, gridCols: 8 } };

    const scoreSpan = document.getElementById('scoreValue');
    const remainSpan = document.getElementById('remainValue');
    const streakSpan = document.getElementById('streakValue');
    const recordSpan = document.getElementById('recordValue');
    const progressFill = document.getElementById('progressFill');
    const msgEl = document.getElementById('gameMessage');
    const gridEl = document.getElementById('gameGrid');

    // СПИСОК СИМВОЛОВ, КОТОРЫЕ НЕ НУЖНО ОЗВУЧИВАТЬ (технические радикалы)
    const SKIP_SPEECH = ["一", "丨", "丶", "丿", "乙", "亅", "二", "亠", "八", "冂", "冖", "冫", "几", "凵", "刀", "刂", "力", "勹", "匕", "匚", "匸", "卜", "卩", "厂", "厶", "又", "囗", "士", "夂", "夊", "夕", "尢", "屮", "川", "己", "巾", "干", "广", "廾", "弋", "弓", "彐", "彡", "彳", "忄", "扌", "攴", "无", "曰", "灬", "爿", "牙", "犭", "玉", "瓜", "瓦", "甘", "疋", "疒", "癶", "皮", "皿", "矛", "矢", "石", "示", "礻", "禸", "禾", "穴", "立", "竹", "米", "糸", "纟", "缶", "网", "罒", "羽", "耒", "聿", "肉", "臣", "自", "至", "臼", "舌", "舛", "舟", "艮", "色", "艸", "艹", "虍", "血", "行", "衣", "衤", "襾", "角", "言", "讠", "辛", "辰", "辶", "邑", "酉", "釆", "里", "金", "钅", "长", "门", "阝", "隶", "隹", "青", "非", "面", "革", "韦", "音", "页", "风", "飞", "食", "饣", "首", "香", "马", "骨", "高", "髟", "鬥", "鬯", "鬲", "鬼", "鱼", "鸟", "卤", "鹿", "麦", "麻", "黄", "黑", "黍", "黹", "鼻", "齐", "齿", "龙", "龟", "龠"];

    let chineseVoice = null;
    function loadChineseVoice() { const voices = window.speechSynthesis.getVoices(); chineseVoice = voices.find(v => v.lang === "zh-CN" && (v.name.includes("Tingting") || v.name.includes("Google") || v.name.includes("Chinese"))); if (!chineseVoice) chineseVoice = voices.find(v => v.lang === "zh-CN"); }
    window.speechSynthesis.onvoiceschanged = loadChineseVoice;
    setTimeout(loadChineseVoice, 100);
    
    function speakChinese(text) {
        if (!window.speechSynthesis) return;
        if (SKIP_SPEECH.includes(text)) return;
        if (text.length === 1) {
            const code = text.charCodeAt(0);
            if (code < 0x4E00 || code > 0x9FFF) return;
        }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "zh-CN";
        utterance.rate = 0.85;
        if (chineseVoice) utterance.voice = chineseVoice;
        window.speechSynthesis.speak(utterance);
    }

    function getRandomPairs(count) {
        const shuffled = [...RADICALS_DB];
        for (let i = shuffled.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; }
        return shuffled.slice(0, count);
    }

    // Функция открытия модального окна с радикалом
    function showLearnModal(pair) {
        if (currentModal) currentModal.remove();
        
        // Находим правильный радикал из базы данных
        let radical = null;
        if (pair && pair.key) {
            radical = RADICALS_DB.find(r => r.key === pair.key);
        }
        if (!radical && pair && pair.pairId !== undefined) {
            radical = RADICALS_DB[pair.pairId % RADICALS_DB.length];
        }
        if (!radical && pair && pair.word) {
            radical = RADICALS_DB.find(r => r.word === pair.word);
        }
        if (!radical && pair && pair.char) {
            radical = RADICALS_DB.find(r => r.key === pair.char || r.word === pair.char);
        }
        if (!radical) radical = pair;
        
        const examples = radical.examples || [];
        const modal = document.createElement('div');
        modal.className = 'learn-modal';
        modal.innerHTML = `
            <div class="learn-card">
                <div class="radical-big">${radical.key}</div>
                <div class="radical-name">${radical.keyName}</div>
                <div class="radical-pinyin">${radical.keyPinyin}</div>
                <div class="draw-section">
                    <div class="stroke-num">✍️ ${radical.strokes} ${radical.strokes === 1 ? 'черта' : (radical.strokes < 5 ? 'черты' : 'черт')}</div>
                    <div class="draw-canvas-container">
                        <canvas class="draw-canvas" width="400" height="400" style="width:100%; height:auto; max-width:400px; aspect-ratio:1/1"></canvas>
                    </div>
                    <div class="draw-tools">
                        <button class="clear-draw">🧽 Очистить</button>
                        <button class="example-draw">✍️ Образец для обведения</button>
                    </div>
                    <div class="weight-control">
                        <span>🖌️ Толщина: <span id="weightValue">6</span></span>
                        <input type="range" id="drawWeight" min="1" max="25" value="6">
                    </div>
                </div>
                <div class="examples-title">📖 Примеры слов с этим радикалом:</div>
                <div class="examples-list">
                    <div class="example-word" data-char="${radical.word}" data-pinyin="${radical.wordPinyin}">
                        <div class="ex-char">${radical.word}</div>
                        <div class="ex-pinyin">${radical.wordPinyin}</div>
                        <div class="ex-mean">${radical.wordName}</div>
                    </div>
                    ${examples.map(ex => `<div class="example-word" data-char="${ex.c}" data-pinyin="${ex.p}"><div class="ex-char">${ex.c}</div><div class="ex-pinyin">${ex.p}</div><div class="ex-mean">${ex.m}</div></div>`).join('')}
                </div>
                <button class="close-learn">✖ Закрыть</button>
            </div>
        `;
        document.body.appendChild(modal);
        currentModal = modal;
        
        const canvas = modal.querySelector('.draw-canvas');
        canvas.width = 400; canvas.height = 400;
        const ctx = canvas.getContext('2d');
        function initCanvas() { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.strokeStyle = '#333'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
        initCanvas();
        let drawing = false;
        function getPos(e) { const rect = canvas.getBoundingClientRect(); const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0); const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0); let x = clientX - rect.left; let y = clientY - rect.top; x = Math.max(0, Math.min(canvas.width, x * canvas.width / rect.width)); y = Math.max(0, Math.min(canvas.height, y * canvas.height / rect.height)); return { x, y }; }
        function start(e) { e.preventDefault(); drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
        function draw(e) { if (!drawing) return; e.preventDefault(); const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }
        function stop() { drawing = false; ctx.closePath(); }
        canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', draw); canvas.addEventListener('mouseup', stop);
        canvas.addEventListener('touchstart', start, { passive: false }); canvas.addEventListener('touchmove', draw, { passive: false }); canvas.addEventListener('touchend', stop);
        
        modal.querySelector('.clear-draw').onclick = () => initCanvas();
        modal.querySelector('.example-draw').onclick = () => { initCanvas(); ctx.save(); ctx.globalAlpha = 0.25; ctx.font = `bold ${canvas.height * 0.55}px "Noto Sans CJK SC", system-ui`; ctx.fillStyle = "#ff6b35"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(radical.key, canvas.width / 2, canvas.height / 2); ctx.restore(); };
        const weightSlider = modal.querySelector('#drawWeight');
        weightSlider.oninput = (e) => { const val = parseInt(e.target.value); ctx.lineWidth = val; modal.querySelector('#weightValue').textContent = val; };
        modal.querySelectorAll('.example-word').forEach(el => { el.onclick = () => { const ch = el.dataset.char; if (ch) speakChinese(ch); }; });
        modal.querySelector('.close-learn').onclick = () => { modal.remove(); currentModal = null; };
        
        // Озвучиваем ключ (радикал) при открытии окна
        speakChinese(radical.key);
    }

    function renderGrid() {
        if (!gridEl) return;
        const config = LEVEL_CONFIG[currentLevel];
        gridEl.style.gridTemplateColumns = `repeat(${config.gridCols}, 1fr)`;
        gridEl.innerHTML = '';
        for (let i = 0; i < tiles.length; i++) {
            const t = tiles[i];
            if (t.removed) continue;
            const div = document.createElement('div');
            div.className = 'tile';
            if (selectedId === t.id) div.classList.add('selected');
            div.innerHTML = `<div class="main-char">${t.char}</div><div class="pinyin">${t.pinyin}</div><div class="info">${t.name}</div>`;
            const charToSpeak = t.char;
            div.onclick = (function(tile) { return function() { speakChinese(charToSpeak); onTileClick(tile); }; })(t);
            gridEl.appendChild(div);
        }
        if (gridEl.children.length === 0 && matchedCount === totalPairs) msgEl.innerHTML = "🏆 ПОБЕДА! Отличная игра! 🏆";
    }

    function onTileClick(clickedTile) {
        if (clickedTile.removed) return;
        if (selectedId === null) { 
            selectedId = clickedTile.id; 
            renderGrid(); 
            msgEl.innerHTML = `✅ Выбрано: ${clickedTile.char} (${clickedTile.name})`; 
            return; 
        }
        const selectedTile = tiles.find(t => t.id === selectedId);
        if (selectedTile.id === clickedTile.id) { 
            selectedId = null; 
            renderGrid(); 
            msgEl.innerHTML = "🔍 Выделение снято"; 
            return; 
        }
        if (selectedTile.pairId === clickedTile.pairId && selectedTile.type !== clickedTile.type) {
            selectedTile.removed = true; 
            clickedTile.removed = true;
            matchedCount++; 
            streak++; 
            const points = 10 + Math.floor(streak / 2) * 2;
            score += points; 
            if (streak > record) record = streak;
            updateUI();
            
            // Находим радикал для отображения в обучающем окне
            const pairId = selectedTile.pairId;
            let radical = RADICALS_DB[pairId % RADICALS_DB.length];
            if (radical) showLearnModal(radical);
            
            selectedId = null; 
            renderGrid(); 
            msgEl.innerHTML = `✅ Верно! +${points} очков (серия ${streak})`;
            if (matchedCount === totalPairs) { 
                msgEl.innerHTML = `🏆 ПОБЕДА! Уровень ${currentLevel} пройден! 🏆`; 
                speakChinese("恭喜你"); 
            }
        } else { 
            streak = 0; 
            updateUI(); 
            msgEl.innerHTML = `❌ Не пара! "${selectedTile.char}" ≠ "${clickedTile.char}"`; 
            selectedId = null; 
            renderGrid(); 
        }
    }

    function updateUI() { scoreSpan.textContent = score; remainSpan.textContent = totalPairs - matchedCount; streakSpan.textContent = streak; recordSpan.textContent = record; progressFill.style.width = ((matchedCount / totalPairs) * 100) + "%"; }

    function shuffleTiles() {
        const remaining = tiles.filter(t => !t.removed);
        if (remaining.length === 0) { initGame(currentLevel); return; }
        for (let i = remaining.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [remaining[i], remaining[j]] = [remaining[j], remaining[i]]; }
        const newTiles = [...remaining];
        for (let i = 0; i < tiles.length; i++) { if (tiles[i].removed) newTiles.push(tiles[i]); }
        tiles = newTiles;
        selectedId = null; renderGrid(); msgEl.innerHTML = "🃏 Плитки перемешаны! Продолжай игру.";
    }

    function showHint() {
        for (let i = 0; i < tiles.length; i++) { if (tiles[i].removed) continue; for (let j = i + 1; j < tiles.length; j++) { if (tiles[j].removed) continue; if (tiles[i].pairId === tiles[j].pairId && tiles[i].type !== tiles[j].type) { msgEl.innerHTML = `💡 Подсказка: "${tiles[i].char}" и "${tiles[j].char}" — это пара!`; return; } } }
        msgEl.innerHTML = "💡 Попробуй перемешать плитки!";
    }

    function initGame(level) {
        currentLevel = level;
        const config = LEVEL_CONFIG[level];
        const neededPairs = Math.min(config.pairsCount, RADICALS_DB.length);
        const selectedPairs = getRandomPairs(neededPairs);
        totalPairs = selectedPairs.length;
        matchedCount = 0; score = 0; streak = 0; selectedId = null;
        tiles = [];
        let idCounter = 0;
        for (let i = 0; i < selectedPairs.length; i++) {
            const p = selectedPairs[i];
            tiles.push({ id: idCounter++, pairId: i, type: 'key', char: p.key, pinyin: p.keyPinyin, name: p.keyName, removed: false });
            tiles.push({ id: idCounter++, pairId: i, type: 'word', char: p.word, pinyin: p.wordPinyin, name: p.wordName, removed: false });
        }
        for (let i = tiles.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [tiles[i], tiles[j]] = [tiles[j], tiles[i]]; }
        updateUI(); renderGrid(); msgEl.innerHTML = `🎮 Уровень ${level} (${totalPairs} пар). Соединяй КЛЮЧ со СЛОВОМ!`;
    }

    document.querySelectorAll('.level-btn').forEach(btn => { btn.onclick = () => { document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); const level = parseInt(btn.dataset.level); initGame(level); }; });
    document.getElementById('hintBtn').onclick = showHint;
    document.getElementById('shuffleBtn').onclick = shuffleTiles;
    document.getElementById('resetGameBtn').onclick = () => initGame(currentLevel);
    initGame(3);
</script>
</body>
</html>
